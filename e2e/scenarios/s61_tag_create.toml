name = "tag create: lightweight and annotated, then list"

[input]
steps = [
  { write = "f.txt", content = "v1\n" },
  { commit = "c1" },
]

[[run]]
cmd  = ["tag", "create", "v1.0.0"]
exit = 0

[[run]]
cmd  = ["tag", "create", "-m", "release two", "v2.0.0"]
exit = 0

[[run]]
cmd             = ["tag", "ls"]
exit            = 0
stdout_contains = ["v1.0.0", "v2.0.0"]

[expect]
branch = "main"
clean  = true
