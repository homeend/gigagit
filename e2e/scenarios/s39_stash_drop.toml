name = "stash drop: removes the stash without restoring the change"

[input]
steps = [
  { write = "a.txt", content = "v1\n" },
  { commit = "initial" },
  { write = "a.txt", content = "v2\n" },
  { stash = "wip" },
]

[[run]]
cmd  = ["stash", "drop", "stash@{0}"]
exit = 0

[expect]
branch  = "main"
stashes = 0                   # dropped

[expect.files]
"a.txt" = "v1\n"             # NOT restored (drop discards the stash)
