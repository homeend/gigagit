name = "tui: documents an agent writes by hand into the session-docs directory show in the TUI (spec 2026-10-18-gg-session-docs)"

# a.txt is committed. An agent writes an overview and a note on a.txt:2
# straight into the worktree's docs directory — no gg verb. The open-files
# window (ctrl+\) lists the overview with its author and age (2h under the
# frozen clock); opening it brings a.txt up beside it at the anchor, where
# the note's box shows (the noted file joined the list in the background,
# first — down selects the overview); esc puts the overview in the background (its row
# stays); D on its row asks, Delete unlinks the file and the row goes; the
# agent removing the note file takes the box away.
[input]
steps = [
  { write = "a.txt", content = "one\ntwo\nthree\nfour\nfive\n" },
  { commit = "add a" },
]

[tui]
size = "160x40"

[[tui.step]]
name = "overview-listed"
doc = { name = "20260101T220000-ab12.md", content = "+++\nformat = 1\ntitle = \"Tour of a\"\nauthor = \"agent\"\ncreated = 2026-01-01T22:00:00Z\n+++\n# Tour\n\nSee [two](a.txt:2).\n" }
keys = ["C-\\"]
screen_contains = ["Tour of a", "overview · 1 anchors · agent · 2h"]

[[tui.step]]
name = "note-box"
doc = { name = "20260101T220100-cd34.toml", content = "format = 1\npath = \"a.txt\"\nstart = 2\nend = 2\nsummary = \"why two?\"\nauthor = \"agent\"\nlines = [\"two\"]\n" }
keys = ["down", "enter"]
screen_contains = ["why two?", "Tour of a"]

[[tui.step]]
name = "delete-asks"
keys = ["esc", "C-\\", "down", "D"]
screen_contains = ["Delete this overview?", "Tour of a"]

[[tui.step]]
name = "deleted"
keys = ["up", "enter"]
screen_contains = ["[Open files 1]", "a.txt", "\"Tour of a\" deleted"]
screen_excludes = ["○ Tour of a", "● Tour of a"]

[[tui.step]]
name = "note-gone"
remove_doc = "20260101T220100-cd34.toml"
keys = ["enter"]
screen_contains = ["three"]
screen_excludes = ["why two?"]

[expect]
branch = "main"
