name = "tui: : goes to a line in the file viewer opened from F"

# A 60-line file opened from the working-tree files window (F → View file
# content): : opens the go-to-line prompt in the title, digits build the
# number, enter lands the cursor on that line, centred; a number past the end
# lands on the last line and says so.
[input]
steps = [
  { write = "long.txt", content = "line 1\nline 2\nline 3\nline 4\nline 5\nline 6\nline 7\nline 8\nline 9\nline 10\nline 11\nline 12\nline 13\nline 14\nline 15\nline 16\nline 17\nline 18\nline 19\nline 20\nline 21\nline 22\nline 23\nline 24\nline 25\nline 26\nline 27\nline 28\nline 29\nline 30\nline 31\nline 32\nline 33\nline 34\nline 35\nline 36\nline 37\nline 38\nline 39\nline 40\nline 41\nline 42\nline 43\nline 44\nline 45\nline 46\nline 47\nline 48\nline 49\nline 50\nline 51\nline 52\nline 53\nline 54\nline 55\nline 56\nline 57\nline 58\nline 59\nline 60\n" },
  { commit = "add long.txt" },
]

[tui]
size = "120x30"

[[tui.step]]
name = "viewer-prompt"
keys = ["F", "/", "long", "enter", "enter", "enter", ":", "45"]
screen_contains = [":45█", "line 1"]

[[tui.step]]
name = "viewer-landed"
keys = ["enter"]
screen_contains = ["line 45"]
screen_excludes = [":45█"]

[[tui.step]]
name = "viewer-past-end"
keys = [":", "99", "enter"]
screen_contains = ["line 99 is past the end of long.txt (60 lines)", "line 60"]
