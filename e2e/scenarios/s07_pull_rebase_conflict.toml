name = "pull: conflicting rebase stops in rebase-in-progress state"

[input]
steps = [
  { write = "shared.txt", content = "local\n" },
  { commit = "local change" },
]

[input.origin]
steps = [
  { write = "shared.txt", content = "base\n" },
  { commit = "initial" },
]
after = [
  { write = "shared.txt", content = "upstream\n" },
  { commit = "upstream change" },
]

[[run]]
cmd  = ["pull", "--on-conflict=rebase"]
exit = 1

[expect]
in_progress = "rebase"

[expect.status]
conflicted = ["shared.txt"]
