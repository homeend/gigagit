name = "tag annotate: turn a lightweight tag annotated"

[input]
steps = [
  { write = "f.txt", content = "v1\n" },
  { commit = "c1" },
  { tag = "v1.0.0" },
]

[[run]]
cmd  = ["tag", "annotate", "-m", "release one", "v1.0.0"]
exit = 0

[[run]]
cmd             = ["tag", "ls"]
exit            = 0
stdout_contains = ["v1.0.0"]

[expect]
clean = true
