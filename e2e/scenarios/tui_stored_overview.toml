name = "tui: a review's stored overview opens as a split — the overview steers the file pane, S stacks every file, esc returns to the ≡ Overview row"

# A commit adding a.txt (5 lines) and b.txt (3 lines), reviewed by an agent
# that stored an overview with one anchor into each file and one into a file
# the review never read (drawn plain). The review view lists ≡ Overview, then
# ≡ Summary (where it opens); ↑ enter opens the split: the overview on the left, the anchor's
# file on the right. ↓ steers to the next anchor, enter focuses the file,
# backspace returns, S stacks both files, esc closes back to the tree.
[input]
steps = [
  { write = "a.txt", content = "one\ntwo\nthree\nfour\nfive\n" },
  { write = "b.txt", content = "alpha\nbeta\ngamma\n" },
  { commit = "add a and b" },
]

[[run]]
cmd   = ["review", "save", "gg://{{cwd}}@{{rev:HEAD}}", "--agent", "Claude Code", "--stdin"]
stdin = '{"version":1,"summary":"## Summary\nfine","overview":"Start at [line two](a.txt:2), then [beta](b.txt:2), then [outside](zzz.go:1).","files":[{"path":"a.txt","annotations":[{"newRange":[2,2],"summary":"why two?"}]},{"path":"b.txt","annotations":[{"newRange":[2,2],"summary":"beta?"}]}]}'
exit  = 0

[tui]
size = "160x40"

[[tui.step]]
name = "files"
keys = ["right", "enter"]
wait = true
screen_contains = ["Reviews", "Claude Code"]

[[tui.step]]
name = "review"
keys = ["down", "enter"]
wait = true
screen_contains = ["≡ Summary", "≡ Overview", "a.txt", "b.txt"]

[[tui.step]]
name = "split"
keys = ["up", "enter"]
wait = true
screen_contains = ["Overview: ", "line two", "View a.txt @", "two", "[↑↓] anchor"]

[[tui.step]]
name = "steer"
keys = ["down"]
wait = true
screen_contains = ["View b.txt @", "beta"]

[[tui.step]]
name = "focus-right"
keys = ["enter"]
screen_contains = ["[n/p] anchors"]

[[tui.step]]
name = "back-left"
keys = ["bspace"]
screen_contains = ["[↑↓] anchor"]

[[tui.step]]
name = "stacked"
keys = ["S"]
wait = true
screen_contains = ["━━ a.txt", "━━ b.txt", "Files: ", "file 3/3"]

[[tui.step]]
name = "close"
keys = ["esc"]
screen_contains = ["≡ Overview"]

[expect]
branch = "main"
