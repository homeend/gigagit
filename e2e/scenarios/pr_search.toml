name = "cli: gg pr list --state/--search finds closed and merged pull requests"

# pr-list.json answers the plain (open) listing; pr-search.json answers every
# call that carries --search — which a gg search always does. The fake does not
# filter: what is asserted is WHICH listing each command reads.
[input]
steps = [
  { write = "a.go", content = "package a\n" },
  { commit = "base" },
  { write = ".git/fakegh/pr-list.json", content = '[{"number":7,"title":"Add forge tab","author":{"login":"alice"},"state":"OPEN","isDraft":false,"reviewDecision":"","headRefName":"feat/x7","isCrossRepository":false,"baseRefName":"main","baseRefOid":"1111111111111111111111111111111111111111","headRefOid":"2222222222222222222222222222222222222222","url":"https://example.test/pull/7","createdAt":"2026-08-01T10:00:00Z","updatedAt":"2026-09-02T11:30:00Z"}]' },
  { write = ".git/fakegh/pr-search.json", content = '[{"number":7,"title":"Add forge tab","author":{"login":"alice"},"state":"OPEN","isDraft":false,"reviewDecision":"","headRefName":"feat/x7","isCrossRepository":false,"baseRefName":"main","baseRefOid":"1111111111111111111111111111111111111111","headRefOid":"2222222222222222222222222222222222222222","url":"https://example.test/pull/7","createdAt":"2026-08-01T10:00:00Z","updatedAt":"2026-09-02T11:30:00Z"},{"number":5,"title":"Fix login redirect","author":{"login":"kim"},"state":"MERGED","isDraft":false,"reviewDecision":"","headRefName":"feat/x5","isCrossRepository":false,"baseRefName":"main","baseRefOid":"1111111111111111111111111111111111111111","headRefOid":"5555555555555555555555555555555555555555","url":"https://example.test/pull/5","createdAt":"2026-08-01T10:00:00Z","updatedAt":"2026-08-20T09:00:00Z"},{"number":3,"title":"Drop legacy login","author":{"login":"ana"},"state":"CLOSED","isDraft":false,"reviewDecision":"","headRefName":"feat/x3","isCrossRepository":false,"baseRefName":"main","baseRefOid":"1111111111111111111111111111111111111111","headRefOid":"3333333333333333333333333333333333333333","url":"https://example.test/pull/3","createdAt":"2026-08-01T10:00:00Z","updatedAt":"2026-08-10T09:00:00Z"}]' },
  { write = ".git/fakegh/pr-view-5.json", content = '{"number":5,"title":"Fix login redirect","author":{"login":"kim"},"state":"MERGED","isDraft":false,"reviewDecision":"","headRefName":"feat/x5","isCrossRepository":false,"baseRefName":"main","baseRefOid":"1111111111111111111111111111111111111111","headRefOid":"5555555555555555555555555555555555555555","url":"https://example.test/pull/5","createdAt":"2026-08-01T10:00:00Z","updatedAt":"2026-08-20T09:00:00Z","body":"Redirects after login."}' },
]

# The plain list stays the open pull requests.
[[run]]
cmd             = ["pr", "list"]
exit            = 0
stdout_contains = ["#7", "Add forge tab"]
stdout_excludes = ["#5", "#3"]

[[run]]
cmd             = ["pr", "list", "--state", "all"]
exit            = 0
stdout_contains = ["#7", "#5", "merged", "Fix login redirect", "#3", "closed", "Drop legacy login"]

# A text that is only a number is a direct lookup (gh pr view), not a search.
[[run]]
cmd             = ["pr", "list", "--search", "#5"]
exit            = 0
stdout_contains = ["#5", "merged", "Fix login redirect"]
stdout_excludes = ["#3", "#7"]

# Unknown number: an empty answer, not an error.
[[run]]
cmd             = ["pr", "list", "--search", "404"]
exit            = 0
stdout_contains = ["(no pull requests)"]

# One row beyond the limit exists: the rows are cut (the note goes to stderr).
[[run]]
cmd             = ["pr", "list", "--state", "all", "--limit", "2"]
exit            = 0
stdout_contains = ["#7", "#5"]
stdout_excludes = ["#3", "more results"]

[[run]]
cmd  = ["pr", "list", "--state", "nope"]
exit = 2

[expect]
branch = "main"
clean  = true
