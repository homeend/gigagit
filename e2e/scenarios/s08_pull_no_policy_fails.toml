name = "pull: divergence with no policy errors out (stdin is not a TTY)"

[input]
steps = [
  { write = "local.txt", content = "l\n" },
  { commit = "local change" },
]

[input.origin]
steps = [
  { write = "a.txt", content = "v1\n" },
  { commit = "initial" },
]
after = [
  { write = "upstream.txt", content = "u\n" },
  { commit = "upstream change" },
]

[[run]]
cmd  = ["pull"]
exit = 1

[expect]
branch = "main"
clean  = true

[[expect.log]]
subjects = ["local change", "initial"]   # repo untouched
