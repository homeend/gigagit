name = "tui: a saved merge preview with a note in it and a note on a branch commit"

# feature changes a.txt and adds c.txt in two commits. The saved preview
# "what feature brings into main" lists both files; its rows carry the notes
# written IN the preview — the one on a.txt — as ◆ N. The note written on the
# commit that added c.txt (--rev, outside the preview) is that commit's own:
# the preview does not show it. And the preview's review is the preview's: it
# is stored on the source TIP, but that commit shows nothing of it — no ✎, no
# review row — only its own c.txt note, ◆ 1.
[input]
steps = [
  { write = "a.txt", content = "a\n" }, { write = "b.txt", content = "b\n" },
  { commit = "add a b" },
  { branch = "feature" }, { switch = "feature" },
  { write = "a.txt", content = "a\nmore a\n" },
  { commit = "grow a" },
  { write = "c.txt", content = "c\n" },
  { commit = "add c" },
  { switch = "main" },
]

[[run]]
cmd = ["preview", "add", "--label", "feature into main", "feature", "main"]
exit = 0

[[run]]
cmd = ["note", "add", "--preview", "feature into main", "--file", "a.txt", "--new-line", "2", "--summary", "why more a?"]
exit = 0

[[run]]
cmd = ["note", "add", "--rev", "feature", "--file", "c.txt", "--new-line", "1", "--summary", "c is new"]
exit = 0

[tui]
size = "160x40"

[[tui.step]]
name = "previews"
keys = ["C-right", "C-right", "C-right"]
screen_contains = ["feature into main"]

[[tui.step]]
name = "preview-files"
keys = ["enter"]
screen_contains = ["a.txt  ◆ 1", "A  c.txt"]
screen_excludes = ["b.txt", "c.txt  ◆"]

# The tip "add c" stores two notes: its own c.txt note and the preview's a.txt
# note. Its Files view shows the commit's own only: the preview's review is
# read in the preview, never on a commit.
[[tui.step]]
keys = ["esc", "right"]

[[tui.step]]
name = "tip-files"
keys = ["enter"]
screen_contains = ["A  c.txt  ◆ 1  "]
screen_excludes = ["a.txt", "Range reviews", "feature → main  ◆"]

# a.txt is not a file of the commit: S stacks c.txt alone, with its own note.
[[tui.step]]
name = "tip-stack"
keys = ["down", "enter", "S"]
screen_contains = ["▾ A  c.txt", "c is new"]
screen_excludes = ["a.txt", "why more a?"]
