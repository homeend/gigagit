name = "tui: a saved merge preview with a note in it and a note on a branch commit"

# feature changes a.txt and adds c.txt in two commits. The saved preview
# "what feature brings into main" lists both files; its rows carry the notes
# gathered along the branch — the one written inside the preview (a.txt) and
# the one on the commit that added c.txt — as ◆ N. (A preview note is stored
# on the source TIP: Commits marks the tip "add c" as reviewed, ✎, and counts
# only its own c.txt note as ◆ 1.)
[input]
steps = [
  { write = "a.txt", content = "a\n" }, { write = "b.txt", content = "b\n" },
  { commit = "add a b" },
  { branch = "feature" }, { switch = "feature" },
  { write = "a.txt", content = "a\nmore a\n" },
  { commit = "grow a" },
  { write = "c.txt", content = "c\n" },
  { commit = "add c" },
  { switch = "main" },
]

[[run]]
cmd = ["preview", "add", "--label", "feature into main", "feature", "main"]
exit = 0

[[run]]
cmd = ["note", "add", "--preview", "feature into main", "--file", "a.txt", "--new-line", "2", "--summary", "why more a?"]
exit = 0

[[run]]
cmd = ["note", "add", "--rev", "feature", "--file", "c.txt", "--new-line", "1", "--summary", "c is new"]
exit = 0

[tui]
size = "160x40"

[[tui.step]]
name = "previews"
keys = ["C-right", "C-right", "C-right"]
screen_contains = ["feature into main"]

[[tui.step]]
name = "preview-files"
keys = ["enter"]
screen_contains = ["a.txt  ◆ 1", "c.txt  ◆ 1"]
screen_excludes = ["b.txt"]

# The tip "add c" holds two notes: its own c.txt note and the preview's a.txt
# note. a.txt is not a file of this commit, so its Files view lists the preview the
# note was written in as one Range review row — never a loose a.txt row — and
# every counted note stays reachable from the commit.
[[tui.step]]
keys = ["esc", "right"]

[[tui.step]]
name = "tip-files"
keys = ["enter"]
screen_contains = ["Range reviews", "feature → main  ◆ 1", "A  c.txt  ◆ 1  "]
screen_excludes = ["a.txt"]

# enter on the row opens the range the note was written in, frozen at this
# commit: both files of the branch, each with its notes.
[[tui.step]]
name = "tip-range"
keys = ["down", "enter"]
screen_contains = ["Range review: feature → main", "a.txt  ◆ 1", "c.txt  ◆ 1"]

# esc returns to the commit, the cursor on the row. a.txt is not a file of
# the commit: S stacks c.txt alone.
[[tui.step]]
name = "tip-stack"
keys = ["esc", "down", "enter", "S"]
screen_contains = ["▾ A  c.txt"]
screen_excludes = ["a.txt"]
