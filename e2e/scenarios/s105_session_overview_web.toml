name = "session overview with only gg web live: the web server answers from its store"

# The page attached the worktree's docs directory: an overview it files gets
# a minted id (<UTC second>-<4 hex>), so the runs match around the id.
# s106_session_docs_web shows, sets and removes an overview by a known id.
[input]
web = true
steps = [
  { write = "a.txt", content = "alpha\nbravo\ncharlie\n" },
  { commit = "seed" },
]

[[run]]
cmd             = ["session", "overview", "add", "--title", "T", "--background"]
stdin           = "[a](a.txt:2) and [gone](nope.txt)\n"
exit            = 0
stdout_contains = ["unresolved: nope.txt", " in the background"]

[[run]]
cmd             = ["session", "overview", "list"]
exit            = 0
stdout_contains = ["\tbackground\t2 anchors\tT"]

[[run]]
cmd             = ["session", "files"]
exit            = 0
stdout_contains = ["\t\"T\"\toverview"]

[[run]]
cmd             = ["session", "overview", "rm", "f1"]
exit            = 1
stderr_contains = ["no overview f1"]

[expect]
branch = "main"
