name = "tag checkout: create a branch at the tag and switch"

[input]
steps = [
  { write = "f.txt", content = "v1\n" },
  { commit = "c1" },
  { tag = "v1.0.0" },
  { write = "f.txt", content = "v2\n" },
  { commit = "c2" },
]

[[run]]
cmd  = ["tag", "checkout", "--branch", "rel", "v1.0.0"]
exit = 0

[expect]
branch = "rel"
clean  = true
