name = "tui: a file an overview opened draws every anchor of it as a band; n / p walk them"

# An agent's overview, written as a session document (gg session overview
# add writes the same file), names three places in a.txt: line 3, lines
# 10-12 and line 20. A document joins the open-files list in the background:
# ctrl+\ then enter on its row opens it beside the file (2026-10-10,
# overview split for every overview); ↓ steps to 10-12, which the file pane
# shows with all three drawn: the steered one marked ┃ in the gutter, the
# others ╎ (2026-10-07, overview anchor bands). tab moves to the file, where
# n steps to the next one — line 20 — and the status line names it; the
# overview keeps its selection and marks that anchor.
[input]
steps = [
  { write = "a.txt", content = """
line 1 of a
line 2 of a
line 3 of a
line 4 of a
line 5 of a
line 6 of a
line 7 of a
line 8 of a
line 9 of a
line 10 of a
line 11 of a
line 12 of a
line 13 of a
line 14 of a
line 15 of a
line 16 of a
line 17 of a
line 18 of a
line 19 of a
line 20 of a
line 21 of a
line 22 of a
line 23 of a
line 24 of a
line 25 of a
line 26 of a
line 27 of a
line 28 of a
line 29 of a
line 30 of a
line 31 of a
line 32 of a
line 33 of a
line 34 of a
line 35 of a
line 36 of a
line 37 of a
line 38 of a
line 39 of a
line 40 of a
""" },
  { commit = "seed" },
]

[tui]
size = "160x40"

[[tui.step]]
doc = { name = "20260101T220000-ab12.md", content = "+++\nformat = 1\ntitle = \"Tour\"\nauthor = \"agent\"\ncreated = 2026-01-01T22:00:00Z\n+++\n# Tour\n\n- [three](a.txt:3)\n- [ten to twelve](a.txt:10-12)\n- [twenty](a.txt:20)\n" }
keys = ["C-\\", "enter", "down", "tab"]
name = "opened"
screen_contains = ["┃ line 10 of a", "╎ line 3 of a", "╎ line 20 of a", "[n/p] anchors"]

[[tui.step]]
keys = ["n"]
name = "stepped"
screen_contains = ["anchor 3/3 in this file · twenty", "┃ line 20 of a", "╎ line 10 of a"]
