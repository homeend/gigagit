name = "worktree add --branch: missing branch, held branch, two positionals"

[input]
steps = [
  { write = "README.md", content = "hello\n" },
  { commit = "initial" },
  { branch = "feat" },
]

[[run]]
cmd  = ["worktree", "add", "--branch", "ghost"]        # no local branch (and no
exit = 1                                               # remote-DWIM creation)

[[run]]
cmd  = ["worktree", "add", "--branch", "main"]         # checked out in the main
exit = 1                                               # worktree -> guard

[[run]]
cmd  = ["worktree", "add", "--branch", "feat", "a", "b"] # one positional is the
exit = 2                                                 # path; two is a usage error

[expect]
branch    = "main"
branches  = ["feat", "main"]
worktrees = []                       # none of the three attempts created anything
