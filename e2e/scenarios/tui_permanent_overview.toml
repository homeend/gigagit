name = "tui: a permanent overview — └ Overview under its branch, ≡ on the commit, an Overviews row in the commit's files opens it as a split"

# One commit adding a.txt (5 lines) and b.txt (3 lines); an agent stores a
# permanent overview on HEAD (main) linking a.txt:2 (with a remark) and
# b.txt:2. The Branches list shows a └ Overview row under main (its tip is
# the overview's commit); the Commits row shows ≡ in its own marker cell;
# the commit's . menu does NOT list the overview (spec amended 2026-10-25):
# enter on the commit lists it under Overviews above the files, and enter
# on that row opens the split — the overview left, a.txt at the commit
# right with the remark; ↓ steers to b.txt; esc closes it, back on the row.
[input]
steps = [
  { write = "a.txt", content = "one\ntwo\nthree\nfour\nfive\n" },
  { write = "b.txt", content = "alpha\nbeta\ngamma\n" },
  { commit = "add a and b" },
]

[[run]]
cmd   = ["overview", "save", "--agent", "Claude Code", "--stdin"]
stdin = '{"version":1,"title":"How a and b work","overview":"Start at [two](a.txt:2), then [beta](b.txt:2).","files":[{"path":"a.txt","annotations":[{"newRange":[2,2],"summary":"why two?"}]}]}'
exit  = 0

[tui]
size = "160x40"

[[tui.step]]
name = "branches"
wait = true
screen_contains = ["└ Overview: How a and b work"]

[[tui.step]]
name = "commits"
keys = ["right"]
wait = true
screen_contains = ["≡", "add a and b"]

[[tui.step]]
name = "menu"
keys = ["."]
screen_contains = ["Copy commit id"]
screen_excludes = ["Open overview", "Export as HTML"]

[[tui.step]]
name = "files"
keys = ["esc", "enter"]
wait = true
screen_contains = ["Overviews", "└ How a and b work · ", "A  a.txt"]

[[tui.step]]
name = "split"
keys = ["down", "enter"]
wait = true
screen_contains = ["Overview: How a and b work", "View a.txt @", "two", "why two?"]

[[tui.step]]
name = "steer"
keys = ["down"]
wait = true
screen_contains = ["View b.txt @", "beta"]

[[tui.step]]
name = "close"
keys = ["esc"]
screen_excludes = ["│ Overview: How a and b work", "View b.txt @"]
screen_contains = ["Overviews", "└ How a and b work · ", "≡ *main add a and b"]
