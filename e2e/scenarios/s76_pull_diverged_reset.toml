name = "pull: reset on divergence hard-resets to the remote tip (local work discarded)"

[input]
steps = [
  { write = "local.txt", content = "l\n" },
  { commit = "local change" },
]

[input.origin]
steps = [
  { write = "a.txt", content = "v1\n" },
  { commit = "initial" },
]
after = [
  { write = "upstream.txt", content = "u\n" },
  { commit = "upstream change" },
]

[[run]]
cmd  = ["pull", "--on-conflict=reset"]
exit = 0

[expect]
branch = "main"
clean  = true
ahead  = 0                             # reset --hard origin/main → exactly the remote tip
behind = 0

# The local commit is gone; only the upstream history remains.
[[expect.log]]
subjects = ["upstream change", "initial"]
