name = "cherry-pick: conflict with --on-conflict=keep leaves it in progress (exit 1)"

[input]
steps = [
  { write = "shared.txt", content = "base\n" },
  { commit = "base" },
  { branch = "feat" },
  { switch = "feat" },
  { write = "shared.txt", content = "feat\n" },
  { commit = "feat change" },
  { switch = "main" },
  { write = "shared.txt", content = "main\n" },
  { commit = "main change" },
]

[[run]]
cmd  = ["cherry-pick", "--on-conflict=keep", "feat"]
exit = 1

[expect]
branch      = "main"
in_progress = "cherry-pick"
