name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser needs full history for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The test suite drives a real git in temp repos and inherits identity
      # from global config — absent on a fresh runner, every commit-making
      # test dies with "empty ident name" (exit 128).
      - name: Configure git identity for tests
        run: |
          git config --global user.name "gg-ci"
          git config --global user.email "gg-ci@users.noreply.github.com"
          git config --global init.defaultBranch main

      - name: Run tests
        run: go test ./...

      # Pinned to v2.17: our .goreleaser.yaml uses `brews:` (deprecated in
      # favor of homebrew_casks, which is macOS-only — the formula must keep
      # serving Linux brew users). A future goreleaser may remove `brews:`;
      # revisit before unpinning.
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2.17"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
