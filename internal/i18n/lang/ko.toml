"branch-pair compare only: cycle the origin filter — all differences / only files the marked branch changed / only files the selected branch changed (computed from the merge base; the diff shown per file is always the tip-to-tip difference)" = "브랜치 쌍 비교 전용: 출처 필터 전환 — 모든 차이 / 표시한 브랜치가 바꾼 파일만 / 선택한 브랜치가 바꾼 파일만 (병합 기점 기준 계산; 파일별 diff는 항상 끝 대 끝 차이)"
"commits side: the full Commits-panel menu (cherry-pick / revert / reset / create branch|worktree|tag / compare / …); tree side: copy path/name" = "커밋 쪽: Commits 패널 전체 메뉴 (cherry-pick / revert / reset / 브랜치|워크트리|태그 생성 / 비교 / …); 트리 쪽: 경로/이름 복사"
