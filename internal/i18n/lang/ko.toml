"action menu — context actions for the selected row and panel (incl. copy actions)" = "작업 메뉴 — 선택된 행과 패널의 컨텍스트 동작 (복사 동작 포함)"
"command palette — generic command launcher, opens over the panels OR any browse window (files tree, diff, history, blame, review, stash) (↑↓/jk move, enter runs, esc closes); includes Apply patch, File blame, File history, Find, Git config explorer, Open repo, Open shell, Run shell command, Set up agent skills, Show commit" = "명령 팔레트 — 범용 명령 실행기. 패널 위에서도, 어떤 탐색 창 (파일 트리, diff, 히스토리, blame, 리뷰, 스태시) 위에서도 열립니다 (↑↓/jk 이동, enter 실행, esc 닫기); Apply patch, File blame, File history, Find, Git config explorer, Open repo, Open shell, Run shell command, Set up agent skills, Show commit 포함"
"show commit by SHA: type a commit-ish (SHA / ref); enter resolves it and opens that commit's files in the files-view" = "SHA로 커밋 표시: 커밋 지시자 (SHA / 참조)를 입력; enter로 해석해 해당 커밋의 파일을 파일 뷰로 엽니다"
"Compare against working dir / Copy to working dir (.-menu): on any focused stash/commit/staged file, diffs that version against the same path in the working tree (Compare) or writes it into the working tree at its own path (Copy)" = "Compare against working dir / Copy to working dir (.-메뉴): 포커스된 스태시/커밋/스테이지 파일에서, 그 버전을 작업 트리의 같은 경로와 비교 (Compare)하거나 작업 트리의 그 경로에 기록 (Copy)"
"cycle the focused panel's sort order" = "포커스된 패널의 정렬 순서 전환"
"cycle the focused window's text display (cutoff / wrap / scroll)" = "포커스된 창의 텍스트 표시 전환 (자름 / 줄바꿈 / 스크롤)"
"maximize the focused left-column panel to fill the whole left column (t again restores); while maximized, ctrl+←/→ still cycles that slot's tabs" = "포커스된 왼쪽 열 패널을 왼쪽 열 전체로 최대화 (t 다시 누르면 복원); 최대화 중에도 ctrl+←/→로 그 슬롯의 탭 전환 가능"
"fullscreen whatever is focused — any panel OR any open popup — to a near-fullscreen box (ctrl+t or esc restores; on a panel, t drops back to the left column)" = "포커스된 것 — 어떤 패널이든 열린 팝업이든 — 을 거의 전체 화면 박스로 확대 (ctrl+t나 esc로 복원; 패널에서는 t로 왼쪽 열로 복귀)"
"open a shell in the repo worktree (emergency hatch — works over ANY window, incl. a failed conflict resolve; 'exit' returns to gg and reloads)" = "저장소 워크트리에서 셸 열기 (비상 탈출구 — 실패한 충돌 해결을 포함해 어떤 창 위에서도 동작; 'exit'로 gg에 돌아와 다시 로드)"
"scroll display mode: pan the focused window horizontally" = "스크롤 표시 모드: 포커스된 창을 가로로 이동"
"filter the focused panel" = "포커스된 패널 필터"
"clear the focused window's filtering — its / filter, or on the Commits panel the @ highlight and the \\ commit filter (other windows' filters are left untouched)" = "포커스된 창의 필터 지우기 — 그 / 필터, Commits 패널에서는 @ 강조와 \\ 커밋 필터도 (다른 창의 필터는 유지)"
"recall previous searches (history dropdown) while typing in the / filter, @ highlight, or the bookmark/shelf/files-tree search" = "/ 필터, @ 강조, 북마크/보관함/파일 트리 검색 입력 중 이전 검색 불러오기 (히스토리 드롭다운)"
"cycle panel focus forward / backward" = "패널 포커스를 앞 / 뒤로 순환"
"focus the left column / the Commits panel" = "왼쪽 열 / Commits 패널로 포커스"
"cycle the focused tab slot: top (Branches / Remotes / Worktrees), middle (Files / Tags), or bottom (Staged / Reflog)" = "포커스된 탭 슬롯 전환: 상단 (Branches / Remotes / Worktrees), 중간 (Files / Tags), 하단 (Staged / Reflog)"
"focus the window under the cursor and select the clicked row" = "커서 아래 창에 포커스하고 클릭한 행 선택"
"scroll the list under the cursor ([ui] wheel_step rows; files view: tree or commits)" = "커서 아래 목록 스크롤 ([ui] wheel_step 행; 파일 뷰: 트리 또는 커밋)"
"move the selection" = "선택 이동"
"page the selection (a quarter of the viewport)" = "선택을 페이지 단위로 이동 (뷰포트의 4분의 1)"
"clear the mark, then the active filter" = "표시 해제, 그다음 활성 필터 해제"
"commit the staged index (title + description popup)" = "스테이지된 인덱스 커밋 (제목 + 설명 팝업)"
"amend the last commit (edit message / fold in staged changes)" = "마지막 커밋 수정 (메시지 편집 / 스테이지된 변경 합치기)"
"reload all panels (keeps them visible while refreshing)" = "모든 패널 다시 로드 (새로 고치는 동안에도 계속 표시)"
"this help window" = "이 도움말 창"
"quit" = "종료"
"Branches panel" = "Branches 패널"
"create a branch off the selected one (popup). In the popup, ctrl+p picks a saved branch prefix (Settings → Branch prefixes) and seeds the name" = "선택한 브랜치에서 브랜치 생성 (팝업). 팝업에서 ctrl+p는 저장된 브랜치 접두사 (설정 → 브랜치 접두사)를 골라 이름 초깃값을 만듭니다"
"create a branch and switch to it" = "브랜치를 만들고 전환"
"delete the selected branch" = "선택한 브랜치 삭제"
"on a non-current branch: pull it in the background (stay on your branch) — same as the .-menu 'Pull <branch> (stay here)'" = "현재가 아닌 브랜치에서: 백그라운드로 풀 (내 브랜치에 머무름) — .-메뉴의 'Pull <branch> (stay here)'와 동일"
"go to the selected branch's tip in the Commits panel — jumps if the tip is loaded, otherwise deep-searches history for it (the ctrl+f machinery: clears the / filter, pages with a budget, asks before scanning deeper)" = "Commits 패널에서 선택한 브랜치의 끝(tip)으로 이동 — 끝이 로드돼 있으면 즉시 이동, 아니면 히스토리를 깊이 검색합니다 (ctrl+f 방식: / 필터 해제, 예산 내 페이징, 더 깊이 스캔하기 전 확인)"
"Solo the selected branch AND go to its tip: scopes the Commits feed to the branch (press again to un-solo) and lands the cursor on the tip once the reload finishes" = "선택한 브랜치를 단독 표시(Solo)하고 그 끝으로 이동: Commits 피드를 그 브랜치로 한정하고 (다시 누르면 해제) 재로드가 끝나면 커서를 끝에 둡니다"
"rename branch / copy branch name / Pull <branch> (stay here) / Solo this branch / Add to commit view / Go to tip in commits (.-menu)" = "브랜치 이름 변경 / 브랜치 이름 복사 / Pull <branch> (stay here) / Solo this branch / Add to commit view / Go to tip in commits (.-메뉴)"
"Solo this branch (.-menu): scope the Commits panel to this branch (re-run to un-solo); Add/Remove from commit view builds a multi-branch set; Show all branches clears it; Go to tip in commits jumps the Commits cursor to this branch's tip (enter does the same; both deep-search unloaded history when needed)" = "Solo this branch (.-메뉴): Commits 패널을 이 브랜치로 한정 (재실행 시 해제); Add/Remove from commit view는 다중 브랜치 집합 구성; Show all branches로 해제; Go to tip in commits는 Commits 커서를 이 브랜치 끝으로 이동 (enter도 동일; 둘 다 필요하면 로드되지 않은 히스토리를 깊이 검색)"
"Remotes panel" = "Remotes 패널"
"checkout: create or fast-forward a local tracking branch (stay on the current branch); on the current branch's own remote it prompts instead: pull now (when behind) / check out under a different name" = "체크아웃: 로컬 추적 브랜치를 생성하거나 패스트포워드 (현재 브랜치에 머무름); 현재 브랜치 자신의 원격이면 대신 묻습니다: 지금 풀 (뒤처졌을 때) / 다른 이름으로 체크아웃"
"checkout and switch to it — fast-forward-safe; a diverged local branch offers check-out-as-a-different-name" = "체크아웃하고 전환 — 패스트포워드 안전; 갈라진 로컬 브랜치에는 다른 이름으로 체크아웃 제안"
"Check out <remote> as… / Switch to <remote> as… (.-menu): materialize the remote branch under a local name you choose" = "Check out <remote> as… / Switch to <remote> as… (.-메뉴): 원격 브랜치를 직접 정한 로컬 이름으로 생성"
"fetch all remotes (updates tracking refs and the behind-counts)" = "모든 원격 페치 (추적 참조와 뒤처짐 카운트 갱신)"
"Prune (.-menu): drop tracking refs for branches deleted upstream" = "Prune (.-메뉴): 업스트림에서 삭제된 브랜치의 추적 참조 정리"
"copy remote branch name (.-menu)" = "원격 브랜치 이름 복사 (.-메뉴)"
"Worktrees panel" = "Worktrees 패널"
"switch into the selected worktree" = "선택한 워크트리로 전환"
"remove the selected worktree" = "선택한 워크트리 제거"
"Tags panel" = "Tags 패널"
"a tab in the middle (Files) box — ctrl+←/→ switches Files ⇄ Tags; ● annotated, ○ lightweight; ▲ marks tags that exist on the default remote (origin or first remote) — local-only or not-yet-checked tags show no marker (deliberately indistinguishable before a lookup runs)" = "중간 (Files) 박스의 탭 — ctrl+←/→로 Files ⇄ Tags 전환; ● 주석, ○ 경량; ▲는 기본 원격 (origin 또는 첫 원격)에 존재하는 태그 표시 — 로컬 전용이거나 아직 확인 안 된 태그는 표시 없음 (조회 전에는 의도적으로 구분되지 않음)"
"jump the Commits cursor to the tag's target commit" = "Commits 커서를 태그의 대상 커밋으로 이동"
"Check out tag (.-menu): detached HEAD, a new branch at the tag, or a new worktree (branch + dir prefilled from the tag name)" = "Check out tag (.-메뉴): detached HEAD, 태그 위치의 새 브랜치, 또는 새 워크트리 (브랜치와 디렉터리가 태그 이름으로 미리 채워짐)"
"Push tag (.-menu): push the tag to a remote (auto when only one, else pick)" = "Push tag (.-메뉴): 태그를 원격에 푸시 (하나뿐이면 자동, 아니면 선택)"
"Delete tag (.-menu): delete the selected tag after a confirm" = "Delete tag (.-메뉴): 확인 후 선택한 태그 삭제"
"Refresh remote status (.-menu): one-shot git ls-remote --tags; updates the ▲ marker for every visible tag; errors shown on the status line; for background auto-refresh see [refresh] remote_tags" = "Refresh remote status (.-메뉴): 일회성 git ls-remote --tags; 보이는 모든 태그의 ▲ 표시 갱신; 오류는 상태 줄에 표시; 백그라운드 자동 새로고침은 [refresh] remote_tags 참고"
"Shelf panel" = "Shelf 패널"
"frozen, non-git per-file copies (the default bucket); add via the . menu anywhere a file is focused" = "동결된, git 밖의 파일 단위 사본 (기본 버킷); 파일이 포커스된 곳 어디서든 . 메뉴로 추가"
"diff the shelved copy against the current working-tree file" = "보관함 사본을 현재 작업 트리 파일과 비교"
"mark an entry; mark a second to compare the two shelved copies side-by-side" = "항목 표시; 두 번째를 표시하면 두 보관함 사본을 나란히 비교"
"Restore to… (writes the copy to a path; prefilled with the original path, ctrl+r re-fills it) / Remove from shelf" = "Restore to… (사본을 경로에 기록; 원래 경로가 미리 채워짐, ctrl+r로 다시 채움) / Remove from shelf"
"Reflog panel" = "Reflog 패널"
"a tab in the bottom-left (Staged) box — ctrl+←/→ switches Staged ⇄ Reflog; lists the HEAD reflog (read-only), newest first" = "왼쪽 아래 (Staged) 박스의 탭 — ctrl+←/→로 Staged ⇄ Reflog 전환; HEAD reflog 나열 (읽기 전용), 최신순"
"open the entry's commit in the files view (changed files vs parent; even for dangling commits)" = "항목의 커밋을 파일 뷰로 열기 (부모 대비 변경 파일; dangling 커밋도 가능)"
"Copy SHA / Bookmark this commit / Shelf this commit (name it) (compare via the g switcher)" = "Copy SHA / Bookmark this commit / Shelf this commit (이름 지정) (비교는 g 스위처에서)"
"Reset to this entry (.-menu): move the current branch here (soft/mixed/hard) / Check out this entry (detached or as a new branch you switch to)" = "Reset to this entry (.-메뉴): 현재 브랜치를 여기로 이동 (soft/mixed/hard) / Check out this entry (detached 또는 전환할 새 브랜치로)"
"Files panel" = "Files 패널"
"stage the marked files (or the cursor row) — git add" = "표시한 파일 (또는 커서 행) 스테이지 — git add"
"stage hunks: open the region/line staging picker" = "헝크 스테이지: 영역/줄 단위 스테이징 피커 열기"
"stash changes: popup to name + pick files (ctrl+s confirms)" = "변경 스태시: 이름 짓고 파일을 고르는 팝업 (ctrl+s로 확정)"
"mark / unmark a file (multi-select for staging, stashing, discarding)" = "파일 표시 / 해제 (스테이지·스태시·버리기용 다중 선택)"
"side-by-side diff of the unstaged change (index → working tree)" = "스테이지 안 된 변경의 나란히 보기 diff (인덱스 → 작업 트리)"
"file history: commits that touched it (left) + per-commit diff (right)" = "파일 히스토리: 그 파일을 건드린 커밋 (왼쪽) + 커밋별 diff (오른쪽)"
"blame: who last changed each line, grouped by commit" = "blame: 각 줄을 마지막으로 바꾼 사람, 커밋별 그룹"
"discard the marked files (or the cursor row): revert edits, delete new files (confirm)" = "표시한 파일 (또는 커서 행) 버리기: 편집 되돌리고 새 파일 삭제 (확인)"
"discard ALL unstaged changes: revert every edit + delete every new file (confirm)" = "스테이지 안 된 모든 변경 버리기: 모든 편집 되돌리고 모든 새 파일 삭제 (확인)"
"on an untracked file: Add to .gitignore (this file, anchored) / Add extension to .gitignore (*.ext) — appends to the repo-root .gitignore" = "추적 안 된 파일에서: Add to .gitignore (이 파일, 고정) / Add extension to .gitignore (*.ext) — 저장소 루트 .gitignore에 추가"
"Edit in editor: open the selected file in $VISUAL/$EDITOR (vi/notepad fallback), then refresh" = "Edit in editor: 선택한 파일을 $VISUAL/$EDITOR (vi/notepad 대체)로 열고 나서 새로고침"
"Staged panel" = "Staged 패널"
"unstage the marked files (or the cursor row) — git restore --staged" = "표시한 파일 (또는 커서 행) 스테이지 해제 — git restore --staged"
"side-by-side diff of the staged change (HEAD → index)" = "스테이지된 변경의 나란히 보기 diff (HEAD → 인덱스)"
"Open staged version in external editor: open the index blob (the staged copy, distinct from the working file) in $VISUAL/$EDITOR, read-only" = "Open staged version in external editor: 인덱스 blob (스테이지된 사본, 작업 파일과 별개)을 $VISUAL/$EDITOR로 열기, 읽기 전용"
"mark / unmark a file; h history, b blame (as in Files)" = "파일 표시 / 해제; h 히스토리, b blame (Files와 동일)"
"Conflict resolution process (x)" = "충돌 해결 프로세스 (x)"
"enter / resume the conflict process (repo conflicted, or a merge/rebase paused after external resolution)" = "충돌 프로세스 진입 / 재개 (저장소가 충돌 중이거나, 외부 해결 후 일시 중지된 병합/리베이스)"
"move between conflicted files" = "충돌 파일 간 이동"
"pick hunks: open the line editor (both-modified files)" = "헝크 고르기: 줄 편집기 열기 (양쪽 수정 파일)"
"keep current / incoming (both-modified files)" = "current / incoming 유지 (양쪽 수정 파일)"
"keep modified / delete / keep base (modify-delete files)" = "수정 유지 / 삭제 / base 유지 (수정-삭제 파일)"
"mark resolved (after editing by hand)" = "해결됨 표시 (손으로 수정한 뒤)"
"mark all resolved" = "모두 해결됨 표시"
"run external tool (Claude/Junie/Meld…) configured for conflict resolution — Settings (,) → External tools" = "충돌 해결용으로 설정한 외부 도구 (Claude/Junie/Meld…) 실행 — 설정 (,) → 외부 도구"
"continue / abort the merge or rebase (once resolved)" = "병합 또는 리베이스 계속 / 중단 (해결 후)"
"cycle text display: cutoff / wrap / scroll" = "텍스트 표시 전환: 자름 / 줄바꿈 / 스크롤"
"leave the process (resume later with x); esc in a running step cancels it" = "프로세스 나가기 (x로 나중에 재개); 실행 중 단계에서 esc는 그 단계를 취소"
"Hunk picker (x conflict resolve / H stage)" = "헝크 피커 (x 충돌 해결 / H 스테이지)"
"switch the focused side (current ↔ incoming)" = "포커스 측 전환 (current ↔ incoming)"
"move the line cursor (steps across regions)" = "줄 커서 이동 (영역을 넘어 이동)"
"pick the cursor line (builds the result in pick order)" = "커서 줄 선택 (선택 순서대로 결과 구성)"
"take the whole region from current / incoming" = "영역 전체를 current / incoming에서 가져오기"
"take all regions from current / incoming" = "모든 영역을 current / incoming에서 가져오기"
"jump to the next / previous region" = "다음 / 이전 영역으로 이동"
"apply when every region is resolved" = "모든 영역이 해결되면 적용"
"cancel (close without resolving)" = "취소 (해결하지 않고 닫기)"
"Commits panel" = "Commits 패널"
"Commits (%s)" = "커밋 (%s)"
"shows commits from ALL local branches by default, in date order, with a single-line commit graph (natural order only; hidden while filtering/sorting); header shows the mode — Commits (all) / Commits (solo: <branch>)" = "기본적으로 모든 로컬 브랜치의 커밋을 날짜순으로, 한 줄 커밋 그래프와 함께 표시 (자연 순서만; 필터/정렬 중 숨김); 헤더에 모드 표시 — Commits (all) / Commits (solo: <branch>)"
"the left column is the branch the commit is on: BRIGHT *current/branch on that branch's tip, grayed otherwise; long names trim with … (select to reveal the full name); the commit id shows in the status bar. Filtering still matches the full id and full branch name" = "왼쪽 열은 커밋이 속한 브랜치: 그 브랜치 끝에서는 밝은 *current/branch, 그 외는 회색; 긴 이름은 …로 줄임 (선택하면 전체 이름 표시); 커밋 id는 상태 표시줄에 표시. 필터링은 여전히 전체 id와 전체 브랜치 이름을 대상으로 동작"
"in the Commits graph, ↓ marks a local branch's tip and ↑ the tip of its tracked remote (both together = local and remote in sync)" = "Commits 그래프에서 ↓는 로컬 브랜치 끝, ↑는 추적 원격의 끝 (둘 다 = 로컬과 원격 동기화)"
"show the selected commit's files in the left column (focus stays on the commit list)" = "선택한 커밋의 파일을 왼쪽 열에 표시 (포커스는 커밋 목록 유지)"
"drill into the selected commit's files: open the files view AND move focus to the file tree (l + focus tree)" = "선택한 커밋의 파일로 진입: 파일 뷰를 열고 포커스를 파일 트리로 이동 (l + 트리 포커스)"
"view the selected commit's full message in a scrollable popup; also works while the files view is open (the popup layers over the tree, esc returns to it)" = "선택한 커밋의 전체 메시지를 스크롤 팝업으로 보기; 파일 뷰가 열려 있어도 동작 (팝업이 트리 위에 겹치고 esc로 복귀)"
"open the selected commit's message in the external editor ($EDITOR, read-only)" = "선택한 커밋 메시지를 외부 편집기로 열기 ($EDITOR, 읽기 전용)"
"uncommitted work shows as ◇ Working tree / ◇ Staged rows atop the graph (only when dirty); l/enter diffs them (working tree vs index, index vs HEAD); commit-only actions are unavailable on them" = "커밋 안 된 작업은 그래프 위 ◇ Working tree / ◇ Staged 행으로 표시 (변경 있을 때만); l/enter로 diff (작업 트리 vs 인덱스, 인덱스 vs HEAD); 커밋 전용 동작은 사용 불가"
"the ◇ Working tree / ◇ Staged rows can be added (m) to the ◉ compare selection like commits — Compare selection then diffs a commit against your working copy or index" = "◇ Working tree / ◇ Staged 행도 커밋처럼 (m으로) ◉ 비교 선택에 추가 가능 — Compare selection이 커밋과 작업 사본 또는 인덱스를 비교"
"highlight search: keep all commits visible, dim non-matches (graph stays); ctrl+↑/↓ jump prev/next match; enter keeps, esc clears" = "강조 검색: 모든 커밋을 유지한 채 비일치 흐리게 (그래프 유지); ctrl+↑/↓로 이전/다음 일치 이동; enter 유지, esc 해제"
"Commits: eager search — page unloaded history for the next match of the active / filter or @ highlight query and jump to it; every press digs past the already-loaded commits and re-asks before scanning deeper" = "Commits: 적극 검색 — 활성 / 필터나 @ 강조 질의의 다음 일치를 아직 로드되지 않은 히스토리에서 페이징해 찾아 이동. 누를 때마다 이미 로드된 커밋 너머를 파고들며 더 깊이 스캔 전 다시 확인"
"Commits: load the next batch of commits now (without scrolling to the end)" = "Commits: 다음 커밋 묶음 즉시 로드 (끝까지 스크롤 없이)"
"jump to the top / bottom of the focused list; End on Commits also loads the next batch" = "포커스된 목록의 처음 / 끝으로 이동; Commits에서 End는 다음 묶음도 로드"
"filter commits by path / author / message / date (popup; empty fields clear that axis, ctrl+r clears all fields); graph hides while filtered" = "커밋을 경로 / 작성자 / 메시지 / 날짜로 필터 (팝업; 빈 필드는 그 축 해제, ctrl+r로 전부 지움); 필터 중 그래프 숨김"
"add / remove the selected commit (or ◇ Working tree / ◇ Staged row) to the ◉ compare selection; the . menu then drives Compare selection or Squash" = "선택한 커밋 (또는 ◇ Working tree / ◇ Staged 행)을 ◉ 비교 선택에 추가 / 제거; 이후 . 메뉴에서 Compare selection이나 Squash 실행"
"mark / unmark the selected commit for compare — the same ◉ set as m but capped at two: the second space-mark opens the comparison immediately (with 2 already marked, space a marked one to unmark first; esc clears ALL marks, or . → Unmark all commits). Re-opening the comparison already on screen keeps it (no reload)" = "선택한 커밋을 비교용으로 표시 / 해제 — m과 같은 ◉ 집합이지만 최대 2개: 두 번째 space 표시가 즉시 비교를 엽니다 (2개 표시된 상태에서는 표시된 것을 space로 먼저 해제; esc는 모든 표시 해제, 또는 . → Unmark all commits). 이미 화면에 있는 비교를 다시 열면 유지 (재로드 없음)"
"view message / open message in editor / rename commit / copy commit id / Create branch here / Create worktree here / Cherry-pick here / Revert this commit / Reset to this commit (soft|mixed|hard) / Compare against working tree / Compare against staged / Export commit as patch / Add to compare selection (space) / Unmark commit / Unmark all commits / Compare selection / Squash N commits / Drop N selected commits / Show all branches when soloed / Show as list|graph (.-menu)" = "메시지 보기 / 편집기로 메시지 열기 / 커밋 이름 변경 / 커밋 id 복사 / Create branch here / Create worktree here / Cherry-pick here / Revert this commit / Reset to this commit (soft|mixed|hard) / Compare against working tree / Compare against staged / Export commit as patch / Add to compare selection (space) / Unmark commit / Unmark all commits / Compare selection / Squash N commits / Drop N selected commits / Show all branches when soloed / Show as list|graph (.-메뉴)"
"Compare against working tree / Compare against staged (.-menu): open the files view as a whole-tree diff of this commit vs your working copy / the index; enter on a file diffs that path" = "Compare against working tree / Compare against staged (.-메뉴): 이 커밋과 작업 사본 / 인덱스의 전체 트리 diff로 파일 뷰 열기; 파일에서 enter로 그 경로 diff"
"grow the ◉ compare selection (a contiguous run of commits)" = "◉ 비교 선택 확장 (연속된 커밋 구간)"
"Compare selection (.-menu): toggle commits into the ◉ set (m / Add to compare selection / shift+↑↓), then Compare selection — 2 = the diff between them, 3+ = the combined diff of the range (oldest^..newest, refused from a root commit); Unmark all commits (N) empties it" = "Compare selection (.-메뉴): 커밋을 ◉ 집합에 토글 (m / Add to compare selection / shift+↑↓) 후 Compare selection — 2개 = 둘 사이 diff, 3개 이상 = 범위의 결합 diff (oldest^..newest, 루트 커밋에서는 거부); Unmark all commits (N)로 비움"
"Squash N commits (.-menu): with 2+ commits in the ◉ set, combine the selected commits into one (messages concatenated; reword afterward). When they aren't adjacent, a prompt offers Reorder & squash — the skipped in-between commits move to just after the squash. Off-branch selections are refused; conflicts pause for `git rebase --continue`" = "Squash N commits (.-메뉴): ◉ 집합에 커밋이 2개 이상일 때 선택한 커밋들을 하나로 합침 (메시지 연결; 이후 reword). 인접하지 않으면 Reorder & squash 제안 — 건너뛴 중간 커밋들은 squash 바로 뒤로 이동. 브랜치 밖 선택 거부; 충돌은 `git rebase --continue`를 위해 일시 중지"
"Drop N selected commits (.-menu): with 2+ commits in the ◉ set, delete them all in one interactive rebase (no adjacency needed; gaps stay). Off-branch / working-tree-or-staged selections are refused; conflicts pause for `git rebase --continue`. Drop commit (no set) drops just the cursor commit" = "Drop N selected commits (.-메뉴): ◉ 집합에 커밋이 2개 이상일 때 대화형 리베이스 한 번으로 전부 삭제 (인접 불필요; 간격 유지). 브랜치 밖 / 작업 트리·스테이지 선택 거부; 충돌은 `git rebase --continue`를 위해 일시 중지. Drop commit (집합 없음)은 커서 커밋만 삭제"
"on a commit that is a branch's tip: Rename branch <name> / Delete branch <name> (.-menu) — one pair per local tip; delete is hidden for a checked-out branch" = "브랜치 끝인 커밋에서: Rename branch <name> / Delete branch <name> (.-메뉴) — 로컬 끝마다 한 쌍; 체크아웃된 브랜치는 delete 숨김"
"on a non-merge commit of the current branch: Move commit up (newer) / Move commit down (older) / Drop commit (.-menu) — one-step interactive rebase; conflicts pause for `git rebase --continue`" = "현재 브랜치의 비병합 커밋에서: Move commit up (newer) / Move commit down (older) / Drop commit (.-메뉴) — 한 단계 대화형 리베이스; 충돌은 `git rebase --continue`를 위해 일시 중지"
"Show as list / Show as graph (.-menu): flat ●-gutter list vs the lane graph; lane color marks each commit's line of development" = "Show as list / Show as graph (.-메뉴): 평평한 ● 거터 목록 vs 레인 그래프; 레인 색이 각 커밋의 계보 표시"
"narrow / widen the commit graph window (in lanes); a ⋯ marks lanes beyond each edge" = "커밋 그래프 창 좁히기 / 넓히기 (레인 단위); ⋯는 각 가장자리 너머 레인 표시"
"pan the commit graph window left / right" = "커밋 그래프 창 왼쪽 / 오른쪽 이동"
"snap the commit graph window to the selected commit's node" = "커밋 그래프 창을 선택한 커밋 노드에 맞춤"
"more commits load automatically as you near the end" = "끝에 가까워지면 커밋이 자동으로 더 로드됩니다"
"Filter mode (/)" = "필터 모드 (/)"
"move the selection through the filtered rows" = "필터된 행 안에서 선택 이동"
"keep the filter and leave input mode" = "필터를 유지하고 입력 모드 나가기"
"cancel the filter" = "필터 취소"
"delete; any typed text narrows the list" = "삭제; 입력한 글자로 목록 좁힘"
"Worktree popup (w/W)" = "워크트리 팝업 (w/W)"
"next input field / confirm" = "다음 입력 필드 / 확정"
"edit the previewed branch name (new-branch mode)" = "미리보기의 브랜치 이름 편집 (새 브랜치 모드)"
"create the worktree" = "워크트리 생성"
"create the worktree and switch to it" = "워크트리를 만들고 전환"
"cancel" = "취소"
"Branch popup (b/B)" = "브랜치 팝업 (b/B)"
"create the branch" = "브랜치 생성"
"Commit popup (c/C)" = "커밋 팝업 (c/C)"
"switch field (title / description)" = "필드 전환 (제목 / 설명)"
"title: move to the description field; description: insert a newline" = "제목: 설명 필드로 이동; 설명: 줄바꿈 삽입"
"generate a commit message from the staged diff with a configured commit_message external agent (Settings → External tools) — fills the title/description fields for you to review; nothing commits until ctrl+s. More than one tool configured shows a numbered chooser; an unapproved command shows a first-run approval (remembered per repo); existing title/description text asks before being replaced; esc cancels an in-flight run" = "설정된 commit_message 외부 에이전트 (설정 → 외부 도구)로 스테이지된 diff에서 커밋 메시지 생성 — 검토할 수 있도록 제목/설명 필드를 채워 줌; ctrl+s 전에는 아무것도 커밋되지 않음. 도구가 여러 개면 번호 선택, 미승인 명령은 첫 실행 승인 표시 (저장소별 기억), 기존 제목/설명이 있으면 교체 전 확인; esc로 진행 중 실행 취소"
"toggle a wider / fullscreen commit box (easier to read a long generated message); ctrl+t again restores" = "더 넓은 / 전체 화면 커밋 박스 토글 (긴 생성 메시지 읽기 편함); ctrl+t 다시 누르면 복원"
"commit (or amend, when opened with C)" = "커밋 (C로 열었으면 수정)"
"Pair-op popup (m on a second row)" = "쌍 작업 팝업 (두 번째 행에서 m)"
"choose an operation (Branches: merge, rebase, interactive rebase)" = "작업 선택 (Branches: 병합, 리베이스, 대화형 리베이스)"
"run the operation (clears the mark)" = "작업 실행 (표시 해제)"
"close, keeping the mark" = "닫기, 표시는 유지"
"Interactive rebase editor" = "대화형 리베이스 편집기"
"set the row action: pick / reword / squash / drop" = "행 동작 설정: pick / reword / squash / drop"
"move the focused commit up / down" = "포커스된 커밋을 위 / 아래로 이동"
"move the cursor" = "커서 이동"
"start the rebase with the current plan" = "현재 계획으로 리베이스 시작"
"reset every row to pick, original order" = "모든 행을 pick·원래 순서로 초기화"
"cancel (close without rebasing)" = "취소 (리베이스 없이 닫기)"
"Commit files view (l)" = "커밋 파일 뷰 (l)"
"switch focus between the file tree and the commit list" = "파일 트리와 커밋 목록 간 포커스 전환"
"move on the focused side (commits side reloads the tree)" = "포커스된 쪽에서 이동 (커밋 쪽은 트리 재로드)"
"page the focused side" = "포커스된 쪽 페이지 이동"
"scroll the file tree from either side (wheel: 3)" = "어느 쪽에서든 파일 트리 스크롤 (휠: 3)"
"search the focused side: file paths (tree) or the commit list (commits side); enter keeps it, esc cancels" = "포커스된 쪽 검색: 파일 경로 (트리) 또는 커밋 목록 (커밋 쪽); enter 유지, esc 취소"
"tree side: diff of the selected file (changed-files mode vs parent; all-files mode vs the working tree). Commit-list side: drill in — move focus to the file tree" = "트리 쪽: 선택 파일 diff (변경 파일 모드는 부모와, 전체 파일 모드는 작업 트리와). 커밋 목록 쪽: 진입 — 포커스를 파일 트리로 이동"
"toggle all files: every file in the commit's tree (as if checked out) vs only the files it changed" = "전체 파일 토글: 커밋 트리의 모든 파일 (체크아웃한 것처럼) vs 변경한 파일만"
"tree side: View file — show the file's content at this commit (no diff) in the right pane ([↑/↓] scroll, [z] view mode, [esc] close, [←] back to the tree); Open in external editor — open that content in $VISUAL/$EDITOR, read-only" = "트리 쪽: View file — 이 커밋 시점 파일 내용을 오른쪽 창에 표시 (diff 없음) ([↑/↓] 스크롤, [z] 보기 모드, [esc] 닫기, [←] 트리로 복귀); Open in external editor — 그 내용을 $VISUAL/$EDITOR로 열기, 읽기 전용"
"view the underlying commit's full message in a popup over the tree (esc returns; commit views only, not stash/compare)" = "해당 커밋의 전체 메시지를 트리 위 팝업으로 보기 (esc 복귀; 커밋 뷰 전용, stash/compare 불가)"
"history of the selected file (tree side)" = "선택 파일 히스토리 (트리 쪽)"
"blame of the selected file (tree side)" = "선택 파일 blame (트리 쪽)"
"branch-pair compare only: cycle the origin filter — all differences / only files the marked branch changed / only files the selected branch changed (computed from the merge base; the diff shown per file is always the tip-to-tip difference)" = "브랜치 쌍 비교 전용: 출처 필터 전환 — 모든 차이 / 표시한 브랜치가 바꾼 파일만 / 선택한 브랜치가 바꾼 파일만 (병합 기점 기준 계산; 파일별 diff는 항상 끝 대 끝 차이)"
"commits side: the full Commits-panel menu (cherry-pick / revert / reset / create branch|worktree|tag / compare / …); tree side: copy path/name" = "커밋 쪽: Commits 패널 전체 메뉴 (cherry-pick / revert / reset / 브랜치|워크트리|태그 생성 / 비교 / …); 트리 쪽: 경로/이름 복사"
"commits side: narrow / widen / snap / pan the commit graph window (same as the Commits panel)" = "커밋 쪽: 커밋 그래프 창 좁히기 / 넓히기 / 맞춤 / 이동 (Commits 패널과 동일)"
"clear the search, then close" = "검색 지우고, 그다음 닫기"
"close" = "닫기"
"Stash window (S)" = "스태시 창 (S)"
"move the stash selection" = "스태시 선택 이동"
"page the stash list" = "스태시 목록 페이지 이동"
"open the file tree for the stash (then ←/→ focus tree/list, like commit files)" = "스태시의 파일 트리 열기 (그다음 ←/→로 트리/목록 포커스, 커밋 파일과 동일)"
"stash actions: apply / pop / drop (drop confirms; [z] mode in the menu)" = "스태시 동작: apply / pop / drop (drop은 확인; 메뉴에서 [z] 모드)"
"close the stash window" = "스태시 창 닫기"
"Diff view (enter)" = "Diff 뷰 (enter)"
"scroll one line" = "한 줄 스크롤"
"scroll one screen" = "한 화면 스크롤"
"next / previous change (also ctrl+↓/↑; press again at the end/start to wrap around)" = "다음 / 이전 변경 (ctrl+↓/↑도 가능; 끝/처음에서 다시 누르면 순환)"
"from the last / first change, press twice to step to the next / previous file in the list (a bottom-left cue advertises it; a notice names the new file)" = "마지막 / 첫 변경에서 두 번 누르면 목록의 다음 / 이전 파일로 이동 (왼쪽 아래 안내 표시; 알림이 새 파일 이름 표시)"
"jump to top / bottom of the file; at the edge a bottom-left cue appears and pressing it again steps to the previous / next file in the list (a notice names the new file)" = "파일 처음 / 끝으로 이동; 가장자리에서 왼쪽 아래 안내가 나타나고 다시 누르면 목록의 이전 / 다음 파일로 이동 (알림이 새 파일 이름 표시)"
