"pull (SmartPull: autostash, ff/rebase decisions). On the Branches panel, a non-current branch pulls in the background (stay here): ff its ref, pull in its worktree, or stash→switch→pull→switch-back. Slow ops confirm first (y/n; disable with [ui] disable_slow_op_confirm)." = "풀 (SmartPull: 자동 스태시, ff/리베이스 판단). Branches 패널에서 현재가 아닌 브랜치는 백그라운드에서 풀합니다 (여기 머무름): 참조 ff, 해당 워크트리에서 풀, 또는 스태시→전환→풀→복귀. 느린 작업은 먼저 확인합니다 (y/n; [ui] disable_slow_op_confirm으로 비활성화)."
