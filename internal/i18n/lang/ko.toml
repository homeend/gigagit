"bookmark quick-switcher: jump to / compare / paste a bookmarked file (the . menu on any file offers Bookmark this file and Compare against bookmark — pick a bookmark, then diff the focused file against it). In it (navigation-first): ↑↓/jk move, enter jumps (diffs the bookmark vs the working-tree file), e opens the bookmarked file in your external editor (read-only), p pastes to a typed path, t copies to a new dir under <repo>.tmp (works for file AND commit bookmarks), y copies the file's path, absolute path, or name to the clipboard, m marks one then a second to compare, c compares the highlighted bookmark against a shelf entry, x removes (confirms), / filters, ? shows the key list, esc closes" = "북마크 퀵 스위처: 북마크한 파일로 이동 / 비교 / 붙여넣기 (모든 파일의 . 메뉴에 Bookmark this file과 Compare against bookmark가 있습니다 — 북마크를 고르면 포커스된 파일과의 차이를 표시). 스위처 안 (내비게이션 우선): ↑↓/jk 이동, enter로 이동 (북마크와 작업 트리 파일의 차이 표시), e로 북마크한 파일을 외부 편집기에서 열기 (읽기 전용), p로 입력한 경로에 붙여넣기, t로 <repo>.tmp 아래 새 디렉터리에 복사 (파일과 커밋 북마크 모두 지원), y로 파일 경로·절대 경로·이름을 클립보드에 복사, m으로 하나 표시 후 두 번째로 비교, c로 강조된 북마크를 보관함 항목과 비교, x로 제거 (확인), /로 필터, ?로 키 목록, esc로 닫기"
"shelf quick-switcher: the . menu on any file also offers Compare against shelf. In it (navigation-first): ↑↓/jk move, enter diffs a file entry vs the working-tree file — on a shelved COMMIT it opens the files view with the frozen files (enter diffs each vs the working tree; the . menu's Copy to working dir restores one), e opens the shelved copy in your external editor (read-only), p restores to a path (prefilled with the original path; ctrl+r re-fills it), t copies to a new dir under <repo>.tmp, y copies the file's path, absolute path, or name to the clipboard, m marks one then a second to compare two entries, c compares the highlighted entry against a bookmark, x removes (confirms), / filters, ? shows the key list, esc closes" = "보관함 퀵 스위처: 모든 파일의 . 메뉴에는 Compare against shelf도 있습니다. 스위처 안 (내비게이션 우선): ↑↓/jk 이동, enter로 파일 항목과 작업 트리 파일의 차이 표시 — 보관함에 저장된 커밋이면 동결된 파일들로 파일 뷰를 엽니다 (enter로 각 파일을 작업 트리와 비교; . 메뉴의 Copy to working dir로 하나 복원), e로 보관함 사본을 외부 편집기에서 열기 (읽기 전용), p로 경로에 복원 (원래 경로가 미리 채워짐; ctrl+r로 다시 채움), t로 <repo>.tmp 아래 새 디렉터리에 복사, y로 파일 경로·절대 경로·이름을 클립보드에 복사, m으로 하나 표시 후 두 번째로 두 항목 비교, c로 강조된 항목을 북마크와 비교, x로 제거 (확인), /로 필터, ?로 키 목록, esc로 닫기"
"notification center: health recommendations for this repo (e.g. write a commit-graph on a big repo — makes commit browsing ~10× faster). ↑↓ select, enter shows a notice's actions, esc closes. 'Not now' asks again next load; 'Never for this repo' is remembered in prompts.toml" = "알림 센터: 이 저장소의 상태 권장 사항 (예: 큰 저장소에 commit-graph 작성 — 커밋 탐색이 약 10× 빨라짐). ↑↓ 선택, enter로 알림의 동작 표시, esc로 닫기. 'Not now'는 다음 로드 때 다시 묻고, 'Never for this repo'는 prompts.toml에 기억됩니다"
