"  (every remote branch is already tracked)" = "  (모든 원격 브랜치가 이미 추적되고 있음)"
"browse remote branches: %s" = "원격 브랜치 탐색: %s"
"browse remote branches: no remotes configured" = "원격 브랜치 탐색: 설정된 리모트가 없습니다"
"Checkout %s (stay on current branch)" = "%s 체크아웃 (현재 브랜치 유지)"
"Checkout %s and switch to it" = "%s 체크아웃 후 전환"
"[enter] checkout" = "[enter] 체크아웃"
"Browse remote branches (ctrl+p palette or the Branches .-menu): lists branches that exist on the remote but are not fetched locally (a narrowed fetch refspec hides them); enter checks one out — stay or switch — adding a per-branch fetch mapping first" = "원격 브랜치 탐색 (ctrl+p 팔레트 또는 Branches 패널의 .-메뉴): 리모트에는 있지만 로컬로 가져오지 않은 브랜치를 나열합니다 (좁혀진 fetch refspec 이 숨기는 브랜치); enter 로 체크아웃 — 현재 브랜치 유지 또는 전환 — 하기 전에 브랜치별 fetch 매핑을 추가합니다"
