"%s/%s is not tracked by the fetch refspec — tip markers and ahead/behind cannot follow it. Add a tracking mapping for this branch?" = "%s/%s не отслеживается fetch refspec — маркеры вершин и ahead/behind не смогут обновляться. Добавить отображение для этой ветки?"
"; mapped %s/%s for tracking" = "; настроено отслеживание %s/%s"
"; could not add fetch mapping: %s" = "; не удалось добавить fetch-отображение: %s"
"; fetch mapping added but fetch failed: %s" = "; отображение добавлено, но fetch не удался: %s"
"mapped 1 branch for tracking" = "настроено отслеживание 1 ветки"
"mapped %d branches for tracking" = "настроено отслеживание веток: %d"
"no branches to map" = "нет веток для отображения"
"add" = "добавить"
"1 branch isn't tracked by the fetch refspec" = "1 ветка не отслеживается fetch refspec"
"%d branches aren't tracked by the fetch refspec" = "веток не отслеживается fetch refspec: %d"
"This clone's fetch refspec doesn't map these branches, so a push never moves their remote-tracking ref — the ↓↑ tip markers and ahead/behind cannot follow them: %s" = "fetch refspec этого клона не отображает эти ветки: push не двигает их remote-tracking ref — маркеры ↓↑ и ahead/behind не обновляются: %s"
"gg can add a per-branch mapping and fetch just those branches (no mass download)." = "gg может добавить отображение для каждой ветки и получить только их (без массовой загрузки)."
"Add mappings + fetch these branches" = "Добавить отображения и получить эти ветки"
"no git locks to remove" = "нет git-блокировок для удаления"
"removing git lock" = "удаление git-блокировки"
"removing %s" = "удаление %s"
"removed 1 stale git lock" = "удалена 1 устаревшая git-блокировка"
"removed %d stale git locks" = "удалено устаревших git-блокировок: %d"
"git locks were already gone" = "git-блокировки уже отсутствовали"
"A git lock file is present — operations will fail" = "присутствует файл git-блокировки — операции будут завершаться ошибкой"
"%d git lock files are present — operations will fail" = "файлов git-блокировки: %d — операции будут завершаться ошибкой"
"git creates a lock file while it rewrites the file beside it and removes it on exit, so one left behind means a git process was killed before it could clean up." = "git создаёт файл блокировки на время перезаписи соседнего файла и удаляет его при выходе, поэтому оставшийся файл означает, что процесс git был убит до очистки."
"Until it is removed, git refuses to run with \"Another git process seems to be running in this repository\"." = "Пока файл не удалён, git отказывается работать с сообщением \"Another git process seems to be running in this repository\"."
"Only remove these if no other git is running right now — a live git holding one is doing real work, and deleting its lock would corrupt that write." = "Удаляйте только если сейчас не запущен другой git — удаление блокировки работающего git повредит его запись."
"Remove the lock file" = "Удалить файл блокировки"
"Remove the lock files" = "Удалить файлы блокировки"
"less than a minute old" = "менее минуты назад"
"%dm old" = "%d мин назад"
"%dh old" = "%d ч назад"
"%dd old" = "%d дн назад"
"  — press [!] to remove the lock" = "  — нажмите [!], чтобы удалить блокировку"
