"closed, merged and open pull requests — text goes to the forge's search; a number opens that pull request" = "закрытые, слитые и открытые пул-реквесты — текст передаётся в поиск форджа; номер открывает этот пул-реквест"
"search the forge for pull requests of any state — closed and merged ones included: the text goes to the forge's own search (GitHub qualifiers such as author:name or head:branch work), [tab] cycles all / closed / merged / open, a bare number opens that pull request; the 50 newest-updated matches are listed and act like rows of the tab (enter, i, y); closing a diff or the details returns to the results, and the last search is remembered for the session" = "поиск пул-реквестов в любом состоянии на фордже, включая закрытые и слитые: текст передаётся в собственный поиск форджа (работают квалификаторы GitHub, например author:name или head:branch), [tab] переключает все / закрытые / слитые / открытые, одно число открывает этот пул-реквест; показываются 50 последних по обновлению совпадений, они ведут себя как строки вкладки (enter, i, y); закрытие диффа или сведений возвращает к результатам, а последний поиск запоминается на время сеанса"
