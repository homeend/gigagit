"review notes work in a saved commit pair as in a merge preview: they sit on the newer commit (new side only — the older commit is not addressable), ◆N counts them on the row and per file, c adds one, } / { step between them; an agent writes them through the pair link or gg note add --preview <a>..<b>" = "заметки ревью работают в сохранённой паре коммитов так же, как в предпросмотре слияния: они привязаны к более новому коммиту (только новая сторона — старый коммит не адресуется), ◆N считает их в строке и по файлам, c добавляет заметку, } / { переходят между ними; агент пишет их через ссылку на пару или gg note add --preview <a>..<b>"
