"Compare with link… (ctrl+p palette): compares any two gg:// links — type or paste them, or press ↓ to pick from the links you copied; ctrl+s swaps the sides. A link that names a whole branch, tag or commit gets a base row under it: enter on that row bounds the link (a branch against its upstream or trunk, a commit against its parent) so the comparison lists only what it changed; leave the row alone to compare the whole tree" = "Сравнить со ссылкой… (палитра ctrl+p): сравнивает любые две ссылки gg:// — введите или вставьте их либо нажмите ↓, чтобы выбрать из скопированных; ctrl+s меняет стороны местами. Под ссылкой на целую ветку, тег или коммит появляется строка базы: enter на ней ограничивает ссылку (ветку — относительно upstream или trunk, коммит — относительно родителя), и сравнение покажет только её изменения; не трогайте строку, чтобы сравнить всё дерево"
"[tab] next  [ctrl+s] swap  [enter] compare  [esc] close" = "[tab] далее  [ctrl+s] поменять  [enter] сравнить  [esc] закрыть"
