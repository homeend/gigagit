"Global" = "Глобальные"
"pull (SmartPull: autostash, ff/rebase decisions). On the Branches panel, a non-current branch pulls in the background (stay here): ff its ref, pull in its worktree, or stash→switch→pull→switch-back. Slow ops confirm first (y/n; disable with [ui] disable_slow_op_confirm)." = "подтянуть (SmartPull: автозаначка, решения ff/перебазирование). На панели Branches не-текущая ветка подтягивается в фоне (остаться здесь): ff её ссылки, pull в её рабочем дереве или заначка→переключение→pull→обратно. Медленные операции сначала просят подтверждение (y/n; отключается через [ui] disable_slow_op_confirm)."
"push the current branch (sets upstream)" = "отправить текущую ветку (устанавливает upstream)"
"Push <branch> (.-menu on the Branches panel): push the highlighted branch (sets upstream) — works for any local branch, current or not, including one never pushed before; no checkout needed" = "Push <branch> (.-меню на панели Branches): отправить выделенную ветку (устанавливает upstream) — работает для любой локальной ветки, текущей или нет, включая ни разу не отправлявшуюся; переключение не нужно"
"Force push <branch> (.-menu on the Branches panel, current branch): force-push the current branch — a modal offers force-with-lease (refuses if the remote moved under you) or force (overwrites the remote unconditionally); esc aborts" = "Force push <branch> (.-меню на панели Branches, текущая ветка): принудительно отправить текущую ветку — модальное окно предлагает force-with-lease (отказ, если удалённая ветка успела уйти вперёд) или force (безусловно перезаписывает удалённую); esc отменяет"
"switch to the selected branch (SmartSwitch); if it's in another worktree, offers to jump there. Confirms first (y/n)." = "переключиться на выбранную ветку (SmartSwitch); если она в другом рабочем дереве, предлагает перейти туда. Сначала подтверждение (y/n)."
"open the stash window (list all stashes)" = "открыть окно заначек (список всех заначек)"
"undo the last commit (soft, ref-only)" = "отменить последний коммит (soft, только ссылка)"
"bookmark quick-switcher: jump to / compare / paste a bookmarked file (the . menu on any file offers Bookmark this file and Compare against bookmark — pick a bookmark, then diff the focused file against it). In it (navigation-first): ↑↓/jk move, enter jumps (diffs the bookmark vs the working-tree file), e opens the bookmarked file in your external editor (read-only), p pastes to a typed path, t copies to a new dir under <repo>.tmp (works for file AND commit bookmarks), y copies the file's path, absolute path, or name to the clipboard, m marks one then a second to compare, c compares the highlighted bookmark against a shelf entry, x removes (confirms), / filters, ? shows the key list, esc closes" = "быстрый переключатель закладок: перейти к / сравнить / вставить файл из закладок (в . меню любого файла есть Bookmark this file и Compare against bookmark — выберите закладку, и сфокусированный файл сравнится с ней). Внутри (сначала навигация): ↑↓/jk — перемещение, enter — переход (дифф закладки с файлом рабочего дерева), e — открыть файл закладки во внешнем редакторе (только чтение), p — вставить по введённому пути, t — скопировать в новый каталог под <repo>.tmp (работает для файловых И коммитных закладок), y — скопировать путь, абсолютный путь или имя файла в буфер обмена, m — отметить одну, затем вторую для сравнения, c — сравнить выделенную закладку с записью полки, x — удалить (с подтверждением), / — фильтр, ? — список клавиш, esc — закрыть"
"shelf quick-switcher: the . menu on any file also offers Compare against shelf. In it (navigation-first): ↑↓/jk move, enter diffs a file entry vs the working-tree file — on a shelved COMMIT it opens the files view with the frozen files (enter diffs each vs the working tree; the . menu's Copy to working dir restores one), e opens the shelved copy in your external editor (read-only), p restores to a path (prefilled with the original path; ctrl+r re-fills it), t copies to a new dir under <repo>.tmp, y copies the file's path, absolute path, or name to the clipboard, m marks one then a second to compare two entries, c compares the highlighted entry against a bookmark, x removes (confirms), / filters, ? shows the key list, esc closes" = "быстрый переключатель полки: в . меню любого файла есть и Compare against shelf. Внутри (сначала навигация): ↑↓/jk — перемещение, enter — дифф файловой записи с файлом рабочего дерева — на отложенном КОММИТЕ открывает представление файлов с замороженными файлами (enter сравнивает каждый с рабочим деревом; Copy to working dir в . меню восстанавливает один), e — открыть копию с полки во внешнем редакторе (только чтение), p — восстановить по пути (предзаполнен исходный путь; ctrl+r заполняет заново), t — скопировать в новый каталог под <repo>.tmp, y — скопировать путь, абсолютный путь или имя файла в буфер обмена, m — отметить одну, затем вторую для сравнения двух записей, c — сравнить выделенную запись с закладкой, x — удалить (с подтверждением), / — фильтр, ? — список клавиш, esc — закрыть"
"notification center: health recommendations for this repo (e.g. write a commit-graph on a big repo — makes commit browsing ~10× faster). ↑↓ select, enter shows a notice's actions, esc closes. 'Not now' asks again next load; 'Never for this repo' is remembered in prompts.toml" = "центр уведомлений: рекомендации по здоровью этого репозитория (например, записать commit-graph в большом репозитории — просмотр коммитов станет примерно в 10× быстрее). ↑↓ — выбор, enter — действия уведомления, esc — закрыть. 'Not now' спросит при следующей загрузке; 'Never for this repo' запоминается в prompts.toml"
"fuzzy file finder: opens a picker over every tracked file; press / then type a query (fvgo → files_view.go) to filter by path, ↑↓/pgup/pgdn to move, enter to open a per-file menu (View content, Diff HEAD↔working tree, History, Blame, Open in editor, Copy path, Copy absolute path), esc closes" = "нечёткий поиск файлов: открывает список всех отслеживаемых файлов; нажмите /, введите запрос (fvgo → files_view.go) для фильтра по пути, ↑↓/pgup/pgdn — перемещение, enter — меню файла (просмотр содержимого, дифф HEAD↔рабочее дерево, история, blame, открыть в редакторе, копировать путь, копировать абсолютный путь), esc — закрыть"
"worktree popup for the selected branch — the branch name starts as the selection (clean directory); e edits it (a different name creates a NEW branch from it), p seeds it from a saved branch prefix (Settings → Branch prefixes)" = "окно рабочего дерева для выбранной ветки — имя ветки начинается с самого выбора (чистый каталог); e редактирует его (другое имя создаёт НОВУЮ ветку от него), p подставляет сохранённый префикс ветки (Настройки → Префиксы веток)"
"the same worktree popup with create & switch as enter's default (w + switch in one flow)" = "то же окно рабочего дерева, где enter по умолчанию создаёт и переключает (w + переключение за один шаг)"
"mark a row; m on a second row opens the pair-op picker (merge / rebase / interactive rebase / compare branches)" = "отметить строку; m на второй строке открывает выбор парной операции (слияние / перебазирование / интерактивное перебазирование / сравнение веток)"
"repo switcher popup (navigation-first: ↑↓/jk/pgup/pgdn move, / filters, enter switches — while filtering, the first enter locks the filter)" = "окно переключения репозиториев (сначала навигация: ↑↓/jk/pgup/pgdn — перемещение, / — фильтр, enter — переключение; при фильтрации первый enter фиксирует фильтр)"
