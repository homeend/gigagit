"inside a pull request's diff its review threads show as read-only note boxes on their lines (a whole-file comment sits at the top of the file; a resolved thread starts collapsed — o / O collapse and expand); [i] opens the pull request's details from there, [r] re-reads the comments, and they are re-read on the same [refresh] prs timer while the diff is open" = "внутри diff пул-реквеста его ветки ревью показываются как заметки только для чтения на своих строках (комментарий ко всему файлу стоит в начале файла; решённая ветка изначально свёрнута — o / O сворачивают и разворачивают); [i] открывает оттуда сведения о пул-реквесте, [r] перечитывает комментарии, и пока diff открыт, они перечитываются по тому же таймеру [refresh] prs"
"PR comments are up to date" = "Комментарии PR актуальны"
