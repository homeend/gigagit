"collapse / expand the note next to the cursor line to a single row (▸ author: summary); O does it for every note in the view. View state only — nothing is stored" = "свернуть / развернуть заметку рядом со строкой курсора в одну строку (▸ автор: сводка); O — для всех заметок в окне. Только состояние вида — ничего не сохраняется"
