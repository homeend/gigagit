"next / previous change (also ctrl+↓/↑; press again at the end/start to wrap around)" = "следующее / предыдущее изменение (также ctrl+↓/↑; повторное нажатие в конце/начале — по кругу)"
"from the last / first change, press twice to step to the next / previous file in the list (a bottom-left cue advertises it; a notice names the new file)" = "на последнем / первом изменении нажмите дважды, чтобы перейти к следующему / предыдущему файлу списка (подсказка внизу слева; уведомление называет новый файл)"
"jump to top / bottom of the file; at the edge a bottom-left cue appears and pressing it again steps to the previous / next file in the list (a notice names the new file)" = "в начало / конец файла; на краю появляется подсказка внизу слева, и повторное нажатие переходит к предыдущему / следующему файлу списка (уведомление называет новый файл)"
