"save comparison: %s" = "сохранение сравнения: %s"
"saved comparison: %s" = "сравнение сохранено: %s"
"Copy left link" = "Копировать левую ссылку"
"Copy right link" = "Копировать правую ссылку"
"saved comparisons list here too: two gg:// links shown as <left> ↔ <right>, saved from a link comparison (. → Save comparison…) or with gg compare --save. enter runs the comparison again, e renames, d removes, s saves it reversed, and the .-menu copies either link; a comparison whose link no longer resolves stays listed and says why when opened" = "сохранённые сравнения тоже перечислены здесь: две ссылки gg:// в виде <левая> ↔ <правая>, сохранённые из сравнения ссылок (. → Сохранить сравнение…) или через gg compare --save. enter запускает сравнение заново, e переименовывает, d удаляет, s сохраняет обратное, а .-меню копирует любую из ссылок; сравнение, ссылка которого больше не разрешается, остаётся в списке и при открытии объясняет причину"
