"pull (SmartPull: autostash, ff/rebase decisions). On the Branches panel, a non-current branch pulls in the background (stay here): ff its ref, pull in its worktree, or stash→switch→pull→switch-back. Slow ops confirm first (y/n; disable with [ui] disable_slow_op_confirm)." = "подтянуть (SmartPull: автозаначка, решения ff/перебазирование). На панели Branches не-текущая ветка подтягивается в фоне (остаться здесь): ff её ссылки, pull в её рабочем дереве или заначка→переключение→pull→обратно. Медленные операции сначала просят подтверждение (y/n; отключается через [ui] disable_slow_op_confirm)."
"push the current branch (sets upstream)" = "отправить текущую ветку (устанавливает upstream)"
"Push <branch> (.-menu on the Branches panel): push the highlighted branch (sets upstream) — works for any local branch, current or not, including one never pushed before; no checkout needed" = "Push <branch> (.-меню на панели Branches): отправить выделенную ветку (устанавливает upstream) — работает для любой локальной ветки, текущей или нет, включая ни разу не отправлявшуюся; переключение не нужно"
"Force push <branch> (.-menu on the Branches panel, current branch): force-push the current branch — a modal offers force-with-lease (refuses if the remote moved under you) or force (overwrites the remote unconditionally); esc aborts" = "Force push <branch> (.-меню на панели Branches, текущая ветка): принудительно отправить текущую ветку — модальное окно предлагает force-with-lease (отказ, если удалённая ветка успела уйти вперёд) или force (безусловно перезаписывает удалённую); esc отменяет"
"switch to the selected branch (SmartSwitch); if it's in another worktree, offers to jump there. Confirms first (y/n)." = "переключиться на выбранную ветку (SmartSwitch); если она в другом рабочем дереве, предлагает перейти туда. Сначала подтверждение (y/n)."
"open the stash window (list all stashes)" = "открыть окно заначек (список всех заначек)"
"undo the last commit (soft, ref-only)" = "отменить последний коммит (soft, только ссылка)"
"bookmark quick-switcher: jump to / compare / paste a bookmarked file (the . menu on any file offers Bookmark this file and Compare against bookmark — pick a bookmark, then diff the focused file against it). In it (navigation-first): ↑↓/jk move, enter jumps (diffs the bookmark vs the working-tree file), e opens the bookmarked file in your external editor (read-only), p pastes to a typed path, t copies to a new dir under <repo>.tmp (works for file AND commit bookmarks), y copies the file's path, absolute path, or name to the clipboard, m marks one then a second to compare, c compares the highlighted bookmark against a shelf entry, x removes (confirms), / filters, ? shows the key list, esc closes" = "быстрый переключатель закладок: перейти к / сравнить / вставить файл из закладок (в . меню любого файла есть Bookmark this file и Compare against bookmark — выберите закладку, и сфокусированный файл сравнится с ней). Внутри (сначала навигация): ↑↓/jk — перемещение, enter — переход (дифф закладки с файлом рабочего дерева), e — открыть файл закладки во внешнем редакторе (только чтение), p — вставить по введённому пути, t — скопировать в новый каталог под <repo>.tmp (работает для файловых И коммитных закладок), y — скопировать путь, абсолютный путь или имя файла в буфер обмена, m — отметить одну, затем вторую для сравнения, c — сравнить выделенную закладку с записью полки, x — удалить (с подтверждением), / — фильтр, ? — список клавиш, esc — закрыть"
"shelf quick-switcher: the . menu on any file also offers Compare against shelf. In it (navigation-first): ↑↓/jk move, enter diffs a file entry vs the working-tree file — on a shelved COMMIT it opens the files view with the frozen files (enter diffs each vs the working tree; the . menu's Copy to working dir restores one), e opens the shelved copy in your external editor (read-only), p restores to a path (prefilled with the original path; ctrl+r re-fills it), t copies to a new dir under <repo>.tmp, y copies the file's path, absolute path, or name to the clipboard, m marks one then a second to compare two entries, c compares the highlighted entry against a bookmark, x removes (confirms), / filters, ? shows the key list, esc closes" = "быстрый переключатель полки: в . меню любого файла есть и Compare against shelf. Внутри (сначала навигация): ↑↓/jk — перемещение, enter — дифф файловой записи с файлом рабочего дерева — на отложенном КОММИТЕ открывает представление файлов с замороженными файлами (enter сравнивает каждый с рабочим деревом; Copy to working dir в . меню восстанавливает один), e — открыть копию с полки во внешнем редакторе (только чтение), p — восстановить по пути (предзаполнен исходный путь; ctrl+r заполняет заново), t — скопировать в новый каталог под <repo>.tmp, y — скопировать путь, абсолютный путь или имя файла в буфер обмена, m — отметить одну, затем вторую для сравнения двух записей, c — сравнить выделенную запись с закладкой, x — удалить (с подтверждением), / — фильтр, ? — список клавиш, esc — закрыть"
"notification center: health recommendations for this repo (e.g. write a commit-graph on a big repo — makes commit browsing ~10× faster). ↑↓ select, enter shows a notice's actions, esc closes. 'Not now' asks again next load; 'Never for this repo' is remembered in prompts.toml" = "центр уведомлений: рекомендации по здоровью этого репозитория (например, записать commit-graph в большом репозитории — просмотр коммитов станет примерно в 10× быстрее). ↑↓ — выбор, enter — действия уведомления, esc — закрыть. 'Not now' спросит при следующей загрузке; 'Never for this repo' запоминается в prompts.toml"
"fuzzy file finder: opens a picker over every tracked file; press / then type a query (fvgo → files_view.go) to filter by path, ↑↓/pgup/pgdn to move, enter to open a per-file menu (View content, Diff HEAD↔working tree, History, Blame, Open in editor, Copy path, Copy absolute path), esc closes" = "нечёткий поиск файлов: открывает список всех отслеживаемых файлов; нажмите /, введите запрос (fvgo → files_view.go) для фильтра по пути, ↑↓/pgup/pgdn — перемещение, enter — меню файла (просмотр содержимого, дифф HEAD↔рабочее дерево, история, blame, открыть в редакторе, копировать путь, копировать абсолютный путь), esc — закрыть"
"worktree popup for the selected existing branch" = "окно рабочего дерева для выбранной существующей ветки"
"worktree popup on a new templated branch. In the popup, p picks a saved branch prefix (Settings → Branch prefixes), fills any <user:…> labels, and seeds the editable name" = "окно рабочего дерева на новой ветке по шаблону. В окне p выбирает сохранённый префикс ветки (Настройки → Префиксы веток), заполняет метки <user:…> и подставляет редактируемое имя"
"mark a row; m on a second row opens the pair-op picker (merge / rebase / interactive rebase / compare branches)" = "отметить строку; m на второй строке открывает выбор парной операции (слияние / перебазирование / интерактивное перебазирование / сравнение веток)"
"repo switcher popup (navigation-first: ↑↓/jk/pgup/pgdn move, / filters, enter switches — while filtering, the first enter locks the filter)" = "окно переключения репозиториев (сначала навигация: ↑↓/jk/pgup/pgdn — перемещение, / — фильтр, enter — переключение; при фильтрации первый enter фиксирует фильтр)"
"settings" = "настройки"
"action menu — context actions for the selected row and panel (incl. copy actions)" = "меню действий — контекстные действия для выбранной строки и панели (включая копирование)"
"command palette — generic command launcher, opens over the panels OR any browse window (files tree, diff, history, blame, review, stash) (↑↓/jk move, enter runs, esc closes); includes Apply patch, File blame, File history, Find, Git config explorer, Open repo, Open shell, Run shell command, Set up agent skills, Show commit" = "палитра команд — универсальный запуск команд, открывается поверх панелей И любого окна просмотра (дерево файлов, дифф, история, blame, ревью, заначки) (↑↓/jk — перемещение, enter — выполнить, esc — закрыть); включает Apply patch, File blame, File history, Find, Git config explorer, Open repo, Open shell, Run shell command, Set up agent skills, Show commit"
"show commit by SHA: type a commit-ish (SHA / ref); enter resolves it and opens that commit's files in the files-view" = "показать коммит по SHA: введите указатель коммита (SHA / ссылка); enter разрешает его и открывает файлы этого коммита в представлении файлов"
"Compare against working dir / Copy to working dir (.-menu): on any focused stash/commit/staged file, diffs that version against the same path in the working tree (Compare) or writes it into the working tree at its own path (Copy)" = "Compare against working dir / Copy to working dir (.-меню): для любого сфокусированного файла из заначки/коммита/индекса сравнивает эту версию с тем же путём в рабочем дереве (Compare) или записывает её в рабочее дерево по её пути (Copy)"
"cycle the focused panel's sort order" = "переключить порядок сортировки сфокусированной панели"
"cycle the focused window's text display (cutoff / wrap / scroll)" = "переключить режим текста сфокусированного окна (обрезка / перенос / прокрутка)"
"maximize the focused left-column panel to fill the whole left column (t again restores); while maximized, ctrl+←/→ still cycles that slot's tabs" = "развернуть сфокусированную панель левой колонки на всю левую колонку (t ещё раз — восстановить); в развёрнутом виде ctrl+←/→ по-прежнему переключает вкладки этого слота"
"fullscreen whatever is focused — any panel OR any open popup — to a near-fullscreen box (ctrl+t or esc restores; on a panel, t drops back to the left column)" = "развернуть сфокусированное — любую панель ИЛИ любое открытое окно — почти на весь экран (ctrl+t или esc восстанавливает; на панели t возвращает в левую колонку)"
"open a shell in the repo worktree (emergency hatch — works over ANY window, incl. a failed conflict resolve; 'exit' returns to gg and reloads)" = "открыть оболочку в рабочем дереве репозитория (аварийный люк — работает поверх ЛЮБОГО окна, включая неудачное разрешение конфликта; 'exit' возвращает в gg и перезагружает)"
"scroll display mode: pan the focused window horizontally" = "режим прокрутки: горизонтальная панорама сфокусированного окна"
"filter the focused panel" = "фильтровать сфокусированную панель"
"clear the focused window's filtering — its / filter, or on the Commits panel the @ highlight and the \\ commit filter (other windows' filters are left untouched)" = "сбросить фильтрацию сфокусированного окна — его / фильтр, а на панели Commits ещё подсветку @ и \\ фильтр коммитов (фильтры других окон не трогаются)"
"recall previous searches (history dropdown) while typing in the / filter, @ highlight, or the bookmark/shelf/files-tree search" = "вызвать прежние запросы (выпадающая история) при вводе в / фильтре, @ подсветке или поиске закладок/полки/дерева файлов"
"cycle panel focus forward / backward" = "переключать фокус панелей вперёд / назад"
"focus the left column / the Commits panel" = "фокус на левую колонку / панель Commits"
"cycle the focused tab slot: top (Branches / Remotes / Worktrees), middle (Files / Tags), or bottom (Staged / Reflog)" = "переключить сфокусированный слот вкладок: верх (Branches / Remotes / Worktrees), середина (Files / Tags), низ (Staged / Reflog)"
"focus the window under the cursor and select the clicked row" = "сфокусировать окно под курсором и выбрать строку по клику"
"scroll the list under the cursor ([ui] wheel_step rows; files view: tree or commits)" = "прокрутить список под курсором ([ui] wheel_step строк; представление файлов: дерево или коммиты)"
"move the selection" = "переместить выделение"
"page the selection (a quarter of the viewport)" = "листать выделение постранично (четверть области просмотра)"
"clear the mark, then the active filter" = "снять отметку, затем активный фильтр"
"commit the staged index (title + description popup)" = "закоммитить индекс (окно с заголовком и описанием)"
"amend the last commit (edit message / fold in staged changes)" = "исправить последний коммит (изменить сообщение / добавить изменения из индекса)"
"reload all panels (keeps them visible while refreshing)" = "перезагрузить все панели (они остаются видимыми при обновлении)"
"this help window" = "это окно справки"
"quit" = "выход"
"Branches panel" = "Панель Branches"
"create a branch off the selected one (popup). In the popup, ctrl+p picks a saved branch prefix (Settings → Branch prefixes) and seeds the name" = "создать ветку от выбранной (окно). В окне ctrl+p выбирает сохранённый префикс ветки (Настройки → Префиксы веток) и подставляет имя"
"create a branch and switch to it" = "создать ветку и переключиться на неё"
"delete the selected branch" = "удалить выбранную ветку"
"on a non-current branch: pull it in the background (stay on your branch) — same as the .-menu 'Pull <branch> (stay here)'" = "на не-текущей ветке: подтянуть её в фоне (остаться на своей ветке) — то же, что 'Pull <branch> (stay here)' в .-меню"
"go to the selected branch's tip in the Commits panel — jumps if the tip is loaded, otherwise deep-searches history for it (the ctrl+f machinery: clears the / filter, pages with a budget, asks before scanning deeper)" = "перейти к вершине выбранной ветки в панели Commits — прыжок, если вершина загружена, иначе глубокий поиск по истории (механика ctrl+f: сброс / фильтра, постраничная загрузка с бюджетом, вопрос перед более глубоким сканированием)"
"Solo the selected branch AND go to its tip: scopes the Commits feed to the branch (press again to un-solo) and lands the cursor on the tip once the reload finishes" = "Solo выбранной ветки И переход к её вершине: ограничивает ленту Commits этой веткой (нажать ещё раз — снять) и ставит курсор на вершину после перезагрузки"
"rename branch / copy branch name / Pull <branch> (stay here) / Solo this branch / Add to commit view / Go to tip in commits (.-menu)" = "переименовать ветку / копировать имя ветки / Pull <branch> (stay here) / Solo this branch / Add to commit view / Go to tip in commits (.-меню)"
"Solo this branch (.-menu): scope the Commits panel to this branch (re-run to un-solo); Add/Remove from commit view builds a multi-branch set; Show all branches clears it; Go to tip in commits jumps the Commits cursor to this branch's tip (enter does the same; both deep-search unloaded history when needed)" = "Solo this branch (.-меню): ограничить панель Commits этой веткой (повторный запуск снимает); Add/Remove from commit view собирает набор из нескольких веток; Show all branches очищает его; Go to tip in commits переводит курсор Commits на вершину этой ветки (enter делает то же; оба при необходимости глубоко ищут в незагруженной истории)"
"Remotes panel" = "Панель Remotes"
"checkout: create or fast-forward a local tracking branch (stay on the current branch); on the current branch's own remote it prompts instead: pull now (when behind) / check out under a different name" = "checkout: создать или перемотать вперёд локальную отслеживающую ветку (остаться на текущей); на удалённой ветке самой текущей ветки вместо этого спрашивает: подтянуть сейчас (при отставании) / переключиться под другим именем"
"checkout and switch to it — fast-forward-safe; a diverged local branch offers check-out-as-a-different-name" = "checkout и переключиться на неё — безопасно при перемотке; для разошедшейся локальной ветки предлагается checkout под другим именем"
"Check out <remote> as… / Switch to <remote> as… (.-menu): materialize the remote branch under a local name you choose" = "Check out <remote> as… / Switch to <remote> as… (.-меню): материализовать удалённую ветку под выбранным вами локальным именем"
"fetch all remotes (updates tracking refs and the behind-counts)" = "получить все удалённые (обновляет отслеживающие ссылки и счётчики отставания)"
"Prune (.-menu): drop tracking refs for branches deleted upstream" = "Prune (.-меню): убрать отслеживающие ссылки веток, удалённых на сервере"
"copy remote branch name (.-menu)" = "копировать имя удалённой ветки (.-меню)"
"Worktrees panel" = "Панель Worktrees"
"switch into the selected worktree" = "переключиться в выбранное рабочее дерево"
"remove the selected worktree" = "удалить выбранное рабочее дерево"
"Tags panel" = "Панель Tags"
"a tab in the middle (Files) box — ctrl+←/→ switches Files ⇄ Tags; ● annotated, ○ lightweight; ▲ marks tags that exist on the default remote (origin or first remote) — local-only or not-yet-checked tags show no marker (deliberately indistinguishable before a lookup runs)" = "вкладка среднего блока (Files) — ctrl+←/→ переключает Files ⇄ Tags; ● аннотированный, ○ лёгкий; ▲ помечает теги, существующие на удалённом по умолчанию (origin или первый удалённый) — только локальные или ещё не проверенные теги без маркера (до проверки они намеренно неотличимы)"
"jump the Commits cursor to the tag's target commit" = "перевести курсор Commits на коммит, куда указывает тег"
"Check out tag (.-menu): detached HEAD, a new branch at the tag, or a new worktree (branch + dir prefilled from the tag name)" = "Check out tag (.-меню): detached HEAD, новая ветка на теге или новое рабочее дерево (ветка и каталог предзаполнены из имени тега)"
"Push tag (.-menu): push the tag to a remote (auto when only one, else pick)" = "Push tag (.-меню): отправить тег на удалённый (автоматически, если он один, иначе выбор)"
"Delete tag (.-menu): delete the selected tag after a confirm" = "Delete tag (.-меню): удалить выбранный тег после подтверждения"
"Refresh remote status (.-menu): one-shot git ls-remote --tags; updates the ▲ marker for every visible tag; errors shown on the status line; for background auto-refresh see [refresh] remote_tags" = "Refresh remote status (.-меню): разовый git ls-remote --tags; обновляет маркер ▲ у всех видимых тегов; ошибки в строке статуса; фоновое автообновление — см. [refresh] remote_tags"
"Shelf panel" = "Панель Shelf"
"frozen, non-git per-file copies (the default bucket); add via the . menu anywhere a file is focused" = "замороженные, не-git копии файлов (корзина по умолчанию); добавляются через . меню везде, где сфокусирован файл"
"diff the shelved copy against the current working-tree file" = "дифф копии с полки с текущим файлом рабочего дерева"
"mark an entry; mark a second to compare the two shelved copies side-by-side" = "отметить запись; отметьте вторую, чтобы сравнить две копии с полки бок о бок"
"Restore to… (writes the copy to a path; prefilled with the original path, ctrl+r re-fills it) / Remove from shelf" = "Restore to… (записывает копию по пути; предзаполнен исходный путь, ctrl+r заполняет заново) / Remove from shelf"
"Reflog panel" = "Панель Reflog"
"a tab in the bottom-left (Staged) box — ctrl+←/→ switches Staged ⇄ Reflog; lists the HEAD reflog (read-only), newest first" = "вкладка нижнего левого блока (Staged) — ctrl+←/→ переключает Staged ⇄ Reflog; список reflog HEAD (только чтение), новые сверху"
"open the entry's commit in the files view (changed files vs parent; even for dangling commits)" = "открыть коммит записи в представлении файлов (изменённые файлы против родителя; даже для висячих коммитов)"
"Copy SHA / Bookmark this commit / Shelf this commit (name it) (compare via the g switcher)" = "Copy SHA / Bookmark this commit / Shelf this commit (с именем) (сравнение через переключатель g)"
"Reset to this entry (.-menu): move the current branch here (soft/mixed/hard) / Check out this entry (detached or as a new branch you switch to)" = "Reset to this entry (.-меню): переместить текущую ветку сюда (soft/mixed/hard) / Check out this entry (detached или как новая ветка с переключением)"
"Files panel" = "Панель Files"
"stage the marked files (or the cursor row) — git add" = "добавить отмеченные файлы (или строку курсора) в индекс — git add"
"stage hunks: open the region/line staging picker" = "индексировать хунки: открыть выбор областей/строк"
"stash changes: popup to name + pick files (ctrl+s confirms)" = "заначить изменения: окно с именем и выбором файлов (ctrl+s подтверждает)"
"mark / unmark a file (multi-select for staging, stashing, discarding)" = "отметить / снять отметку файла (мультивыбор для индексации, заначки, отмены)"
"side-by-side diff of the unstaged change (index → working tree)" = "дифф бок о бок неиндексированного изменения (индекс → рабочее дерево)"
"file history: commits that touched it (left) + per-commit diff (right)" = "история файла: коммиты, менявшие его (слева) + дифф по коммиту (справа)"
"blame: who last changed each line, grouped by commit" = "blame: кто последним менял каждую строку, сгруппировано по коммитам"
"discard the marked files (or the cursor row): revert edits, delete new files (confirm)" = "отменить отмеченные файлы (или строку курсора): откатить правки, удалить новые файлы (подтверждение)"
"discard ALL unstaged changes: revert every edit + delete every new file (confirm)" = "отменить ВСЕ неиндексированные изменения: откатить каждую правку + удалить каждый новый файл (подтверждение)"
"on an untracked file: Add to .gitignore (this file, anchored) / Add extension to .gitignore (*.ext) — appends to the repo-root .gitignore" = "на неотслеживаемом файле: Add to .gitignore (этот файл, с якорем) / Add extension to .gitignore (*.ext) — дописывает в .gitignore в корне репозитория"
"Edit in editor: open the selected file in $VISUAL/$EDITOR (vi/notepad fallback), then refresh" = "Edit in editor: открыть выбранный файл в $VISUAL/$EDITOR (запасной вариант vi/notepad), затем обновить"
"Staged panel" = "Панель Staged"
"unstage the marked files (or the cursor row) — git restore --staged" = "убрать отмеченные файлы (или строку курсора) из индекса — git restore --staged"
"side-by-side diff of the staged change (HEAD → index)" = "дифф бок о бок индексированного изменения (HEAD → индекс)"
"Open staged version in external editor: open the index blob (the staged copy, distinct from the working file) in $VISUAL/$EDITOR, read-only" = "Open staged version in external editor: открыть blob индекса (индексированную копию, отличную от рабочего файла) в $VISUAL/$EDITOR, только чтение"
"mark / unmark a file; h history, b blame (as in Files)" = "отметить / снять отметку файла; h — история, b — blame (как в Files)"
"Conflict resolution process (x)" = "Процесс разрешения конфликтов (x)"
"enter / resume the conflict process (repo conflicted, or a merge/rebase paused after external resolution)" = "войти / вернуться в процесс конфликтов (репозиторий в конфликте, или слияние/перебазирование приостановлено после внешнего разрешения)"
"move between conflicted files" = "перемещаться между конфликтующими файлами"
"pick hunks: open the line editor (both-modified files)" = "выбрать хунки: открыть построчный редактор (файлы, изменённые с обеих сторон)"
"keep current / incoming (both-modified files)" = "оставить current / incoming (файлы, изменённые с обеих сторон)"
"keep modified / delete / keep base (modify-delete files)" = "оставить изменённое / удалить / оставить base (файлы изменено-удалено)"
"mark resolved (after editing by hand)" = "пометить решённым (после ручной правки)"
"mark all resolved" = "пометить всё решённым"
"run external tool (Claude/Junie/Meld…) configured for conflict resolution — Settings (,) → External tools" = "запустить внешний инструмент (Claude/Junie/Meld…), настроенный для разрешения конфликтов — Настройки (,) → Внешние инструменты"
"continue / abort the merge or rebase (once resolved)" = "продолжить / прервать слияние или перебазирование (после разрешения)"
"cycle text display: cutoff / wrap / scroll" = "переключить режим текста: обрезка / перенос / прокрутка"
"leave the process (resume later with x); esc in a running step cancels it" = "выйти из процесса (вернуться позже по x); esc на выполняющемся шаге отменяет его"
"Hunk picker (x conflict resolve / H stage)" = "Выбор хунков (x разрешение конфликта / H индексация)"
"switch the focused side (current ↔ incoming)" = "переключить сфокусированную сторону (current ↔ incoming)"
"move the line cursor (steps across regions)" = "перемещать курсор строки (шагает через области)"
"pick the cursor line (builds the result in pick order)" = "выбрать строку под курсором (результат собирается в порядке выбора)"
"take the whole region from current / incoming" = "взять всю область из current / incoming"
"take all regions from current / incoming" = "взять все области из current / incoming"
"jump to the next / previous region" = "перейти к следующей / предыдущей области"
"apply when every region is resolved" = "применить, когда каждая область решена"
"cancel (close without resolving)" = "отмена (закрыть без разрешения)"
"Commits panel" = "Панель Commits"
"shows commits from ALL local branches by default, in date order, with a single-line commit graph (natural order only; hidden while filtering/sorting); header shows the mode — Commits (all) / Commits (solo: <branch>)" = "по умолчанию показывает коммиты ВСЕХ локальных веток в порядке дат с однострочным графом коммитов (только естественный порядок; скрыт при фильтрации/сортировке); заголовок показывает режим — Commits (all) / Commits (solo: <branch>)"
"the left column is the branch the commit is on: BRIGHT *current/branch on that branch's tip, grayed otherwise; long names trim with … (select to reveal the full name); the commit id shows in the status bar. Filtering still matches the full id and full branch name" = "левая колонка — ветка, на которой коммит: ЯРКО *current/branch на вершине этой ветки, серым иначе; длинные имена обрезаются … (выделите, чтобы раскрыть полное имя); id коммита показан в строке статуса. Фильтр по-прежнему ищет по полному id и полному имени ветки"
"in the Commits graph, ↓ marks a local branch's tip and ↑ the tip of its tracked remote (both together = local and remote in sync)" = "в графе Commits ↓ помечает вершину локальной ветки, а ↑ — вершину её отслеживаемого удалённого (оба вместе = локальная и удалённая синхронны)"
"show the selected commit's files in the left column (focus stays on the commit list)" = "показать файлы выбранного коммита в левой колонке (фокус остаётся на списке коммитов)"
"drill into the selected commit's files: open the files view AND move focus to the file tree (l + focus tree)" = "провалиться в файлы выбранного коммита: открыть представление файлов И перевести фокус на дерево файлов (l + фокус на дерево)"
"view the selected commit's full message in a scrollable popup; also works while the files view is open (the popup layers over the tree, esc returns to it)" = "показать полное сообщение выбранного коммита в прокручиваемом окне; работает и при открытом представлении файлов (окно поверх дерева, esc возвращает)"
"open the selected commit's message in the external editor ($EDITOR, read-only)" = "открыть сообщение выбранного коммита во внешнем редакторе ($EDITOR, только чтение)"
"uncommitted work shows as ◇ Working tree / ◇ Staged rows atop the graph (only when dirty); l/enter diffs them (working tree vs index, index vs HEAD); commit-only actions are unavailable on them" = "незакоммиченная работа отображается строками ◇ Working tree / ◇ Staged над графом (только при изменениях); l/enter показывает их дифф (рабочее дерево против индекса, индекс против HEAD); действия только-для-коммитов на них недоступны"
"the ◇ Working tree / ◇ Staged rows can be added (m) to the ◉ compare selection like commits — Compare selection then diffs a commit against your working copy or index" = "строки ◇ Working tree / ◇ Staged можно добавлять (m) в ◉ выбор сравнения как коммиты — Compare selection тогда сравнивает коммит с рабочей копией или индексом"
"highlight search: keep all commits visible, dim non-matches (graph stays); ctrl+↑/↓ jump prev/next match; enter keeps, esc clears" = "поиск с подсветкой: все коммиты остаются видимыми, несовпадения затемняются (граф сохраняется); ctrl+↑/↓ — к пред./след. совпадению; enter оставляет, esc очищает"
"Commits: eager search — page unloaded history for the next match of the active / filter or @ highlight query and jump to it; every press digs past the already-loaded commits and re-asks before scanning deeper" = "Commits: настойчивый поиск — листает незагруженную историю до следующего совпадения запроса активного / фильтра или @ подсветки и переходит к нему; каждое нажатие копает дальше уже загруженных коммитов и снова спрашивает перед более глубоким сканированием"
"Commits: load the next batch of commits now (without scrolling to the end)" = "Commits: загрузить следующую порцию коммитов сейчас (не прокручивая до конца)"
"jump to the top / bottom of the focused list; End on Commits also loads the next batch" = "перейти в начало / конец сфокусированного списка; End на Commits ещё и загружает следующую порцию"
"filter commits by path / author / message / date (popup; empty fields clear that axis, ctrl+r clears all fields); graph hides while filtered" = "фильтровать коммиты по пути / автору / сообщению / дате (окно; пустые поля снимают эту ось, ctrl+r очищает все поля); граф скрыт при фильтре"
"add / remove the selected commit (or ◇ Working tree / ◇ Staged row) to the ◉ compare selection; the . menu then drives Compare selection or Squash" = "добавить / убрать выбранный коммит (или строку ◇ Working tree / ◇ Staged) в ◉ выбор сравнения; затем . меню запускает Compare selection или Squash"
"mark / unmark the selected commit for compare — the same ◉ set as m but capped at two: the second space-mark opens the comparison immediately (with 2 already marked, space a marked one to unmark first; esc clears ALL marks, or . → Unmark all commits). Re-opening the comparison already on screen keeps it (no reload)" = "отметить / снять выбранный коммит для сравнения — тот же набор ◉, что и m, но максимум два: вторая отметка space сразу открывает сравнение (при 2 отмеченных сначала снимите отметку space; esc снимает ВСЕ отметки, или . → Unmark all commits). Повторное открытие уже показанного сравнения сохраняет его (без перезагрузки)"
"view message / open message in editor / rename commit / copy commit id / Create branch here / Create worktree here / Cherry-pick here / Revert this commit / Reset to this commit (soft|mixed|hard) / Compare against working tree / Compare against staged / Export commit as patch / Add to compare selection (space) / Unmark commit / Unmark all commits / Compare selection / Squash N commits / Drop N selected commits / Show all branches when soloed / Show as list|graph (.-menu)" = "показать сообщение / открыть сообщение в редакторе / переименовать коммит / копировать id коммита / Create branch here / Create worktree here / Cherry-pick here / Revert this commit / Reset to this commit (soft|mixed|hard) / Compare against working tree / Compare against staged / Export commit as patch / Add to compare selection (space) / Unmark commit / Unmark all commits / Compare selection / Squash N commits / Drop N selected commits / Show all branches when soloed / Show as list|graph (.-меню)"
"Compare against working tree / Compare against staged (.-menu): open the files view as a whole-tree diff of this commit vs your working copy / the index; enter on a file diffs that path" = "Compare against working tree / Compare against staged (.-меню): открыть представление файлов как дифф всего дерева этого коммита с вашей рабочей копией / индексом; enter на файле показывает дифф этого пути"
"grow the ◉ compare selection (a contiguous run of commits)" = "расширить ◉ выбор сравнения (непрерывный ряд коммитов)"
"Compare selection (.-menu): toggle commits into the ◉ set (m / Add to compare selection / shift+↑↓), then Compare selection — 2 = the diff between them, 3+ = the combined diff of the range (oldest^..newest, refused from a root commit); Unmark all commits (N) empties it" = "Compare selection (.-меню): переключайте коммиты в набор ◉ (m / Add to compare selection / shift+↑↓), затем Compare selection — 2 = дифф между ними, 3+ = совокупный дифф диапазона (oldest^..newest, отказ от корневого коммита); Unmark all commits (N) очищает его"
"Squash N commits (.-menu): with 2+ commits in the ◉ set, combine the selected commits into one (messages concatenated; reword afterward). When they aren't adjacent, a prompt offers Reorder & squash — the skipped in-between commits move to just after the squash. Off-branch selections are refused; conflicts pause for `git rebase --continue`" = "Squash N commits (.-меню): при 2+ коммитах в наборе ◉ объединяет выбранные коммиты в один (сообщения склеиваются; потом переформулируйте). Если они не смежные, предлагается Reorder & squash — пропущенные промежуточные коммиты переносятся сразу после squash. Выбор вне ветки отклоняется; конфликты приостанавливаются до `git rebase --continue`"
"Drop N selected commits (.-menu): with 2+ commits in the ◉ set, delete them all in one interactive rebase (no adjacency needed; gaps stay). Off-branch / working-tree-or-staged selections are refused; conflicts pause for `git rebase --continue`. Drop commit (no set) drops just the cursor commit" = "Drop N selected commits (.-меню): при 2+ коммитах в наборе ◉ удаляет их все одним интерактивным перебазированием (смежность не нужна; промежутки остаются). Выбор вне ветки / рабочего дерева или индекса отклоняется; конфликты приостанавливаются до `git rebase --continue`. Drop commit (без набора) удаляет только коммит под курсором"
"on a commit that is a branch's tip: Rename branch <name> / Delete branch <name> (.-menu) — one pair per local tip; delete is hidden for a checked-out branch" = "на коммите-вершине ветки: Rename branch <name> / Delete branch <name> (.-меню) — по паре на локальную вершину; delete скрыт для извлечённой ветки"
"on a non-merge commit of the current branch: Move commit up (newer) / Move commit down (older) / Drop commit (.-menu) — one-step interactive rebase; conflicts pause for `git rebase --continue`" = "на не-слиянии текущей ветки: Move commit up (newer) / Move commit down (older) / Drop commit (.-меню) — одношаговое интерактивное перебазирование; конфликты приостанавливаются до `git rebase --continue`"
"Show as list / Show as graph (.-menu): flat ●-gutter list vs the lane graph; lane color marks each commit's line of development" = "Show as list / Show as graph (.-меню): плоский список с ● против графа дорожек; цвет дорожки показывает линию разработки каждого коммита"
"narrow / widen the commit graph window (in lanes); a ⋯ marks lanes beyond each edge" = "сузить / расширить окно графа коммитов (в дорожках); ⋯ помечает дорожки за краями"
"pan the commit graph window left / right" = "панорамировать окно графа коммитов влево / вправо"
"snap the commit graph window to the selected commit's node" = "привязать окно графа коммитов к узлу выбранного коммита"
"more commits load automatically as you near the end" = "новые коммиты подгружаются автоматически при приближении к концу"
"Filter mode (/)" = "Режим фильтра (/)"
"move the selection through the filtered rows" = "перемещать выделение по отфильтрованным строкам"
"keep the filter and leave input mode" = "сохранить фильтр и выйти из режима ввода"
"cancel the filter" = "отменить фильтр"
"delete; any typed text narrows the list" = "удалить; любой введённый текст сужает список"
"Worktree popup (w/W)" = "Окно рабочего дерева (w/W)"
"next input field / confirm" = "следующее поле ввода / подтвердить"
"edit the previewed branch name (new-branch mode)" = "изменить предпросмотренное имя ветки (режим новой ветки)"
"create the worktree" = "создать рабочее дерево"
"create the worktree and switch to it" = "создать рабочее дерево и переключиться в него"
"cancel" = "отмена"
"Branch popup (b/B)" = "Окно ветки (b/B)"
"create the branch" = "создать ветку"
"Commit popup (c/C)" = "Окно коммита (c/C)"
"switch field (title / description)" = "сменить поле (заголовок / описание)"
"title: move to the description field; description: insert a newline" = "заголовок: перейти к полю описания; описание: вставить перевод строки"
"generate a commit message from the staged diff with a configured commit_message external agent (Settings → External tools) — fills the title/description fields for you to review; nothing commits until ctrl+s. More than one tool configured shows a numbered chooser; an unapproved command shows a first-run approval (remembered per repo); existing title/description text asks before being replaced; esc cancels an in-flight run" = "сгенерировать сообщение коммита из индексированного диффа настроенным внешним агентом commit_message (Настройки → Внешние инструменты) — заполняет поля заголовка/описания для проверки; ничего не коммитится до ctrl+s. При нескольких инструментах — нумерованный выбор; неодобренная команда показывает одобрение первого запуска (запоминается по репозиторию); существующий текст заголовка/описания спрашивает перед заменой; esc отменяет запущенную генерацию"
"toggle a wider / fullscreen commit box (easier to read a long generated message); ctrl+t again restores" = "переключить широкое / полноэкранное окно коммита (легче читать длинное сгенерированное сообщение); ctrl+t ещё раз восстанавливает"
"commit (or amend, when opened with C)" = "закоммитить (или исправить, если открыто через C)"
"Pair-op popup (m on a second row)" = "Окно парной операции (m на второй строке)"
"choose an operation (Branches: merge, rebase, interactive rebase)" = "выбрать операцию (Branches: слияние, перебазирование, интерактивное перебазирование)"
"run the operation (clears the mark)" = "выполнить операцию (снимает отметку)"
"close, keeping the mark" = "закрыть, сохранив отметку"
"Interactive rebase editor" = "Редактор интерактивного перебазирования"
"set the row action: pick / reword / squash / drop" = "задать действие строки: pick / reword / squash / drop"
"move the focused commit up / down" = "переместить сфокусированный коммит вверх / вниз"
"move the cursor" = "переместить курсор"
"start the rebase with the current plan" = "начать перебазирование по текущему плану"
"reset every row to pick, original order" = "сбросить все строки в pick, исходный порядок"
"cancel (close without rebasing)" = "отмена (закрыть без перебазирования)"
"Commit files view (l)" = "Представление файлов коммита (l)"
"switch focus between the file tree and the commit list" = "переключить фокус между деревом файлов и списком коммитов"
"move on the focused side (commits side reloads the tree)" = "перемещение на сфокусированной стороне (сторона коммитов перезагружает дерево)"
"page the focused side" = "листать сфокусированную сторону"
"scroll the file tree from either side (wheel: 3)" = "прокручивать дерево файлов с любой стороны (колесо: 3)"
"search the focused side: file paths (tree) or the commit list (commits side); enter keeps it, esc cancels" = "поиск на сфокусированной стороне: пути файлов (дерево) или список коммитов (сторона коммитов); enter оставляет, esc отменяет"
"tree side: diff of the selected file (changed-files mode vs parent; all-files mode vs the working tree). Commit-list side: drill in — move focus to the file tree" = "сторона дерева: дифф выбранного файла (режим изменённых файлов — против родителя; режим всех файлов — против рабочего дерева). Сторона списка коммитов: провалиться — фокус на дерево файлов"
"toggle all files: every file in the commit's tree (as if checked out) vs only the files it changed" = "переключить все файлы: каждый файл дерева коммита (как при checkout) против только изменённых им файлов"
"tree side: View file — show the file's content at this commit (no diff) in the right pane ([↑/↓] scroll, [z] view mode, [esc] close, [←] back to the tree); Open in external editor — open that content in $VISUAL/$EDITOR, read-only" = "сторона дерева: View file — показать содержимое файла на этом коммите (без диффа) в правой панели ([↑/↓] прокрутка, [z] режим, [esc] закрыть, [←] назад к дереву); Open in external editor — открыть это содержимое в $VISUAL/$EDITOR, только чтение"
"view the underlying commit's full message in a popup over the tree (esc returns; commit views only, not stash/compare)" = "показать полное сообщение коммита в окне поверх дерева (esc возвращает; только представления коммитов, не stash/compare)"
"history of the selected file (tree side)" = "история выбранного файла (сторона дерева)"
"blame of the selected file (tree side)" = "blame выбранного файла (сторона дерева)"
"branch-pair compare only: cycle the origin filter — all differences / only files the marked branch changed / only files the selected branch changed (computed from the merge base; the diff shown per file is always the tip-to-tip difference)" = "только сравнение пары веток: переключить фильтр происхождения — все различия / только файлы, изменённые отмеченной веткой / только файлы, изменённые выбранной веткой (считается от базы слияния; дифф каждого файла всегда между вершинами)"
"commits side: the full Commits-panel menu (cherry-pick / revert / reset / create branch|worktree|tag / compare / …); tree side: copy path/name" = "сторона коммитов: полное меню панели Commits (cherry-pick / revert / reset / создать ветку|рабочее дерево|тег / сравнить / …); сторона дерева: копировать путь/имя"
"commits side: narrow / widen / snap / pan the commit graph window (same as the Commits panel)" = "сторона коммитов: сузить / расширить / привязать / панорамировать окно графа коммитов (как в панели Commits)"
"clear the search, then close" = "сбросить поиск, затем закрыть"
"close" = "закрыть"
"Stash window (S)" = "Окно заначек (S)"
"move the stash selection" = "перемещать выделение заначки"
"page the stash list" = "листать список заначек"
"open the file tree for the stash (then ←/→ focus tree/list, like commit files)" = "открыть дерево файлов заначки (затем ←/→ фокус дерево/список, как у файлов коммита)"
"stash actions: apply / pop / drop (drop confirms; [z] mode in the menu)" = "действия с заначкой: apply / pop / drop (drop с подтверждением; [z] режим в меню)"
"close the stash window" = "закрыть окно заначек"
"Diff view (enter)" = "Просмотр диффа (enter)"
"scroll one line" = "прокрутка на одну строку"
