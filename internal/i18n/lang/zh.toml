"Global" = "全局"
"pull (SmartPull: autostash, ff/rebase decisions). On the Branches panel, a non-current branch pulls in the background (stay here): ff its ref, pull in its worktree, or stash→switch→pull→switch-back. Slow ops confirm first (y/n; disable with [ui] disable_slow_op_confirm)." = "拉取 (SmartPull: 自动贮藏、ff/变基决策)。在 Branches 面板上，非当前分支在后台拉取 (留在原地): ff 其引用、在其工作树中拉取，或贮藏→切换→拉取→切回。慢操作会先确认 (y/n; 用 [ui] disable_slow_op_confirm 禁用)。"
"push the current branch (sets upstream)" = "推送当前分支 (设置上游)"
"Push <branch> (.-menu on the Branches panel): push the highlighted branch (sets upstream) — works for any local branch, current or not, including one never pushed before; no checkout needed" = "Push <branch> (Branches 面板的 .-菜单): 推送高亮的分支 (设置上游) — 适用于任何本地分支，无论是否当前分支，包括从未推送过的分支; 无需检出"
"Force push <branch> (.-menu on the Branches panel, current branch): force-push the current branch — a modal offers force-with-lease (refuses if the remote moved under you) or force (overwrites the remote unconditionally); esc aborts" = "Force push <branch> (Branches 面板的 .-菜单，当前分支): 强制推送当前分支 — 模态框提供 force-with-lease (远程有变动则拒绝) 或 force (无条件覆盖远程); esc 中止"
"switch to the selected branch (SmartSwitch); if it's in another worktree, offers to jump there. Confirms first (y/n)." = "切换到选中的分支 (SmartSwitch); 若它在另一个工作树中，会提议跳转过去。先确认 (y/n)。"
"open the stash window (list all stashes)" = "打开贮藏窗口 (列出所有贮藏)"
"undo the last commit (soft, ref-only)" = "撤销最后一次提交 (soft，仅引用)"
"bookmark quick-switcher: jump to / compare / paste a bookmarked file (the . menu on any file offers Bookmark this file and Compare against bookmark — pick a bookmark, then diff the focused file against it). In it (navigation-first): ↑↓/jk move, enter jumps (diffs the bookmark vs the working-tree file), e opens the bookmarked file in your external editor (read-only), p pastes to a typed path, t copies to a new dir under <repo>.tmp (works for file AND commit bookmarks), y copies the file's path, absolute path, or name to the clipboard, m marks one then a second to compare, c compares the highlighted bookmark against a shelf entry, x removes (confirms), / filters, ? shows the key list, esc closes" = "书签快速切换器: 跳转到 / 比较 / 粘贴已加书签的文件 (任何文件的 . 菜单都提供 Bookmark this file 和 Compare against bookmark — 选一个书签，然后将聚焦文件与之比较)。切换器内 (导航优先): ↑↓/jk 移动、enter 跳转 (书签与工作树文件的差异)、e 在外部编辑器中打开书签文件 (只读)、p 粘贴到输入的路径、t 复制到 <repo>.tmp 下的新目录 (文件和提交书签均可)、y 将文件路径、绝对路径或名称复制到剪贴板、m 标记一个再标记第二个进行比较、c 将高亮书签与搁置区条目比较、x 删除 (需确认)、/ 筛选、? 显示按键列表、esc 关闭"
"shelf quick-switcher: the . menu on any file also offers Compare against shelf. In it (navigation-first): ↑↓/jk move, enter diffs a file entry vs the working-tree file — on a shelved COMMIT it opens the files view with the frozen files (enter diffs each vs the working tree; the . menu's Copy to working dir restores one), e opens the shelved copy in your external editor (read-only), p restores to a path (prefilled with the original path; ctrl+r re-fills it), t copies to a new dir under <repo>.tmp, y copies the file's path, absolute path, or name to the clipboard, m marks one then a second to compare two entries, c compares the highlighted entry against a bookmark, x removes (confirms), / filters, ? shows the key list, esc closes" = "搁置区快速切换器: 任何文件的 . 菜单也提供 Compare against shelf。切换器内 (导航优先): ↑↓/jk 移动、enter 将文件条目与工作树文件比较 — 对已搁置的提交则以冻结的文件打开文件视图 (enter 将每个文件与工作树比较; . 菜单的 Copy to working dir 恢复一个)、e 在外部编辑器中打开搁置副本 (只读)、p 恢复到某路径 (预填原路径; ctrl+r 重新填入)、t 复制到 <repo>.tmp 下的新目录、y 将文件路径、绝对路径或名称复制到剪贴板、m 标记一个再标记第二个比较两个条目、c 将高亮条目与书签比较、x 删除 (需确认)、/ 筛选、? 显示按键列表、esc 关闭"
"notification center: health recommendations for this repo (e.g. write a commit-graph on a big repo — makes commit browsing ~10× faster). ↑↓ select, enter shows a notice's actions, esc closes. 'Not now' asks again next load; 'Never for this repo' is remembered in prompts.toml" = "通知中心: 此仓库的健康建议 (例如在大仓库上写入 commit-graph — 让提交浏览快约 10×)。↑↓ 选择、enter 显示通知的操作、esc 关闭。'Not now' 下次加载时再询问; 'Never for this repo' 记录在 prompts.toml 中"
"fuzzy file finder: opens a picker over every tracked file; press / then type a query (fvgo → files_view.go) to filter by path, ↑↓/pgup/pgdn to move, enter to open a per-file menu (View content, Diff HEAD↔working tree, History, Blame, Open in editor, Copy path, Copy absolute path), esc closes" = "模糊文件查找: 打开覆盖所有已跟踪文件的选择器; 按 / 后输入查询 (fvgo → files_view.go) 按路径筛选、↑↓/pgup/pgdn 移动、enter 打开单文件菜单 (查看内容、HEAD↔工作树差异、历史、blame、在编辑器中打开、复制路径、复制绝对路径)、esc 关闭"
"worktree popup for the selected branch — the branch name starts as the selection (clean directory); e edits it (a different name creates a NEW branch from it), p seeds it from a saved branch prefix (Settings → Branch prefixes)" = "选中分支的工作树弹窗 — 分支名以选中分支开始 (目录干净)，e 编辑 (不同名称将从其创建新分支)，p 用已保存的分支前缀 (设置 → 分支前缀) 填充名称"
"the same worktree popup with create & switch as enter's default (w + switch in one flow)" = "同一工作树弹窗，enter 默认创建并切换 (w + 切换一步完成)"
"mark a row; m on a second row opens the pair-op picker (merge / rebase / interactive rebase / compare branches)" = "标记一行; 在第二行按 m 打开成对操作选择器 (合并 / 变基 / 交互式变基 / 比较分支)"
"repo switcher popup (navigation-first: ↑↓/jk/pgup/pgdn move, / filters, enter switches — while filtering, the first enter locks the filter)" = "仓库切换器弹窗 (导航优先: ↑↓/jk/pgup/pgdn 移动、/ 筛选、enter 切换 — 筛选时第一次 enter 锁定筛选)"
"settings" = "设置"
"action menu — context actions for the selected row and panel (incl. copy actions)" = "操作菜单 — 针对选中行和面板的上下文操作 (含复制操作)"
"command palette — generic command launcher, opens over the panels OR any browse window (files tree, diff, history, blame, review, stash) (↑↓/jk move, enter runs, esc closes); includes Apply patch, File blame, File history, Find, Git config explorer, Open repo, Open shell, Run shell command, Set up agent skills, Show commit" = "命令面板 — 通用命令启动器，可在面板上打开，也可在任何浏览窗口 (文件树、差异、历史、blame、评审、贮藏) 上打开 (↑↓/jk 移动、enter 运行、esc 关闭); 包含 Apply patch、File blame、File history、Find、Git config explorer、Open repo、Open shell、Run shell command、Set up agent skills、Show commit"
"show commit by SHA: type a commit-ish (SHA / ref); enter resolves it and opens that commit's files in the files-view" = "按 SHA 显示提交: 输入提交标识 (SHA / 引用); enter 解析并在文件视图中打开该提交的文件"
