"gg is falling back to a terminal escape (OSC 52) that many terminals — and tmux without extra config — don't honour, so a copy can silently do nothing." = "gg 会回退使用终端转义序列 (OSC 52)，但许多终端 — 以及未额外配置的 tmux — 并不支持它，因此复制操作可能悄无声息地失效。"
"gg's copy actions (commit SHAs, branch/tag names, diffs) can't reach your system clipboard: a Linux terminal app needs a small helper program and none is installed." = "gg 的复制操作 (提交 SHA、分支/标签名、diff) 无法访问系统剪贴板: Linux 终端应用需要一个小型辅助程序，但尚未安装。"
"Clipboard copy is broken — WSL can't run Windows programs" = "剪贴板复制已失效 — WSL 无法运行 Windows 程序"
"Copying is broken on this machine: WSL cannot run Windows programs, so gg can't hand text to clip.exe." = "本机的复制功能已失效: WSL 无法运行 Windows 程序，因此 gg 无法把文本交给 clip.exe。"
"gg falls back to a terminal escape (OSC 52) that tmux doesn't forward, so a copy silently does nothing — even though the status line says it worked." = "gg 会回退使用终端转义序列 (OSC 52)，但 tmux 不会转发它，因此即便状态栏显示复制成功，实际也悄无声息地什么都没做。"
"The cause is outside gg: the kernel has no WSLInterop entry (systemd-binfmt drops it at boot when systemd is enabled in /etc/wsl.conf)." = "原因在 gg 之外: 内核中没有 WSLInterop 注册项 (当 /etc/wsl.conf 启用 systemd 时，systemd-binfmt 会在启动时将其清除)。"
"Fix it once, so it survives a reboot:" = "一次性修复，使其在重启后依然有效:"
"Or, without touching binfmt — install a Linux clipboard tool, which gg will use instead (WSLg shares its clipboard with Windows):" = "或者不改动 binfmt — 安装一个 Linux 剪贴板工具，gg 会转而使用它 (WSLg 与 Windows 共享剪贴板):"
