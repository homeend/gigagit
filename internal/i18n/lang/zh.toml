"no branches to map" = "没有要映射的分支"
"add" = "添加"
"1 branch isn't tracked by the fetch refspec" = "1 个分支未被 fetch refspec 跟踪"
"%d branches aren't tracked by the fetch refspec" = "%d 个分支未被 fetch refspec 跟踪"
"This clone's fetch refspec doesn't map these branches, so a push never moves their remote-tracking ref — the ↓↑ tip markers and ahead/behind cannot follow them: %s" = "此克隆的 fetch refspec 未映射这些分支，push 后远程跟踪 ref 不会移动 — ↓↑ 尖端标记和 ahead/behind 无法跟随：%s"
"gg can add a per-branch mapping and fetch just those branches (no mass download)." = "gg 可以添加按分支的映射并只抓取这些分支（不会大量下载）。"
"Add mappings + fetch these branches" = "添加映射并抓取这些分支"
"no git locks to remove" = "没有需要移除的 git 锁"
"removing git lock" = "正在移除 git 锁"
