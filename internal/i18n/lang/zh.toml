"title: move to the description field; description: insert a newline" = "标题: 移到描述字段; 描述: 插入换行"
"generate a commit message from the staged diff with a configured commit_message external agent (Settings → External tools) — fills the title/description fields for you to review; nothing commits until ctrl+s. More than one tool configured shows a numbered chooser; an unapproved command shows a first-run approval (remembered per repo); existing title/description text asks before being replaced; esc cancels an in-flight run" = "用配置的 commit_message 外部代理 (设置 → 外部工具) 从已暂存差异生成提交消息 — 填入标题/描述字段供你审阅; ctrl+s 之前不会提交任何东西。配置了多个工具时显示编号选择; 未批准的命令显示首次运行批准 (按仓库记住); 已有标题/描述文本会在替换前询问; esc 取消进行中的运行"
"toggle a wider / fullscreen commit box (easier to read a long generated message); ctrl+t again restores" = "切换更宽 / 全屏的提交框 (更容易阅读长的生成消息); 再按 ctrl+t 恢复"
