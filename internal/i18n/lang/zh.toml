"fullscreen whatever is focused — any panel OR any open popup — to a near-fullscreen box (ctrl+t or esc restores; on a panel, t drops back to the left column)" = "将聚焦对象 — 任何面板或打开的弹窗 — 全屏为近全屏的框 (ctrl+t 或 esc 恢复; 面板上 t 退回左栏)"
