"Copy commit id / commit title (Commits); Copy file path / absolute file path / file name (Files/Staged) — OSC 52" = "复制提交 id / 提交标题 (Commits); 复制文件路径 / 绝对文件路径 / 文件名 (Files/Staged) — OSC 52"
