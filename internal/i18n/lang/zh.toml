"git locks were already gone" = "git 锁已经不存在了"
"A git lock file is present — operations will fail" = "存在 git 锁文件 — 操作将会失败"
"%d git lock files are present — operations will fail" = "存在 %d 个 git 锁文件 — 操作将会失败"
"git creates a lock file while it rewrites the file beside it and removes it on exit, so one left behind means a git process was killed before it could clean up." = "git 在重写相邻文件期间会创建锁文件，并在退出时移除它；因此残留的锁意味着某个 git 进程在清理前被强制终止了。"
"Until it is removed, git refuses to run with \"Another git process seems to be running in this repository\"." = "在移除之前，git 会以 \"Another git process seems to be running in this repository\" 拒绝运行。"
"Only remove these if no other git is running right now — a live git holding one is doing real work, and deleting its lock would corrupt that write." = "只有在当前没有其他 git 正在运行时才移除 — 正在运行的 git 持有的锁被删除会破坏它的写入。"
"Remove the lock file" = "移除锁文件"
