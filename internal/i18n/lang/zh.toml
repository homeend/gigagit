"act on the clicked row like enter (drill into a commit, go to a branch tip, run the selected menu row)" = "对点击的行执行 enter 操作（深入提交、跳到分支顶端、执行选中的菜单行）"
"select the row under the cursor and open its . action menu (also on the diff/history/blame views)" = "选中光标下的行并打开其 . 操作菜单（在 diff/历史/blame 视图中同样有效）"
"act as esc: close the hovered reader, list popup, menu, or files view (text inputs are not affected)" = "作为 esc 使用：关闭悬停的阅读视图、列表弹窗、菜单或文件视图（不影响文本输入）"
"scroll the list under the cursor ([ui] wheel_step rows; files view: tree or commits)" = "滚动光标下的列表 ([ui] wheel_step 行; 文件视图: 树或提交)"
"move the selection" = "移动选择"
"page the selection (a quarter of the viewport)" = "按页移动选择 (视口的四分之一)"
"clear the mark, then the active filter" = "先清除标记，再清除活动的筛选"
"commit the staged index (title + description popup)" = "提交已暂存的索引 (标题 + 描述弹窗)"
"amend the last commit (edit message / fold in staged changes)" = "修改上一次提交 (编辑提交信息 / 并入已暂存的更改)"
"reload all panels (keeps them visible while refreshing)" = "重新加载所有面板 (刷新时保持可见)"
"this help window" = "本帮助窗口"
"quit" = "退出"
"Branches panel" = "Branches 面板"
"create a branch off the selected one (popup). In the popup, ctrl+p picks a saved branch prefix (Settings → Branch prefixes) and seeds the name" = "基于选中分支创建分支 (弹窗)。弹窗中 ctrl+p 选择已保存的分支前缀 (设置 → 分支前缀) 并作为名称初值"
"create a branch and switch to it" = "创建分支并切换过去"
"delete the selected branch" = "删除选中的分支"
"on a non-current branch: pull it in the background (stay on your branch) — same as the .-menu 'Pull <branch> (stay here)'" = "在非当前分支上: 后台拉取它 (留在你的分支) — 与 .-菜单的 'Pull <branch> (stay here)' 相同"
"go to the selected branch's tip in the Commits panel — jumps if the tip is loaded, otherwise deep-searches history for it (the ctrl+f machinery: clears the / filter, pages with a budget, asks before scanning deeper)" = "在 Commits 面板中转到选中分支的顶端 — 顶端已加载则跳转，否则深入搜索历史 (ctrl+f 机制: 清除 / 筛选、按预算分页、扫得更深前先询问)"
"Solo the selected branch AND go to its tip: scopes the Commits feed to the branch (press again to un-solo) and lands the cursor on the tip once the reload finishes" = "Solo 选中的分支并转到其顶端: 将 Commits 流限定到该分支 (再按取消)，重载完成后光标落在顶端"
"rename branch / copy branch name / Pull <branch> (stay here) / Solo this branch / Add to commit view / Go to tip in commits (.-menu)" = "重命名分支 / 复制分支名 / Pull <branch> (stay here) / Solo this branch / Add to commit view / Go to tip in commits (.-菜单)"
"Solo this branch (.-menu): scope the Commits panel to this branch (re-run to un-solo); Add/Remove from commit view builds a multi-branch set; Show all branches clears it; Go to tip in commits jumps the Commits cursor to this branch's tip (enter does the same; both deep-search unloaded history when needed)" = "Solo this branch (.-菜单): 将 Commits 面板限定到此分支 (再次运行取消); Add/Remove from commit view 构建多分支集合; Show all branches 清除它; Go to tip in commits 将 Commits 光标跳到此分支顶端 (enter 相同; 两者都会按需深搜未加载的历史)"
"Remotes panel" = "Remotes 面板"
"checkout: create or fast-forward a local tracking branch (stay on the current branch); on the current branch's own remote it prompts instead: pull now (when behind) / check out under a different name" = "检出: 创建或快进本地跟踪分支 (留在当前分支); 在当前分支自己的远程上则改为询问: 立即拉取 (落后时) / 以其他名称检出"
"checkout and switch to it — fast-forward-safe; a diverged local branch offers check-out-as-a-different-name" = "检出并切换过去 — 快进安全; 已分叉的本地分支会提议以其他名称检出"
"Check out <remote> as… / Switch to <remote> as… (.-menu): materialize the remote branch under a local name you choose" = "Check out <remote> as… / Switch to <remote> as… (.-菜单): 以你选择的本地名称落地远程分支"
"fetch all remotes (updates tracking refs and the behind-counts)" = "获取所有远程 (更新跟踪引用和落后计数)"
"Prune (.-menu): drop tracking refs for branches deleted upstream" = "Prune (.-菜单): 清除上游已删除分支的跟踪引用"
"copy remote branch name (.-menu)" = "复制远程分支名 (.-菜单)"
"Worktrees panel" = "Worktrees 面板"
"switch into the selected worktree" = "切换进选中的工作树"
"remove the selected worktree" = "移除选中的工作树"
"rename the selected worktree directory (git worktree move; the current worktree follows the move)" = "重命名所选工作树目录 (git worktree move；当前工作树会跟随移动)"
"Move worktree (.-menu): relocate the selected worktree to any path" = "Move worktree (.-菜单)：将所选工作树迁移到任意路径"
"Tags panel" = "Tags 面板"
"a tab in the middle (Files) box — ctrl+←/→ switches Files ⇄ Tags; ● annotated, ○ lightweight; ▲ marks tags that exist on the default remote (origin or first remote) — local-only or not-yet-checked tags show no marker (deliberately indistinguishable before a lookup runs)" = "中部 (Files) 框的一个标签页 — ctrl+←/→ 在 Files ⇄ Tags 间切换; ● 附注、○ 轻量; ▲ 标记存在于默认远程 (origin 或第一个远程) 的标签 — 仅本地或尚未检查的标签无标记 (查询前刻意不作区分)"
"jump the Commits cursor to the tag's target commit" = "将 Commits 光标跳到标签指向的提交"
"Check out tag (.-menu): detached HEAD, a new branch at the tag, or a new worktree (branch + dir prefilled from the tag name)" = "Check out tag (.-菜单): detached HEAD、在标签处新建分支，或新建工作树 (分支和目录按标签名预填)"
"Push tag (.-menu): push the tag to a remote (auto when only one, else pick)" = "Push tag (.-菜单): 将标签推送到远程 (只有一个时自动，否则选择)"
"Delete tag (.-menu): delete the selected tag after a confirm" = "Delete tag (.-菜单): 确认后删除选中的标签"
"Refresh remote status (.-menu): one-shot git ls-remote --tags; updates the ▲ marker for every visible tag; errors shown on the status line; for background auto-refresh see [refresh] remote_tags" = "Refresh remote status (.-菜单): 一次性 git ls-remote --tags; 更新所有可见标签的 ▲ 标记; 错误显示在状态行; 后台自动刷新见 [refresh] remote_tags"
"Shelf panel" = "Shelf 面板"
"frozen, non-git per-file copies (the default bucket); add via the . menu anywhere a file is focused" = "冻结的、git 之外的按文件副本 (默认桶); 在任何文件获得焦点处经 . 菜单添加"
"diff the shelved copy against the current working-tree file" = "将搁置副本与当前工作树文件比较"
"mark an entry; mark a second to compare the two shelved copies side-by-side" = "标记一个条目; 再标记第二个即可并排比较两个搁置副本"
"Restore to… (writes the copy to a path; prefilled with the original path, ctrl+r re-fills it) / Remove from shelf" = "Restore to… (将副本写入某路径; 预填原路径，ctrl+r 重新填入) / Remove from shelf"
"Reflog panel" = "Reflog 面板"
"a tab in the bottom-left (Staged) box — ctrl+←/→ switches Staged ⇄ Reflog; lists the HEAD reflog (read-only), newest first" = "左下 (Staged) 框的一个标签页 — ctrl+←/→ 在 Staged ⇄ Reflog 间切换; 列出 HEAD reflog (只读)，最新在前"
"open the entry's commit in the files view (changed files vs parent; even for dangling commits)" = "在文件视图中打开条目的提交 (相对父提交的变更文件; 悬空提交也可)"
"Copy SHA / Bookmark this commit / Shelf this commit (name it) (compare via the g switcher)" = "Copy SHA / Bookmark this commit / Shelf this commit (命名) (比较经 g 切换器)"
"Reset to this entry (.-menu): move the current branch here (soft/mixed/hard) / Check out this entry (detached or as a new branch you switch to)" = "Reset to this entry (.-菜单): 将当前分支移到此处 (soft/mixed/hard) / Check out this entry (分离头指针，或作为切换过去的新分支)"
"Files panel" = "Files 面板"
"stage the marked files (or the cursor row) — git add" = "暂存标记的文件 (或光标行) — git add"
"stage hunks: open the region/line staging picker" = "暂存代码块: 打开区域/行暂存选择器"
"stash changes: popup to name + pick files (ctrl+s confirms)" = "贮藏更改: 命名并挑选文件的弹窗 (ctrl+s 确认)"
"mark / unmark a file (multi-select for staging, stashing, discarding)" = "标记 / 取消标记文件 (用于暂存、贮藏、丢弃的多选)"
"side-by-side diff of the unstaged change (index → working tree)" = "未暂存更改的并排差异 (索引 → 工作树)"
"file history: commits that touched it (left) + per-commit diff (right)" = "文件历史: 触及它的提交 (左) + 每个提交的差异 (右)"
"blame: who last changed each line, grouped by commit" = "blame: 谁最后改动了每一行，按提交分组"
"discard the marked files (or the cursor row): revert edits, delete new files (confirm)" = "丢弃标记的文件 (或光标行): 还原编辑、删除新文件 (确认)"
"discard ALL unstaged changes: revert every edit + delete every new file (confirm)" = "丢弃所有未暂存更改: 还原每处编辑 + 删除每个新文件 (确认)"
"on an untracked file: Add to .gitignore (this file, anchored) / Add extension to .gitignore (*.ext) — appends to the repo-root .gitignore" = "对未跟踪文件: Add to .gitignore (此文件，锚定) / Add extension to .gitignore (*.ext) — 追加到仓库根 .gitignore"
"Edit in editor: open the selected file in $VISUAL/$EDITOR (vi/notepad fallback), then refresh" = "Edit in editor: 用 $VISUAL/$EDITOR (vi/notepad 兜底) 打开选中文件，然后刷新"
"Staged panel" = "Staged 面板"
"unstage the marked files (or the cursor row) — git restore --staged" = "取消暂存标记的文件 (或光标行) — git restore --staged"
"side-by-side diff of the staged change (HEAD → index)" = "已暂存更改的并排差异 (HEAD → 索引)"
"Open staged version in external editor: open the index blob (the staged copy, distinct from the working file) in $VISUAL/$EDITOR, read-only" = "Open staged version in external editor: 用 $VISUAL/$EDITOR 打开索引 blob (暂存副本，不同于工作文件)，只读"
"mark / unmark a file; h history, b blame (as in Files)" = "标记 / 取消标记文件; h 历史、b blame (同 Files)"
"Conflict resolution process (x)" = "冲突解决流程 (x)"
"enter / resume the conflict process (repo conflicted, or a merge/rebase paused after external resolution)" = "进入 / 恢复冲突流程 (仓库有冲突，或外部解决后暂停的合并/变基)"
"move between conflicted files" = "在冲突文件间移动"
"pick hunks: open the line editor (both-modified files)" = "挑选代码块: 打开行编辑器 (双方都修改的文件)"
"keep current / incoming (both-modified files)" = "保留 current / incoming (双方都修改的文件)"
"keep modified / delete / keep base (modify-delete files)" = "保留修改 / 删除 / 保留 base (修改-删除文件)"
"mark resolved (after editing by hand)" = "标记为已解决 (手工编辑后)"
"mark all resolved" = "全部标记为已解决"
"run external tool (Claude/Junie/Meld…) configured for conflict resolution — Settings (,) → External tools" = "运行为冲突解决配置的外部工具 (Claude/Junie/Meld…) — 设置 (,) → 外部工具"
"continue / abort the merge or rebase (once resolved)" = "继续 / 中止合并或变基 (解决后)"
"cycle text display: cutoff / wrap / scroll" = "循环文本显示: 截断 / 换行 / 滚动"
"leave the process (resume later with x); esc in a running step cancels it" = "离开流程 (稍后用 x 恢复); 运行中步骤里 esc 取消该步骤"
"Hunk picker (x conflict resolve / H stage)" = "代码块选择器 (x 冲突解决 / H 暂存)"
"switch the focused side (current ↔ incoming)" = "切换聚焦侧 (current ↔ incoming)"
"move the line cursor (steps across regions)" = "移动行光标 (跨区域步进)"
"scroll the view without moving the line cursor; the first plain ↑/↓ snaps the view back to the cursor" = "滚动视图而不移动行光标；按一次普通 ↑/↓ 视图即回到光标处"
"pick the cursor line (builds the result in pick order)" = "选取光标行 (按选取顺序构建结果)"
"toggle this side of the region — all its lines; left, right, or both can be on, and toggle order = order in the result" = "切换该区域这一侧的全部行 — 可选左侧、右侧或两侧，切换顺序即结果顺序"
"toggle this side across ALL regions (tri-state: complete everywhere, else clear everywhere)" = "在所有区域切换这一侧（三态：未全选则补全，已全选则清除）"
"collapse / expand the output pane (the live assembled result)" = "折叠 / 展开输出面板（实时组装结果）"
"switch focus between the selection grid and the output pane — Tab on a collapsed pane expands and focuses it" = "在选择网格与输出面板之间切换焦点 — 面板折叠时按 Tab 会展开并获得焦点"
"while the output pane is focused: ↑/↓ scroll the result end to end; selection keys wait until Tab returns focus to the grid; esc/enter keep cancel/apply" = "输出面板获得焦点时：↑/↓ 滚动整个结果；选择键在 Tab 返回网格前无效；esc/enter 仍为取消/应用"
"zoom the focused half (grid or output) to the whole body — Tab swaps which half is zoomed, ctrl+t or esc restores the split" = "将聚焦的半屏（网格或输出）放大到整个主体 — Tab 切换放大的一半，ctrl+t 或 esc 恢复分栏"
"jump to the next / previous region" = "跳到下一个 / 上一个区域"
"apply when every region is resolved" = "所有区域都解决后应用"
"cancel (close without resolving)" = "取消 (不解决直接关闭)"
"Commits panel" = "Commits 面板"
"Commits (%s)" = "提交 (%s)"
"shows commits from ALL local branches by default, in date order, with a single-line commit graph (natural order only; hidden while filtering/sorting); header shows the mode — Commits (all) / Commits (solo: <branch>)" = "默认显示所有本地分支的提交，按日期排序，附单行提交图 (仅自然顺序; 筛选/排序时隐藏); 标题栏显示模式 — Commits (all) / Commits (solo: <branch>)"
"the left column is the branch the commit is on: BRIGHT *current/branch on that branch's tip, grayed otherwise; long names trim with … (select to reveal the full name); the commit id shows in the status bar. Filtering still matches the full id and full branch name" = "左栏是提交所在的分支: 在该分支顶端为明亮的 *current/branch，其余为灰; 长名称以 … 截断 (选中可显示全名); 提交 id 显示在状态栏。筛选仍匹配完整 id 和完整分支名"
"in the Commits graph, ↓ marks a local branch's tip and ↑ the tip of its tracked remote (both together = local and remote in sync)" = "在 Commits 图中，↓ 标记本地分支顶端，↑ 标记其跟踪远程的顶端 (两者同现 = 本地与远程同步)"
"show the selected commit's files in the left column (focus stays on the commit list)" = "在左栏显示选中提交的文件 (焦点留在提交列表)"
"drill into the selected commit's files: open the files view AND move focus to the file tree (l + focus tree)" = "深入选中提交的文件: 打开文件视图并将焦点移到文件树 (l + 聚焦树)"
"view the selected commit's full message in a scrollable popup; also works while the files view is open (the popup layers over the tree, esc returns to it)" = "在可滚动弹窗中查看选中提交的完整信息; 文件视图打开时也可用 (弹窗叠在树上，esc 返回)"
"open the selected commit's message in the external editor ($EDITOR, read-only)" = "在外部编辑器中打开选中提交的信息 ($EDITOR，只读)"
"uncommitted work shows as ◇ Working tree / ◇ Staged rows atop the graph (only when dirty); l/enter diffs them (working tree vs index, index vs HEAD); commit-only actions are unavailable on them" = "未提交的工作以 ◇ Working tree / ◇ Staged 行显示在图顶部 (仅在有改动时); l/enter 查看差异 (工作树 vs 索引、索引 vs HEAD); 仅限提交的操作在其上不可用"
"the ◇ Working tree / ◇ Staged rows can be added (m) to the ◉ compare selection like commits — Compare selection then diffs a commit against your working copy or index" = "◇ Working tree / ◇ Staged 行也能像提交一样 (用 m) 加入 ◉ 比较选择 — Compare selection 随后将提交与你的工作副本或索引比较"
"highlight search: keep all commits visible, dim non-matches (graph stays); ctrl+↑/↓ jump prev/next match; enter keeps, esc clears" = "高亮搜索: 保持所有提交可见，弱化不匹配项 (图保留); ctrl+↑/↓ 跳到上/下一个匹配; enter 保留、esc 清除"
"Commits: eager search — page unloaded history for the next match of the active / filter or @ highlight query and jump to it; every press digs past the already-loaded commits and re-asks before scanning deeper" = "Commits: 积极搜索 — 在未加载的历史中分页查找活动 / 筛选或 @ 高亮查询的下一个匹配并跳转过去；每次按下都会越过已加载的提交继续深入，扫得更深前会再次询问"
"Commits: load the next batch of commits now (without scrolling to the end)" = "Commits: 立即加载下一批提交 (无需滚到末尾)"
"jump to the top / bottom of the focused list; End on Commits also loads the next batch" = "跳到聚焦列表的顶部 / 底部; 在 Commits 上 End 还会加载下一批"
"filter commits by path / author / message / date (popup; empty fields clear that axis, ctrl+r clears all fields); graph hides while filtered" = "按路径 / 作者 / 提交信息 / 日期筛选提交 (弹窗; 空字段清除该维度、ctrl+r 清空全部字段); 筛选时隐藏图"
"add / remove the selected commit (or ◇ Working tree / ◇ Staged row) to the ◉ compare selection; the . menu then drives Compare selection or Squash" = "把选中提交 (或 ◇ Working tree / ◇ Staged 行) 加入 / 移出 ◉ 比较选择; 随后 . 菜单可执行 Compare selection 或 Squash"
"mark / unmark the selected commit for compare — the same ◉ set as m but capped at two: the second space-mark opens the comparison immediately (with 2 already marked, space a marked one to unmark first; esc clears ALL marks, or . → Unmark all commits). Re-opening the comparison already on screen keeps it (no reload)" = "标记 / 取消标记选中提交用于比较 — 与 m 相同的 ◉ 集合但上限为二: 第二次 space 标记立即打开比较 (已有 2 个标记时，先 space 一个已标记的取消; esc 清除所有标记，或 . → Unmark all commits)。重新打开已在屏幕上的比较会保留它 (不重载)"
"view message / open message in editor / rename commit / copy commit id / Create branch here / Create worktree from this commit / Cherry-pick here / Revert this commit / Reset to this commit (soft|mixed|hard) / Compare against working tree / Compare against staged / Export commit as patch / Solo from this commit / Add to compare selection (space) / Unmark commit / Unmark all commits / Compare selection / Squash N commits / Drop N selected commits / Show all branches when soloed / Show as list|graph (.-menu)" = "查看提交信息 / 在编辑器中打开提交信息 / 重命名提交 / 复制提交 id / Create branch here / 从此提交创建工作树 / Cherry-pick here / Revert this commit / Reset to this commit (soft|mixed|hard) / Compare against working tree / Compare against staged / Export commit as patch / Solo from this commit / Add to compare selection (space) / Unmark commit / Unmark all commits / Compare selection / Squash N commits / Drop N selected commits / Show all branches when soloed / Show as list|graph (.-菜单)"
"Compare against working tree / Compare against staged (.-menu): open the files view as a whole-tree diff of this commit vs your working copy / the index; enter on a file diffs that path" = "Compare against working tree / Compare against staged (.-菜单): 以此提交对你的工作副本 / 索引的整树差异打开文件视图; 在文件上 enter 查看该路径差异"
"grow the ◉ compare selection (a contiguous run of commits)" = "扩大 ◉ 比较选择 (连续的一段提交)"
"Compare selection (.-menu): toggle commits into the ◉ set (m / Add to compare selection / shift+↑↓), then Compare selection — 2 = the diff between them, 3+ = the combined diff of the range (oldest^..newest, refused from a root commit); Unmark all commits (N) empties it" = "Compare selection (.-菜单): 将提交切换进 ◉ 集合 (m / Add to compare selection / shift+↑↓)，然后 Compare selection — 2 个 = 两者之间的差异、3 个及以上 = 范围的合并差异 (oldest^..newest，根提交拒绝); Unmark all commits (N) 清空它"
"Squash N commits (.-menu): with 2+ commits in the ◉ set, combine the selected commits into one (messages concatenated; reword afterward). When they aren't adjacent, a prompt offers Reorder & squash — the skipped in-between commits move to just after the squash. Off-branch selections are refused; conflicts pause for `git rebase --continue`" = "Squash N commits (.-菜单): ◉ 集合中有 2 个以上提交时，把选中的提交合并为一个 (提交信息串接; 之后可改写)。不相邻时会提议 Reorder & squash — 被跳过的中间提交移到 squash 之后。跨分支的选择被拒绝; 冲突会暂停等待 `git rebase --continue`"
"Drop N selected commits (.-menu): with 2+ commits in the ◉ set, delete them all in one interactive rebase (no adjacency needed; gaps stay). Off-branch / working-tree-or-staged selections are refused; conflicts pause for `git rebase --continue`. Drop commit (no set) drops just the cursor commit" = "Drop N selected commits (.-菜单): ◉ 集合中有 2 个以上提交时，一次交互式变基里全部删除 (无需相邻; 间隔保留)。跨分支 / 工作树或暂存的选择被拒绝; 冲突会暂停等待 `git rebase --continue`。Drop commit (无集合) 只删除光标处提交"
"on a commit that is a branch's tip: Rename branch <name> / Delete branch <name> (.-menu) — one pair per local tip; delete is hidden for a checked-out branch" = "在作为分支顶端的提交上: Rename branch <name> / Delete branch <name> (.-菜单) — 每个本地顶端一对; 已检出分支隐藏 delete"
