"branch-pair compare only: cycle the origin filter — all differences / only files the marked branch changed / only files the selected branch changed (computed from the merge base; the diff shown per file is always the tip-to-tip difference)" = "仅分支对比较: 循环切换来源筛选 — 全部差异 / 仅被标记分支改动的文件 / 仅选中分支改动的文件 (从合并基计算; 每个文件显示的差异始终是顶端到顶端的差异)"
"commits side: the full Commits-panel menu (cherry-pick / revert / reset / create branch|worktree|tag / compare / …); tree side: copy path/name" = "提交侧: 完整的 Commits 面板菜单 (cherry-pick / revert / reset / 创建分支|工作树|标签 / 比较 / …); 树侧: 复制路径/名称"
"commits side: narrow / widen / snap / pan the commit graph window (same as the Commits panel)" = "提交侧: 收窄 / 加宽 / 对齐 / 平移提交图窗口 (同 Commits 面板)"
