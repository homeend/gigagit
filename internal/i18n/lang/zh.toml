"search the focused side: file paths (tree) or the commit list (commits side); enter keeps it, esc cancels" = "搜索聚焦侧: 文件路径 (树) 或提交列表 (提交侧); enter 保留、esc 取消"
"tree side: diff of the selected file (changed-files mode vs parent; all-files mode vs the working tree). Commit-list side: drill in — move focus to the file tree" = "树侧: 选中文件的差异 (变更文件模式对父提交; 全部文件模式对工作树)。提交列表侧: 深入 — 焦点移到文件树"
"toggle all files: every file in the commit's tree (as if checked out) vs only the files it changed" = "切换全部文件: 提交树中的每个文件 (如同检出) vs 仅其改动的文件"
"tree side: View file — show the file's content at this commit (no diff) in the right pane ([↑/↓] scroll, [z] view mode, [esc] close, [←] back to the tree); Open in external editor — open that content in $VISUAL/$EDITOR, read-only" = "树侧: View file — 在右窗格显示该文件在此提交的内容 (无差异) ([↑/↓] 滚动、[z] 显示模式、[esc] 关闭、[←] 回到树); Open in external editor — 用 $VISUAL/$EDITOR 打开该内容，只读"
"view the underlying commit's full message in a popup over the tree (esc returns; commit views only, not stash/compare)" = "在树上方的弹窗中查看底层提交的完整消息 (esc 返回; 仅提交视图，不含 stash/compare)"
"history of the selected file (tree side)" = "选中文件的历史 (树侧)"
