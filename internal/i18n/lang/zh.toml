"from the last / first change, press twice to step to the next / previous file in the list (a bottom-left cue advertises it; a notice names the new file)" = "在最后 / 最前一个更改处按两次可步进到列表中的下一个 / 上一个文件 (左下角有提示; 通知会给出新文件名)"
"jump to top / bottom of the file; at the edge a bottom-left cue appears and pressing it again steps to the previous / next file in the list (a notice names the new file)" = "跳到文件顶部 / 底部; 在边缘会出现左下角提示，再按一次步进到列表中的上一个 / 下一个文件 (通知会给出新文件名)"
