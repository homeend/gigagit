# --- narrow fetch refspec notice (Task 5) ---
"%s/%s is not tracked by the fetch refspec — tip markers and ahead/behind cannot follow it. Add a tracking mapping for this branch?" = "%s/%s 未被 fetch refspec 跟踪 — 分支尖端标记和 ahead/behind 无法跟随。为该分支添加跟踪映射？"
"; mapped %s/%s for tracking" = "；已映射 %s/%s 用于跟踪"
"; could not add fetch mapping: %s" = "；无法添加 fetch 映射：%s"
"; fetch mapping added but fetch failed: %s" = "；已添加 fetch 映射但 fetch 失败：%s"
"mapped 1 branch for tracking" = "已映射 1 个分支用于跟踪"
