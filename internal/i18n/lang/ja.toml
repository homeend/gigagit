"Solo this branch (.-menu): scope the Commits panel to this branch (re-run to un-solo); Add/Remove from commit view builds a multi-branch set; Show all branches clears it; Go to tip in commits jumps the Commits cursor to this branch's tip (enter does the same; both deep-search unloaded history when needed)" = "Solo this branch (.-メニュー): Commits パネルをこのブランチに限定 (再実行で解除); Add/Remove from commit view は複数ブランチセットを構成; Show all branches で解除; Go to tip in commits は Commits カーソルをこのブランチの先端へ移動 (enter も同じ; どちらも必要なら未読み込みの履歴を深く検索)"
"Remotes panel" = "Remotes パネル"
"checkout: create or fast-forward a local tracking branch (stay on the current branch); on the current branch's own remote it prompts instead: pull now (when behind) / check out under a different name" = "チェックアウト: ローカル追跡ブランチを作成または早送り (現在のブランチに留まる); 現在のブランチ自身のリモートでは代わりに確認します: 今すぐプル (遅れている場合) / 別名でチェックアウト"
"checkout and switch to it — fast-forward-safe; a diverged local branch offers check-out-as-a-different-name" = "チェックアウトして切り替え — 早送り安全; 分岐したローカルブランチには別名でのチェックアウトを提案"
"Check out <remote> as… / Switch to <remote> as… (.-menu): materialize the remote branch under a local name you choose" = "Check out <remote> as… / Switch to <remote> as… (.-メニュー): リモートブランチを自分で選んだローカル名で作成"
"fetch all remotes (updates tracking refs and the behind-counts)" = "全リモートをフェッチ (追跡参照と behind カウントを更新)"
"Prune (.-menu): drop tracking refs for branches deleted upstream" = "Prune (.-メニュー): 上流で削除されたブランチの追跡参照を削除"
"copy remote branch name (.-menu)" = "リモートブランチ名をコピー (.-メニュー)"
"Worktrees panel" = "Worktrees パネル"
"switch into the selected worktree" = "選択中のワークツリーへ切り替え"
"remove the selected worktree" = "選択中のワークツリーを削除"
"Tags panel" = "Tags パネル"
"a tab in the middle (Files) box — ctrl+←/→ switches Files ⇄ Tags; ● annotated, ○ lightweight; ▲ marks tags that exist on the default remote (origin or first remote) — local-only or not-yet-checked tags show no marker (deliberately indistinguishable before a lookup runs)" = "中段 (Files) ボックスのタブ — ctrl+←/→ で Files ⇄ Tags を切替; ● 注釈付き、○ 軽量; ▲ はデフォルトリモート (origin または最初のリモート) に存在するタグ — ローカルのみ、または未確認のタグにはマーカーなし (確認前は意図的に区別されません)"
"jump the Commits cursor to the tag's target commit" = "Commits カーソルをタグの対象コミットへ移動"
"Check out tag (.-menu): detached HEAD, a new branch at the tag, or a new worktree (branch + dir prefilled from the tag name)" = "Check out tag (.-メニュー): detached HEAD、タグ位置の新ブランチ、または新ワークツリー (ブランチとディレクトリはタグ名からプリセット)"
"Push tag (.-menu): push the tag to a remote (auto when only one, else pick)" = "Push tag (.-メニュー): タグをリモートへプッシュ (1 つだけなら自動、それ以外は選択)"
"Delete tag (.-menu): delete the selected tag after a confirm" = "Delete tag (.-メニュー): 確認後に選択中のタグを削除"
"Refresh remote status (.-menu): one-shot git ls-remote --tags; updates the ▲ marker for every visible tag; errors shown on the status line; for background auto-refresh see [refresh] remote_tags" = "Refresh remote status (.-メニュー): 一回きりの git ls-remote --tags; 表示中の全タグの ▲ マーカーを更新; エラーはステータス行に表示; バックグラウンド自動更新は [refresh] remote_tags を参照"
"Shelf panel" = "Shelf パネル"
"frozen, non-git per-file copies (the default bucket); add via the . menu anywhere a file is focused" = "凍結された、git 外のファイル単位コピー (デフォルトバケット); ファイルがフォーカスされている場所ならどこでも . メニューから追加"
"diff the shelved copy against the current working-tree file" = "シェルフのコピーを現在のワーキングツリーのファイルと差分表示"
"mark an entry; mark a second to compare the two shelved copies side-by-side" = "エントリをマーク; 2 つ目をマークするとシェルフの 2 コピーをサイドバイサイドで比較"
"Restore to… (writes the copy to a path; prefilled with the original path, ctrl+r re-fills it) / Remove from shelf" = "Restore to… (コピーをパスへ書き込み; 元のパスがプリセット、ctrl+r で再セット) / Remove from shelf"
"Reflog panel" = "Reflog パネル"
"a tab in the bottom-left (Staged) box — ctrl+←/→ switches Staged ⇄ Reflog; lists the HEAD reflog (read-only), newest first" = "左下 (Staged) ボックスのタブ — ctrl+←/→ で Staged ⇄ Reflog を切替; HEAD の reflog を一覧 (読み取り専用)、新しい順"
"open the entry's commit in the files view (changed files vs parent; even for dangling commits)" = "エントリのコミットをファイルビューで開く (親との変更ファイル; dangling コミットでも可)"
"Copy SHA / Bookmark this commit / Shelf this commit (name it) (compare via the g switcher)" = "Copy SHA / Bookmark this commit / Shelf this commit (名前を付ける) (比較は g スイッチャーから)"
"Reset to this entry (.-menu): move the current branch here (soft/mixed/hard) / Check out this entry (detached or as a new branch you switch to)" = "Reset to this entry (.-メニュー): 現在のブランチをここへ移動 (soft/mixed/hard) / Check out this entry (detached、または切り替える新ブランチとして)"
"Files panel" = "Files パネル"
"stage the marked files (or the cursor row) — git add" = "マークしたファイル (またはカーソル行) をステージ — git add"
"stage hunks: open the region/line staging picker" = "ハンクをステージ: 領域/行単位のステージングピッカーを開く"
"stash changes: popup to name + pick files (ctrl+s confirms)" = "変更をスタッシュ: 名前を付けてファイルを選ぶポップアップ (ctrl+s で確定)"
"mark / unmark a file (multi-select for staging, stashing, discarding)" = "ファイルのマーク / 解除 (ステージ・スタッシュ・破棄のための複数選択)"
"side-by-side diff of the unstaged change (index → working tree)" = "未ステージ変更のサイドバイサイド差分 (インデックス → ワーキングツリー)"
"file history: commits that touched it (left) + per-commit diff (right)" = "ファイル履歴: そのファイルに触れたコミット (左) + コミット別差分 (右)"
"blame: who last changed each line, grouped by commit" = "blame: 各行を最後に変更した人を、コミット単位でグループ表示"
"discard the marked files (or the cursor row): revert edits, delete new files (confirm)" = "マークしたファイル (またはカーソル行) を破棄: 編集を元に戻し、新規ファイルを削除 (確認あり)"
"discard ALL unstaged changes: revert every edit + delete every new file (confirm)" = "すべての未ステージ変更を破棄: 全編集を元に戻し、全新規ファイルを削除 (確認あり)"
"on an untracked file: Add to .gitignore (this file, anchored) / Add extension to .gitignore (*.ext) — appends to the repo-root .gitignore" = "未追跡ファイルで: Add to .gitignore (このファイル、アンカー付き) / Add extension to .gitignore (*.ext) — リポジトリ直下の .gitignore に追記"
"Edit in editor: open the selected file in $VISUAL/$EDITOR (vi/notepad fallback), then refresh" = "Edit in editor: 選択中のファイルを $VISUAL/$EDITOR (vi/notepad フォールバック) で開き、その後更新"
"Staged panel" = "Staged パネル"
"unstage the marked files (or the cursor row) — git restore --staged" = "マークしたファイル (またはカーソル行) のステージを解除 — git restore --staged"
"side-by-side diff of the staged change (HEAD → index)" = "ステージ済み変更のサイドバイサイド差分 (HEAD → インデックス)"
"Open staged version in external editor: open the index blob (the staged copy, distinct from the working file) in $VISUAL/$EDITOR, read-only" = "Open staged version in external editor: インデックスの blob (ステージ済みコピー、ワーキングファイルとは別物) を $VISUAL/$EDITOR で開く、読み取り専用"
"mark / unmark a file; h history, b blame (as in Files)" = "ファイルのマーク / 解除; h 履歴、b blame (Files と同様)"
"Conflict resolution process (x)" = "競合解決プロセス (x)"
"enter / resume the conflict process (repo conflicted, or a merge/rebase paused after external resolution)" = "競合プロセスに入る / 再開 (リポジトリが競合中、または外部解決後に一時停止したマージ/リベース)"
"move between conflicted files" = "競合したファイル間を移動"
"pick hunks: open the line editor (both-modified files)" = "ハンクを選ぶ: 行エディタを開く (両側変更ファイル)"
"keep current / incoming (both-modified files)" = "current / incoming を採用 (両側変更ファイル)"
"keep modified / delete / keep base (modify-delete files)" = "変更を採用 / 削除 / base を採用 (変更-削除ファイル)"
"mark resolved (after editing by hand)" = "解決済みにする (手動編集後)"
"mark all resolved" = "すべて解決済みにする"
"run external tool (Claude/Junie/Meld…) configured for conflict resolution — Settings (,) → External tools" = "競合解決用に設定した外部ツール (Claude/Junie/Meld…) を実行 — 設定 (,) → 外部ツール"
"continue / abort the merge or rebase (once resolved)" = "マージまたはリベースを続行 / 中止 (解決後)"
"cycle text display: cutoff / wrap / scroll" = "テキスト表示を切り替え: 切り詰め / 折り返し / スクロール"
"leave the process (resume later with x); esc in a running step cancels it" = "プロセスを離れる (x で後で再開); 実行中のステップでの esc はそれをキャンセル"
"Hunk picker (x conflict resolve / H stage)" = "ハンクピッカー (x 競合解決 / H ステージ)"
"switch the focused side (current ↔ incoming)" = "フォーカスする側を切り替え (current ↔ incoming)"
"move the line cursor (steps across regions)" = "行カーソルを移動 (領域をまたいで進む)"
"pick the cursor line (builds the result in pick order)" = "カーソル行を選択 (選択順に結果を構築)"
"take the whole region from current / incoming" = "領域全体を current / incoming から取得"
"take all regions from current / incoming" = "全領域を current / incoming から取得"
"jump to the next / previous region" = "次 / 前の領域へジャンプ"
"apply when every region is resolved" = "全領域が解決したら適用"
"cancel (close without resolving)" = "キャンセル (解決せずに閉じる)"
"Commits panel" = "Commits パネル"
"shows commits from ALL local branches by default, in date order, with a single-line commit graph (natural order only; hidden while filtering/sorting); header shows the mode — Commits (all) / Commits (solo: <branch>)" = "デフォルトではすべてのローカルブランチのコミットを日付順で、単一行のコミットグラフ付きで表示 (自然順のみ; フィルタ/ソート中は非表示); ヘッダーにモード表示 — Commits (all) / Commits (solo: <branch>)"
"the left column is the branch the commit is on: BRIGHT *current/branch on that branch's tip, grayed otherwise; long names trim with … (select to reveal the full name); the commit id shows in the status bar. Filtering still matches the full id and full branch name" = "左カラムはコミットの属するブランチ: そのブランチの先端では明るい *current/branch、それ以外はグレー; 長い名前は … で切り詰め (選択で全名を表示); コミット ID はステータスバーに表示。フィルタは完全な ID と完全なブランチ名にもマッチします"
"in the Commits graph, ↓ marks a local branch's tip and ↑ the tip of its tracked remote (both together = local and remote in sync)" = "Commits グラフでは、↓ がローカルブランチの先端、↑ が追跡リモートの先端を示す (両方同時 = ローカルとリモートが同期)"
"show the selected commit's files in the left column (focus stays on the commit list)" = "選択中コミットのファイルを左カラムに表示 (フォーカスはコミットリストのまま)"
"drill into the selected commit's files: open the files view AND move focus to the file tree (l + focus tree)" = "選択中コミットのファイルへドリルイン: ファイルビューを開き、フォーカスをファイルツリーへ移動 (l + ツリーフォーカス)"
"view the selected commit's full message in a scrollable popup; also works while the files view is open (the popup layers over the tree, esc returns to it)" = "選択中コミットの全文メッセージをスクロール可能なポップアップで表示; ファイルビューが開いていても使えます (ポップアップはツリーの上に重なり、esc で戻る)"
"open the selected commit's message in the external editor ($EDITOR, read-only)" = "選択中コミットのメッセージを外部エディタで開く ($EDITOR、読み取り専用)"
"uncommitted work shows as ◇ Working tree / ◇ Staged rows atop the graph (only when dirty); l/enter diffs them (working tree vs index, index vs HEAD); commit-only actions are unavailable on them" = "未コミットの作業はグラフ上部に ◇ Working tree / ◇ Staged 行として表示 (ダーティ時のみ); l/enter で差分表示 (ワーキングツリー vs インデックス、インデックス vs HEAD); コミット専用アクションは使えません"
"the ◇ Working tree / ◇ Staged rows can be added (m) to the ◉ compare selection like commits — Compare selection then diffs a commit against your working copy or index" = "◇ Working tree / ◇ Staged 行もコミットと同様に (m で) ◉ 比較選択へ追加可能 — Compare selection でコミットとワーキングコピーまたはインデックスを差分表示"
"highlight search: keep all commits visible, dim non-matches (graph stays); ctrl+↑/↓ jump prev/next match; enter keeps, esc clears" = "ハイライト検索: 全コミットを表示したまま、非マッチを暗く表示 (グラフは維持); ctrl+↑/↓ で前後のマッチへジャンプ; enter で確定、esc で解除"
"Commits: eager search — page unloaded history for the next match of the active / filter or @ highlight query and jump to it; every press digs past the already-loaded commits and re-asks before scanning deeper" = "Commits: 積極検索 — アクティブな / フィルタや @ ハイライトのクエリの次の一致を未読み込みの履歴からページングして探し、そこへジャンプ。押すたびに読み込み済みコミットの先を掘り進み、さらに深くスキャンする前に再確認"
"Commits: load the next batch of commits now (without scrolling to the end)" = "Commits: 次のコミットバッチを今すぐ読み込む (末尾までスクロールせずに)"
"jump to the top / bottom of the focused list; End on Commits also loads the next batch" = "フォーカス中リストの先頭 / 末尾へジャンプ; Commits での End は次のバッチも読み込む"
"filter commits by path / author / message / date (popup; empty fields clear that axis, ctrl+r clears all fields); graph hides while filtered" = "コミットをパス / 作者 / メッセージ / 日付でフィルタ (ポップアップ; 空欄はその軸を解除、ctrl+r で全欄クリア); フィルタ中はグラフ非表示"
"add / remove the selected commit (or ◇ Working tree / ◇ Staged row) to the ◉ compare selection; the . menu then drives Compare selection or Squash" = "選択中コミット (または ◇ Working tree / ◇ Staged 行) を ◉ 比較選択に追加 / 削除; その後 . メニューから Compare selection や Squash を実行"
"mark / unmark the selected commit for compare — the same ◉ set as m but capped at two: the second space-mark opens the comparison immediately (with 2 already marked, space a marked one to unmark first; esc clears ALL marks, or . → Unmark all commits). Re-opening the comparison already on screen keeps it (no reload)" = "選択中コミットを比較用にマーク / 解除 — m と同じ ◉ セットだが上限 2: 2 つ目の space マークで即座に比較を開く (2 つマーク済みのときは、マーク済みのものを space で先に解除; esc で全マーク解除、または . → Unmark all commits)。すでに画面上にある比較を再度開いてもそのまま (再読み込みなし)"
"view message / open message in editor / rename commit / copy commit id / Create branch here / Create worktree here / Cherry-pick here / Revert this commit / Reset to this commit (soft|mixed|hard) / Compare against working tree / Compare against staged / Export commit as patch / Add to compare selection (space) / Unmark commit / Unmark all commits / Compare selection / Squash N commits / Drop N selected commits / Show all branches when soloed / Show as list|graph (.-menu)" = "メッセージ表示 / エディタでメッセージを開く / コミット名変更 / コミット ID コピー / Create branch here / Create worktree here / Cherry-pick here / Revert this commit / Reset to this commit (soft|mixed|hard) / Compare against working tree / Compare against staged / Export commit as patch / Add to compare selection (space) / Unmark commit / Unmark all commits / Compare selection / Squash N commits / Drop N selected commits / Show all branches when soloed / Show as list|graph (.-メニュー)"
"Compare against working tree / Compare against staged (.-menu): open the files view as a whole-tree diff of this commit vs your working copy / the index; enter on a file diffs that path" = "Compare against working tree / Compare against staged (.-メニュー): このコミットとワーキングコピー / インデックスのツリー全体差分としてファイルビューを開く; ファイル上の enter でそのパスを差分表示"
"grow the ◉ compare selection (a contiguous run of commits)" = "◉ 比較選択を拡大 (連続するコミットの並び)"
"Compare selection (.-menu): toggle commits into the ◉ set (m / Add to compare selection / shift+↑↓), then Compare selection — 2 = the diff between them, 3+ = the combined diff of the range (oldest^..newest, refused from a root commit); Unmark all commits (N) empties it" = "Compare selection (.-メニュー): コミットを ◉ セットにトグル (m / Add to compare selection / shift+↑↓) してから Compare selection — 2 つ = 両者間の差分、3 つ以上 = 範囲の結合差分 (oldest^..newest、ルートコミットからは拒否); Unmark all commits (N) で空にする"
"Squash N commits (.-menu): with 2+ commits in the ◉ set, combine the selected commits into one (messages concatenated; reword afterward). When they aren't adjacent, a prompt offers Reorder & squash — the skipped in-between commits move to just after the squash. Off-branch selections are refused; conflicts pause for `git rebase --continue`" = "Squash N commits (.-メニュー): ◉ セットに 2 つ以上のコミットがあるとき、選択したコミットを 1 つに統合 (メッセージは連結; 後で reword)。隣接していない場合は Reorder & squash を提案 — 間のスキップされたコミットは squash 直後へ移動。ブランチ外の選択は拒否; 競合は `git rebase --continue` のため一時停止"
"Drop N selected commits (.-menu): with 2+ commits in the ◉ set, delete them all in one interactive rebase (no adjacency needed; gaps stay). Off-branch / working-tree-or-staged selections are refused; conflicts pause for `git rebase --continue`. Drop commit (no set) drops just the cursor commit" = "Drop N selected commits (.-メニュー): ◉ セットに 2 つ以上のコミットがあるとき、1 回の対話的リベースで全部削除 (隣接不要; 間は残る)。ブランチ外 / ワーキングツリー・ステージの選択は拒否; 競合は `git rebase --continue` のため一時停止。Drop commit (セットなし) はカーソル位置のコミットだけを削除"
"on a commit that is a branch's tip: Rename branch <name> / Delete branch <name> (.-menu) — one pair per local tip; delete is hidden for a checked-out branch" = "ブランチ先端のコミットで: Rename branch <name> / Delete branch <name> (.-メニュー) — ローカル先端ごとに 1 組; チェックアウト中のブランチでは delete 非表示"
"on a non-merge commit of the current branch: Move commit up (newer) / Move commit down (older) / Drop commit (.-menu) — one-step interactive rebase; conflicts pause for `git rebase --continue`" = "現在ブランチの非マージコミットで: Move commit up (newer) / Move commit down (older) / Drop commit (.-メニュー) — 1 ステップの対話的リベース; 競合は `git rebase --continue` のため一時停止"
"Show as list / Show as graph (.-menu): flat ●-gutter list vs the lane graph; lane color marks each commit's line of development" = "Show as list / Show as graph (.-メニュー): フラットな ● ガター一覧 vs レーングラフ; レーン色は各コミットの系統を示す"
"narrow / widen the commit graph window (in lanes); a ⋯ marks lanes beyond each edge" = "コミットグラフウィンドウを狭める / 広げる (レーン単位); ⋯ は各端の先にあるレーンを示す"
"pan the commit graph window left / right" = "コミットグラフウィンドウを左 / 右にパン"
"snap the commit graph window to the selected commit's node" = "コミットグラフウィンドウを選択中コミットのノードにスナップ"
"more commits load automatically as you near the end" = "末尾に近づくと自動でさらにコミットを読み込みます"
"Filter mode (/)" = "フィルタモード (/)"
"move the selection through the filtered rows" = "フィルタ結果の行の中で選択を移動"
"keep the filter and leave input mode" = "フィルタを保持して入力モードを抜ける"
"cancel the filter" = "フィルタをキャンセル"
"delete; any typed text narrows the list" = "削除; 入力した文字でリストを絞り込み"
"Worktree popup (w/W)" = "ワークツリーポップアップ (w/W)"
"next input field / confirm" = "次の入力フィールド / 確定"
"edit the previewed branch name (new-branch mode)" = "プレビュー中のブランチ名を編集 (新規ブランチモード)"
"create the worktree" = "ワークツリーを作成"
"create the worktree and switch to it" = "ワークツリーを作成して切り替え"
"cancel" = "キャンセル"
"Branch popup (b/B)" = "ブランチポップアップ (b/B)"
"create the branch" = "ブランチを作成"
"Commit popup (c/C)" = "コミットポップアップ (c/C)"
"switch field (title / description)" = "フィールドを切り替え (タイトル / 説明)"
"title: move to the description field; description: insert a newline" = "タイトル: 説明フィールドへ移動; 説明: 改行を挿入"
