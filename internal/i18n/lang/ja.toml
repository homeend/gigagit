"Global" = "グローバル"
"pull (SmartPull: autostash, ff/rebase decisions). On the Branches panel, a non-current branch pulls in the background (stay here): ff its ref, pull in its worktree, or stash→switch→pull→switch-back. Slow ops confirm first (y/n; disable with [ui] disable_slow_op_confirm)." = "プル (SmartPull: 自動スタッシュ、ff/リベースの判断)。Branches パネルでは、現在以外のブランチはバックグラウンドでプルします (ここに留まる): 参照の ff、そのワークツリー内でのプル、または stash→切替→プル→戻す。遅い操作は最初に確認します (y/n; [ui] disable_slow_op_confirm で無効化)。"
