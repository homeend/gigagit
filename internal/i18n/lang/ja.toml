"open the stash window (list all stashes)" = "スタッシュウィンドウを開く (すべてのスタッシュを一覧)"
"undo the last commit (soft, ref-only)" = "最後のコミットを取り消し (soft、参照のみ)"
"bookmark quick-switcher: jump to / compare / paste a bookmarked file (the . menu on any file offers Bookmark this file and Compare against bookmark — pick a bookmark, then diff the focused file against it). In it (navigation-first): ↑↓/jk move, enter jumps (diffs the bookmark vs the working-tree file), e opens the bookmarked file in your external editor (read-only), p pastes to a typed path, t copies to a new dir under <repo>.tmp (works for file AND commit bookmarks), y copies the file's path, absolute path, or name to the clipboard, m marks one then a second to compare, c compares the highlighted bookmark against a shelf entry, x removes (confirms), / filters, ? shows the key list, esc closes" = "ブックマーク・クイックスイッチャー: ブックマークしたファイルへのジャンプ / 比較 / 貼り付け (任意のファイルの . メニューに Bookmark this file と Compare against bookmark があります — ブックマークを選ぶと、フォーカス中のファイルとの差分を表示)。スイッチャー内 (ナビゲーション優先): ↑↓/jk 移動、enter でジャンプ (ブックマークとワーキングツリーのファイルを差分表示)、e でブックマークしたファイルを外部エディタで開く (読み取り専用)、p で入力したパスへ貼り付け、t で <repo>.tmp 配下の新しいディレクトリへコピー (ファイルとコミットのブックマーク両方で有効)、y でファイルのパス・絶対パス・名前をクリップボードへコピー、m で 1 つ目をマークし 2 つ目で比較、c でハイライト中のブックマークをシェルフのエントリと比較、x で削除 (確認あり)、/ でフィルタ、? でキー一覧、esc で閉じる"
"shelf quick-switcher: the . menu on any file also offers Compare against shelf. In it (navigation-first): ↑↓/jk move, enter diffs a file entry vs the working-tree file — on a shelved COMMIT it opens the files view with the frozen files (enter diffs each vs the working tree; the . menu's Copy to working dir restores one), e opens the shelved copy in your external editor (read-only), p restores to a path (prefilled with the original path; ctrl+r re-fills it), t copies to a new dir under <repo>.tmp, y copies the file's path, absolute path, or name to the clipboard, m marks one then a second to compare two entries, c compares the highlighted entry against a bookmark, x removes (confirms), / filters, ? shows the key list, esc closes" = "シェルフ・クイックスイッチャー: 任意のファイルの . メニューには Compare against shelf もあります。スイッチャー内 (ナビゲーション優先): ↑↓/jk 移動、enter でファイルエントリとワーキングツリーのファイルを差分表示 — シェルフされたコミットでは凍結されたファイル一覧でファイルビューを開きます (enter で各ファイルをワーキングツリーと差分表示; . メニューの Copy to working dir で 1 つ復元)、e でシェルフのコピーを外部エディタで開く (読み取り専用)、p でパスへ復元 (元のパスがプリセット; ctrl+r で再セット)、t で <repo>.tmp 配下の新しいディレクトリへコピー、y でファイルのパス・絶対パス・名前をクリップボードへコピー、m で 1 つ目をマークし 2 つ目で 2 エントリを比較、c でハイライト中のエントリをブックマークと比較、x で削除 (確認あり)、/ でフィルタ、? でキー一覧、esc で閉じる"
"notification center: health recommendations for this repo (e.g. write a commit-graph on a big repo — makes commit browsing ~10× faster). ↑↓ select, enter shows a notice's actions, esc closes. 'Not now' asks again next load; 'Never for this repo' is remembered in prompts.toml" = "通知センター: このリポジトリの健全性に関する推奨 (例: 大きなリポジトリでの commit-graph の作成 — コミット閲覧が約 10× 速くなります)。↑↓ で選択、enter で通知のアクションを表示、esc で閉じる。'Not now' は次回ロード時に再度尋ね、'Never for this repo' は prompts.toml に記憶されます"
"fuzzy file finder: opens a picker over every tracked file; press / then type a query (fvgo → files_view.go) to filter by path, ↑↓/pgup/pgdn to move, enter to open a per-file menu (View content, Diff HEAD↔working tree, History, Blame, Open in editor, Copy path, Copy absolute path), esc closes" = "ファジーファイル検索: 追跡中の全ファイルのピッカーを開きます; / を押してクエリを入力 (fvgo → files_view.go) するとパスで絞り込み、↑↓/pgup/pgdn で移動、enter でファイル別メニューを開く (内容表示、HEAD↔ワーキングツリーの差分、履歴、blame、エディタで開く、パスをコピー、絶対パスをコピー)、esc で閉じる"
