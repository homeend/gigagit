# --- help overlay (Task 10) ---
"Global" = "グローバル"
"pull (SmartPull: autostash, ff/rebase decisions). On the Branches panel, a non-current branch pulls in the background (stay here): ff its ref, pull in its worktree, or stash→switch→pull→switch-back. Slow ops confirm first (y/n; disable with [ui] disable_slow_op_confirm)." = "プル (SmartPull: 自動スタッシュ、ff/リベースの判断)。Branches パネルでは、現在以外のブランチはバックグラウンドでプルします (ここに留まる): 参照の ff、そのワークツリー内でのプル、または stash→切替→プル→戻す。遅い操作は最初に確認します (y/n; [ui] disable_slow_op_confirm で無効化)。"
"push the current branch (sets upstream)" = "現在のブランチをプッシュ (upstream を設定)"
"Push <branch> (.-menu on the Branches panel): push the highlighted branch (sets upstream) — works for any local branch, current or not, including one never pushed before; no checkout needed" = "Push <branch> (Branches パネルの .-メニュー): 選択中のブランチをプッシュ (upstream を設定) — 現在のブランチかどうかに関係なく、未プッシュのブランチを含む任意のローカルブランチで使えます; チェックアウトは不要"
"Force push <branch> (.-menu on the Branches panel, current branch): force-push the current branch — a modal offers force-with-lease (refuses if the remote moved under you) or force (overwrites the remote unconditionally); esc aborts" = "Force push <branch> (Branches パネルの .-メニュー、現在のブランチ): 現在のブランチを強制プッシュ — モーダルで force-with-lease (リモートが動いていたら拒否) か force (無条件でリモートを上書き) を選択; esc で中止"
"switch to the selected branch (SmartSwitch); if it's in another worktree, offers to jump there. Confirms first (y/n)." = "選択したブランチに切り替え (SmartSwitch); 別のワークツリーにある場合はそこへ移動するか確認します。最初に確認します (y/n)。"
"open the stash window (list all stashes)" = "スタッシュウィンドウを開く (すべてのスタッシュを一覧)"
"undo the last commit (soft, ref-only)" = "最後のコミットを取り消し (soft、参照のみ)"
"bookmark quick-switcher: jump to / compare / paste a bookmarked file (the . menu on any file offers Bookmark this file and Compare against bookmark — pick a bookmark, then diff the focused file against it). In it (navigation-first): ↑↓/jk move, enter jumps (diffs the bookmark vs the working-tree file), e opens the bookmarked file in your external editor (read-only), p pastes to a typed path, t copies to a new dir under <repo>.tmp (works for file AND commit bookmarks), y copies the file's path, absolute path, or name to the clipboard, m marks one then a second to compare, c compares the highlighted bookmark against a shelf entry, x removes (confirms), / filters, ? shows the key list, esc closes" = "ブックマーク・クイックスイッチャー: ブックマークしたファイルへのジャンプ / 比較 / 貼り付け (任意のファイルの . メニューに Bookmark this file と Compare against bookmark があります — ブックマークを選ぶと、フォーカス中のファイルとの差分を表示)。スイッチャー内 (ナビゲーション優先): ↑↓/jk 移動、enter でジャンプ (ブックマークとワーキングツリーのファイルを差分表示)、e でブックマークしたファイルを外部エディタで開く (読み取り専用)、p で入力したパスへ貼り付け、t で <repo>.tmp 配下の新しいディレクトリへコピー (ファイルとコミットのブックマーク両方で有効)、y でファイルのパス・絶対パス・名前をクリップボードへコピー、m で 1 つ目をマークし 2 つ目で比較、c でハイライト中のブックマークをシェルフのエントリと比較、x で削除 (確認あり)、/ でフィルタ、? でキー一覧、esc で閉じる"
"shelf quick-switcher: the . menu on any file also offers Compare against shelf. In it (navigation-first): ↑↓/jk move, enter diffs a file entry vs the working-tree file — on a shelved COMMIT it opens the files view with the frozen files (enter diffs each vs the working tree; the . menu's Copy to working dir restores one), e opens the shelved copy in your external editor (read-only), p restores to a path (prefilled with the original path; ctrl+r re-fills it), t copies to a new dir under <repo>.tmp, y copies the file's path, absolute path, or name to the clipboard, m marks one then a second to compare two entries, c compares the highlighted entry against a bookmark, x removes (confirms), / filters, ? shows the key list, esc closes" = "シェルフ・クイックスイッチャー: 任意のファイルの . メニューには Compare against shelf もあります。スイッチャー内 (ナビゲーション優先): ↑↓/jk 移動、enter でファイルエントリとワーキングツリーのファイルを差分表示 — シェルフされたコミットでは凍結されたファイル一覧でファイルビューを開きます (enter で各ファイルをワーキングツリーと差分表示; . メニューの Copy to working dir で 1 つ復元)、e でシェルフのコピーを外部エディタで開く (読み取り専用)、p でパスへ復元 (元のパスがプリセット; ctrl+r で再セット)、t で <repo>.tmp 配下の新しいディレクトリへコピー、y でファイルのパス・絶対パス・名前をクリップボードへコピー、m で 1 つ目をマークし 2 つ目で 2 エントリを比較、c でハイライト中のエントリをブックマークと比較、x で削除 (確認あり)、/ でフィルタ、? でキー一覧、esc で閉じる"
"notification center: health recommendations for this repo (e.g. write a commit-graph on a big repo — makes commit browsing ~10× faster). ↑↓ select, enter shows a notice's actions, esc closes. 'Not now' asks again next load; 'Never for this repo' is remembered in prompts.toml" = "通知センター: このリポジトリの健全性に関する推奨 (例: 大きなリポジトリでの commit-graph の作成 — コミット閲覧が約 10× 速くなります)。↑↓ で選択、enter で通知のアクションを表示、esc で閉じる。'Not now' は次回ロード時に再度尋ね、'Never for this repo' は prompts.toml に記憶されます"
"fuzzy file finder: opens a picker over every tracked file; press / then type a query (fvgo → files_view.go) to filter by path, ↑↓/pgup/pgdn to move, enter to open a per-file menu (View content, Diff HEAD↔working tree, History, Blame, Open in editor, Copy path, Copy absolute path), esc closes" = "ファジーファイル検索: 追跡中の全ファイルのピッカーを開きます; / を押してクエリを入力 (fvgo → files_view.go) するとパスで絞り込み、↑↓/pgup/pgdn で移動、enter でファイル別メニューを開く (内容表示、HEAD↔ワーキングツリーの差分、履歴、blame、エディタで開く、パスをコピー、絶対パスをコピー)、esc で閉じる"
"worktree popup for the selected existing branch" = "選択中の既存ブランチのワークツリーポップアップ"
"worktree popup on a new templated branch. In the popup, p picks a saved branch prefix (Settings → Branch prefixes), fills any <user:…> labels, and seeds the editable name" = "新しいテンプレートブランチでのワークツリーポップアップ。ポップアップ内で p は保存済みブランチ接頭辞 (設定 → ブランチ接頭辞) を選び、<user:…> ラベルを埋めて、編集可能な名前の初期値にします"
"mark a row; m on a second row opens the pair-op picker (merge / rebase / interactive rebase / compare branches)" = "行をマーク; 2 行目で m を押すとペア操作ピッカー (マージ / リベース / 対話的リベース / ブランチ比較) が開きます"
"repo switcher popup (navigation-first: ↑↓/jk/pgup/pgdn move, / filters, enter switches — while filtering, the first enter locks the filter)" = "リポジトリスイッチャーポップアップ (ナビゲーション優先: ↑↓/jk/pgup/pgdn 移動、/ でフィルタ、enter で切替 — フィルタ入力中は最初の enter がフィルタを確定)"
"settings" = "設定"
"action menu — context actions for the selected row and panel (incl. copy actions)" = "アクションメニュー — 選択中の行とパネルに応じたコンテキストアクション (コピー操作を含む)"
"command palette — generic command launcher, opens over the panels OR any browse window (files tree, diff, history, blame, review, stash) (↑↓/jk move, enter runs, esc closes); includes Apply patch, File blame, File history, Find, Git config explorer, Open repo, Open shell, Run shell command, Set up agent skills, Show commit" = "コマンドパレット — 汎用コマンドランチャー。パネルの上にも、任意のブラウズウィンドウ (ファイルツリー、差分、履歴、blame、レビュー、スタッシュ) の上にも開きます (↑↓/jk 移動、enter 実行、esc 閉じる); Apply patch、File blame、File history、Find、Git config explorer、Open repo、Open shell、Run shell command、Set up agent skills、Show commit を含みます"
"show commit by SHA: type a commit-ish (SHA / ref); enter resolves it and opens that commit's files in the files-view" = "SHA でコミットを表示: コミット指定 (SHA / 参照) を入力; enter で解決し、そのコミットのファイルをファイルビューで開きます"
"Compare against working dir / Copy to working dir (.-menu): on any focused stash/commit/staged file, diffs that version against the same path in the working tree (Compare) or writes it into the working tree at its own path (Copy)" = "Compare against working dir / Copy to working dir (.-メニュー): フォーカス中の任意のスタッシュ/コミット/ステージ済みファイルで、そのバージョンをワーキングツリーの同じパスと差分表示 (Compare)、またはワーキングツリーの同じパスへ書き込み (Copy)"
"cycle the focused panel's sort order" = "フォーカス中パネルの並び順を切り替え"
"cycle the focused window's text display (cutoff / wrap / scroll)" = "フォーカス中ウィンドウのテキスト表示を切り替え (切り詰め / 折り返し / スクロール)"
"maximize the focused left-column panel to fill the whole left column (t again restores); while maximized, ctrl+←/→ still cycles that slot's tabs" = "フォーカス中の左カラムパネルを左カラム全体に最大化 (もう一度 t で復元); 最大化中も ctrl+←/→ でそのスロットのタブを切り替え可能"
"fullscreen whatever is focused — any panel OR any open popup — to a near-fullscreen box (ctrl+t or esc restores; on a panel, t drops back to the left column)" = "フォーカス中のもの — 任意のパネルまたは開いているポップアップ — をほぼ全画面のボックスにフルスクリーン化 (ctrl+t か esc で復元; パネルでは t で左カラムに戻る)"
"open a shell in the repo worktree (emergency hatch — works over ANY window, incl. a failed conflict resolve; 'exit' returns to gg and reloads)" = "リポジトリのワークツリーでシェルを開く (緊急ハッチ — 失敗したコンフリクト解決を含む、どのウィンドウの上でも動作; 'exit' で gg に戻り再読み込み)"
"scroll display mode: pan the focused window horizontally" = "スクロール表示モード: フォーカス中ウィンドウを水平方向にパン"
"filter the focused panel" = "フォーカス中のパネルをフィルタ"
"clear the focused window's filtering — its / filter, or on the Commits panel the @ highlight and the \\ commit filter (other windows' filters are left untouched)" = "フォーカス中ウィンドウのフィルタを解除 — その / フィルタ、Commits パネルでは @ ハイライトと \\ コミットフィルタも (他のウィンドウのフィルタはそのまま)"
"recall previous searches (history dropdown) while typing in the / filter, @ highlight, or the bookmark/shelf/files-tree search" = "/ フィルタ、@ ハイライト、ブックマーク/シェルフ/ファイルツリー検索の入力中に過去の検索を呼び出す (履歴ドロップダウン)"
"cycle panel focus forward / backward" = "パネルフォーカスを前後に切り替え"
"focus the left column / the Commits panel" = "左カラム / Commits パネルにフォーカス"
"cycle the focused tab slot: top (Branches / Remotes / Worktrees), middle (Files / Tags), or bottom (Staged / Reflog)" = "フォーカス中のタブスロットを切り替え: 上 (Branches / Remotes / Worktrees)、中 (Files / Tags)、下 (Staged / Reflog)"
"focus the window under the cursor and select the clicked row" = "カーソル下のウィンドウにフォーカスし、クリックした行を選択"
"scroll the list under the cursor ([ui] wheel_step rows; files view: tree or commits)" = "カーソル下のリストをスクロール ([ui] wheel_step 行; ファイルビュー: ツリーまたはコミット)"
"move the selection" = "選択を移動"
"page the selection (a quarter of the viewport)" = "選択をページ単位で移動 (ビューポートの4分の1)"
"clear the mark, then the active filter" = "マークを解除し、次にアクティブなフィルタを解除"
"commit the staged index (title + description popup)" = "ステージ済みインデックスをコミット (タイトル + 説明のポップアップ)"
"amend the last commit (edit message / fold in staged changes)" = "最後のコミットを修正 (メッセージ編集 / ステージ済み変更の取り込み)"
"reload all panels (keeps them visible while refreshing)" = "全パネルを再読み込み (更新中も表示を維持)"
"this help window" = "このヘルプウィンドウ"
"quit" = "終了"
"Branches panel" = "Branches パネル"
"create a branch off the selected one (popup). In the popup, ctrl+p picks a saved branch prefix (Settings → Branch prefixes) and seeds the name" = "選択中のブランチからブランチを作成 (ポップアップ)。ポップアップ内で ctrl+p は保存済みブランチ接頭辞 (設定 → ブランチ接頭辞) を選んで名前の初期値にします"
"create a branch and switch to it" = "ブランチを作成して切り替え"
"delete the selected branch" = "選択中のブランチを削除"
"on a non-current branch: pull it in the background (stay on your branch) — same as the .-menu 'Pull <branch> (stay here)'" = "現在以外のブランチで: バックグラウンドでプル (自分のブランチに留まる) — .-メニューの 'Pull <branch> (stay here)' と同じ"
"go to the selected branch's tip in the Commits panel — jumps if the tip is loaded, otherwise deep-searches history for it (the ctrl+f machinery: clears the / filter, pages with a budget, asks before scanning deeper)" = "選択中ブランチの先端へ Commits パネルで移動 — 先端が読み込み済みならジャンプ、そうでなければ履歴を深く検索します (ctrl+f の仕組み: / フィルタを解除し、予算内でページングし、さらに深くスキャンする前に確認)"
"Solo the selected branch AND go to its tip: scopes the Commits feed to the branch (press again to un-solo) and lands the cursor on the tip once the reload finishes" = "選択中のブランチを Solo にして先端へ移動: Commits フィードをそのブランチに限定し (もう一度押すと解除)、再読み込み完了後にカーソルを先端に置きます"
"rename branch / copy branch name / Pull <branch> (stay here) / Solo this branch / Add to commit view / Go to tip in commits (.-menu)" = "ブランチ名変更 / ブランチ名コピー / Pull <branch> (stay here) / Solo this branch / Add to commit view / Go to tip in commits (.-メニュー)"
"Solo this branch (.-menu): scope the Commits panel to this branch (re-run to un-solo); Add/Remove from commit view builds a multi-branch set; Show all branches clears it; Go to tip in commits jumps the Commits cursor to this branch's tip (enter does the same; both deep-search unloaded history when needed)" = "Solo this branch (.-メニュー): Commits パネルをこのブランチに限定 (再実行で解除); Add/Remove from commit view は複数ブランチセットを構成; Show all branches で解除; Go to tip in commits は Commits カーソルをこのブランチの先端へ移動 (enter も同じ; どちらも必要なら未読み込みの履歴を深く検索)"
"Remotes panel" = "Remotes パネル"
"checkout: create or fast-forward a local tracking branch (stay on the current branch); on the current branch's own remote it prompts instead: pull now (when behind) / check out under a different name" = "チェックアウト: ローカル追跡ブランチを作成または早送り (現在のブランチに留まる); 現在のブランチ自身のリモートでは代わりに確認します: 今すぐプル (遅れている場合) / 別名でチェックアウト"
"checkout and switch to it — fast-forward-safe; a diverged local branch offers check-out-as-a-different-name" = "チェックアウトして切り替え — 早送り安全; 分岐したローカルブランチには別名でのチェックアウトを提案"
"Check out <remote> as… / Switch to <remote> as… (.-menu): materialize the remote branch under a local name you choose" = "Check out <remote> as… / Switch to <remote> as… (.-メニュー): リモートブランチを自分で選んだローカル名で作成"
"fetch all remotes (updates tracking refs and the behind-counts)" = "全リモートをフェッチ (追跡参照と behind カウントを更新)"
"Prune (.-menu): drop tracking refs for branches deleted upstream" = "Prune (.-メニュー): 上流で削除されたブランチの追跡参照を削除"
"copy remote branch name (.-menu)" = "リモートブランチ名をコピー (.-メニュー)"
"Worktrees panel" = "Worktrees パネル"
"switch into the selected worktree" = "選択中のワークツリーへ切り替え"
"remove the selected worktree" = "選択中のワークツリーを削除"
"Tags panel" = "Tags パネル"
"a tab in the middle (Files) box — ctrl+←/→ switches Files ⇄ Tags; ● annotated, ○ lightweight; ▲ marks tags that exist on the default remote (origin or first remote) — local-only or not-yet-checked tags show no marker (deliberately indistinguishable before a lookup runs)" = "中段 (Files) ボックスのタブ — ctrl+←/→ で Files ⇄ Tags を切替; ● 注釈付き、○ 軽量; ▲ はデフォルトリモート (origin または最初のリモート) に存在するタグ — ローカルのみ、または未確認のタグにはマーカーなし (確認前は意図的に区別されません)"
"jump the Commits cursor to the tag's target commit" = "Commits カーソルをタグの対象コミットへ移動"
"Check out tag (.-menu): detached HEAD, a new branch at the tag, or a new worktree (branch + dir prefilled from the tag name)" = "Check out tag (.-メニュー): detached HEAD、タグ位置の新ブランチ、または新ワークツリー (ブランチとディレクトリはタグ名からプリセット)"
"Push tag (.-menu): push the tag to a remote (auto when only one, else pick)" = "Push tag (.-メニュー): タグをリモートへプッシュ (1 つだけなら自動、それ以外は選択)"
"Delete tag (.-menu): delete the selected tag after a confirm" = "Delete tag (.-メニュー): 確認後に選択中のタグを削除"
"Refresh remote status (.-menu): one-shot git ls-remote --tags; updates the ▲ marker for every visible tag; errors shown on the status line; for background auto-refresh see [refresh] remote_tags" = "Refresh remote status (.-メニュー): 一回きりの git ls-remote --tags; 表示中の全タグの ▲ マーカーを更新; エラーはステータス行に表示; バックグラウンド自動更新は [refresh] remote_tags を参照"
"Shelf panel" = "Shelf パネル"
"frozen, non-git per-file copies (the default bucket); add via the . menu anywhere a file is focused" = "凍結された、git 外のファイル単位コピー (デフォルトバケット); ファイルがフォーカスされている場所ならどこでも . メニューから追加"
"diff the shelved copy against the current working-tree file" = "シェルフのコピーを現在のワーキングツリーのファイルと差分表示"
"mark an entry; mark a second to compare the two shelved copies side-by-side" = "エントリをマーク; 2 つ目をマークするとシェルフの 2 コピーをサイドバイサイドで比較"
"Restore to… (writes the copy to a path; prefilled with the original path, ctrl+r re-fills it) / Remove from shelf" = "Restore to… (コピーをパスへ書き込み; 元のパスがプリセット、ctrl+r で再セット) / Remove from shelf"
"Reflog panel" = "Reflog パネル"
"a tab in the bottom-left (Staged) box — ctrl+←/→ switches Staged ⇄ Reflog; lists the HEAD reflog (read-only), newest first" = "左下 (Staged) ボックスのタブ — ctrl+←/→ で Staged ⇄ Reflog を切替; HEAD の reflog を一覧 (読み取り専用)、新しい順"
"open the entry's commit in the files view (changed files vs parent; even for dangling commits)" = "エントリのコミットをファイルビューで開く (親との変更ファイル; dangling コミットでも可)"
"Copy SHA / Bookmark this commit / Shelf this commit (name it) (compare via the g switcher)" = "Copy SHA / Bookmark this commit / Shelf this commit (名前を付ける) (比較は g スイッチャーから)"
"Reset to this entry (.-menu): move the current branch here (soft/mixed/hard) / Check out this entry (detached or as a new branch you switch to)" = "Reset to this entry (.-メニュー): 現在のブランチをここへ移動 (soft/mixed/hard) / Check out this entry (detached、または切り替える新ブランチとして)"
"Files panel" = "Files パネル"
"stage the marked files (or the cursor row) — git add" = "マークしたファイル (またはカーソル行) をステージ — git add"
"stage hunks: open the region/line staging picker" = "ハンクをステージ: 領域/行単位のステージングピッカーを開く"
"stash changes: popup to name + pick files (ctrl+s confirms)" = "変更をスタッシュ: 名前を付けてファイルを選ぶポップアップ (ctrl+s で確定)"
"mark / unmark a file (multi-select for staging, stashing, discarding)" = "ファイルのマーク / 解除 (ステージ・スタッシュ・破棄のための複数選択)"
"side-by-side diff of the unstaged change (index → working tree)" = "未ステージ変更のサイドバイサイド差分 (インデックス → ワーキングツリー)"
"file history: commits that touched it (left) + per-commit diff (right)" = "ファイル履歴: そのファイルに触れたコミット (左) + コミット別差分 (右)"
"blame: who last changed each line, grouped by commit" = "blame: 各行を最後に変更した人を、コミット単位でグループ表示"
"discard the marked files (or the cursor row): revert edits, delete new files (confirm)" = "マークしたファイル (またはカーソル行) を破棄: 編集を元に戻し、新規ファイルを削除 (確認あり)"
"discard ALL unstaged changes: revert every edit + delete every new file (confirm)" = "すべての未ステージ変更を破棄: 全編集を元に戻し、全新規ファイルを削除 (確認あり)"
"on an untracked file: Add to .gitignore (this file, anchored) / Add extension to .gitignore (*.ext) — appends to the repo-root .gitignore" = "未追跡ファイルで: Add to .gitignore (このファイル、アンカー付き) / Add extension to .gitignore (*.ext) — リポジトリ直下の .gitignore に追記"
"Edit in editor: open the selected file in $VISUAL/$EDITOR (vi/notepad fallback), then refresh" = "Edit in editor: 選択中のファイルを $VISUAL/$EDITOR (vi/notepad フォールバック) で開き、その後更新"
"Staged panel" = "Staged パネル"
"unstage the marked files (or the cursor row) — git restore --staged" = "マークしたファイル (またはカーソル行) のステージを解除 — git restore --staged"
"side-by-side diff of the staged change (HEAD → index)" = "ステージ済み変更のサイドバイサイド差分 (HEAD → インデックス)"
"Open staged version in external editor: open the index blob (the staged copy, distinct from the working file) in $VISUAL/$EDITOR, read-only" = "Open staged version in external editor: インデックスの blob (ステージ済みコピー、ワーキングファイルとは別物) を $VISUAL/$EDITOR で開く、読み取り専用"
"mark / unmark a file; h history, b blame (as in Files)" = "ファイルのマーク / 解除; h 履歴、b blame (Files と同様)"
"Conflict resolution process (x)" = "コンフリクト解決プロセス (x)"
"enter / resume the conflict process (repo conflicted, or a merge/rebase paused after external resolution)" = "コンフリクトプロセスに入る / 再開 (リポジトリがコンフリクト中、または外部解決後に一時停止したマージ/リベース)"
"move between conflicted files" = "コンフリクトしたファイル間を移動"
"pick hunks: open the line editor (both-modified files)" = "ハンクを選ぶ: 行エディタを開く (両側変更ファイル)"
"keep current / incoming (both-modified files)" = "current / incoming を採用 (両側変更ファイル)"
"keep modified / delete / keep base (modify-delete files)" = "変更を採用 / 削除 / base を採用 (変更-削除ファイル)"
"mark resolved (after editing by hand)" = "解決済みにする (手動編集後)"
"mark all resolved" = "すべて解決済みにする"
"run external tool (Claude/Junie/Meld…) configured for conflict resolution — Settings (,) → External tools" = "コンフリクト解決用に設定した外部ツール (Claude/Junie/Meld…) を実行 — 設定 (,) → 外部ツール"
"continue / abort the merge or rebase (once resolved)" = "マージまたはリベースを続行 / 中止 (解決後)"
"cycle text display: cutoff / wrap / scroll" = "テキスト表示を切り替え: 切り詰め / 折り返し / スクロール"
"leave the process (resume later with x); esc in a running step cancels it" = "プロセスを離れる (x で後で再開); 実行中のステップでの esc はそれをキャンセル"
"Hunk picker (x conflict resolve / H stage)" = "ハンクピッカー (x コンフリクト解決 / H ステージ)"
"switch the focused side (current ↔ incoming)" = "フォーカスする側を切り替え (current ↔ incoming)"
"move the line cursor (steps across regions)" = "行カーソルを移動 (領域をまたいで進む)"
"pick the cursor line (builds the result in pick order)" = "カーソル行を選択 (選択順に結果を構築)"
"take the whole region from current / incoming" = "領域全体を current / incoming から取得"
"take all regions from current / incoming" = "全領域を current / incoming から取得"
"jump to the next / previous region" = "次 / 前の領域へジャンプ"
"apply when every region is resolved" = "全領域が解決したら適用"
"cancel (close without resolving)" = "キャンセル (解決せずに閉じる)"
"Commits panel" = "Commits パネル"
"shows commits from ALL local branches by default, in date order, with a single-line commit graph (natural order only; hidden while filtering/sorting); header shows the mode — Commits (all) / Commits (solo: <branch>)" = "デフォルトではすべてのローカルブランチのコミットを日付順で、単一行のコミットグラフ付きで表示 (自然順のみ; フィルタ/ソート中は非表示); ヘッダーにモード表示 — Commits (all) / Commits (solo: <branch>)"
"the left column is the branch the commit is on: BRIGHT *current/branch on that branch's tip, grayed otherwise; long names trim with … (select to reveal the full name); the commit id shows in the status bar. Filtering still matches the full id and full branch name" = "左カラムはコミットの属するブランチ: そのブランチの先端では明るい *current/branch、それ以外はグレー; 長い名前は … で切り詰め (選択で全名を表示); コミット ID はステータスバーに表示。フィルタは完全な ID と完全なブランチ名にもマッチします"
"in the Commits graph, ↓ marks a local branch's tip and ↑ the tip of its tracked remote (both together = local and remote in sync)" = "Commits グラフでは、↓ がローカルブランチの先端、↑ が追跡リモートの先端を示す (両方同時 = ローカルとリモートが同期)"
"show the selected commit's files in the left column (focus stays on the commit list)" = "選択中コミットのファイルを左カラムに表示 (フォーカスはコミットリストのまま)"
"drill into the selected commit's files: open the files view AND move focus to the file tree (l + focus tree)" = "選択中コミットのファイルへドリルイン: ファイルビューを開き、フォーカスをファイルツリーへ移動 (l + ツリーフォーカス)"
"view the selected commit's full message in a scrollable popup; also works while the files view is open (the popup layers over the tree, esc returns to it)" = "選択中コミットの全文メッセージをスクロール可能なポップアップで表示; ファイルビューが開いていても使えます (ポップアップはツリーの上に重なり、esc で戻る)"
"open the selected commit's message in the external editor ($EDITOR, read-only)" = "選択中コミットのメッセージを外部エディタで開く ($EDITOR、読み取り専用)"
"uncommitted work shows as ◇ Working tree / ◇ Staged rows atop the graph (only when dirty); l/enter diffs them (working tree vs index, index vs HEAD); commit-only actions are unavailable on them" = "未コミットの作業はグラフ上部に ◇ Working tree / ◇ Staged 行として表示 (ダーティ時のみ); l/enter で差分表示 (ワーキングツリー vs インデックス、インデックス vs HEAD); コミット専用アクションは使えません"
"the ◇ Working tree / ◇ Staged rows can be added (m) to the ◉ compare selection like commits — Compare selection then diffs a commit against your working copy or index" = "◇ Working tree / ◇ Staged 行もコミットと同様に (m で) ◉ 比較選択へ追加可能 — Compare selection でコミットとワーキングコピーまたはインデックスを差分表示"
"highlight search: keep all commits visible, dim non-matches (graph stays); ctrl+↑/↓ jump prev/next match; enter keeps, esc clears" = "ハイライト検索: 全コミットを表示したまま、非マッチを暗く表示 (グラフは維持); ctrl+↑/↓ で前後のマッチへジャンプ; enter で確定、esc で解除"
"Commits: eager search — if the active / filter or @ highlight query isn't in the loaded commits, page history to find it and jump to it (asks before scanning deeper)" = "Commits: 積極検索 — アクティブな / フィルタや @ ハイライトのクエリが読み込み済みコミットに無ければ、履歴をページングして探し、そこへジャンプ (さらに深くスキャンする前に確認)"
"Commits: load the next batch of commits now (without scrolling to the end)" = "Commits: 次のコミットバッチを今すぐ読み込む (末尾までスクロールせずに)"
"jump to the top / bottom of the focused list; End on Commits also loads the next batch" = "フォーカス中リストの先頭 / 末尾へジャンプ; Commits での End は次のバッチも読み込む"
"filter commits by path / author / message / date (popup; empty fields clear that axis, ctrl+r clears all fields); graph hides while filtered" = "コミットをパス / 作者 / メッセージ / 日付でフィルタ (ポップアップ; 空欄はその軸を解除、ctrl+r で全欄クリア); フィルタ中はグラフ非表示"
"add / remove the selected commit (or ◇ Working tree / ◇ Staged row) to the ◉ compare selection; the . menu then drives Compare selection or Squash" = "選択中コミット (または ◇ Working tree / ◇ Staged 行) を ◉ 比較選択に追加 / 削除; その後 . メニューから Compare selection や Squash を実行"
"mark / unmark the selected commit for compare — the same ◉ set as m but capped at two: the second space-mark opens the comparison immediately (with 2 already marked, space a marked one to unmark first; esc clears ALL marks, or . → Unmark all commits). Re-opening the comparison already on screen keeps it (no reload)" = "選択中コミットを比較用にマーク / 解除 — m と同じ ◉ セットだが上限 2: 2 つ目の space マークで即座に比較を開く (2 つマーク済みのときは、マーク済みのものを space で先に解除; esc で全マーク解除、または . → Unmark all commits)。すでに画面上にある比較を再度開いてもそのまま (再読み込みなし)"
"view message / open message in editor / rename commit / copy commit id / Create branch here / Create worktree here / Cherry-pick here / Revert this commit / Reset to this commit (soft|mixed|hard) / Compare against working tree / Compare against staged / Export commit as patch / Add to compare selection (space) / Unmark commit / Unmark all commits / Compare selection / Squash N commits / Drop N selected commits / Show all branches when soloed / Show as list|graph (.-menu)" = "メッセージ表示 / エディタでメッセージを開く / コミット名変更 / コミット ID コピー / Create branch here / Create worktree here / Cherry-pick here / Revert this commit / Reset to this commit (soft|mixed|hard) / Compare against working tree / Compare against staged / Export commit as patch / Add to compare selection (space) / Unmark commit / Unmark all commits / Compare selection / Squash N commits / Drop N selected commits / Show all branches when soloed / Show as list|graph (.-メニュー)"
"Compare against working tree / Compare against staged (.-menu): open the files view as a whole-tree diff of this commit vs your working copy / the index; enter on a file diffs that path" = "Compare against working tree / Compare against staged (.-メニュー): このコミットとワーキングコピー / インデックスのツリー全体差分としてファイルビューを開く; ファイル上の enter でそのパスを差分表示"
"grow the ◉ compare selection (a contiguous run of commits)" = "◉ 比較選択を拡大 (連続するコミットの並び)"
"Compare selection (.-menu): toggle commits into the ◉ set (m / Add to compare selection / shift+↑↓), then Compare selection — 2 = the diff between them, 3+ = the combined diff of the range (oldest^..newest, refused from a root commit); Unmark all commits (N) empties it" = "Compare selection (.-メニュー): コミットを ◉ セットにトグル (m / Add to compare selection / shift+↑↓) してから Compare selection — 2 つ = 両者間の差分、3 つ以上 = 範囲の結合差分 (oldest^..newest、ルートコミットからは拒否); Unmark all commits (N) で空にする"
"Squash N commits (.-menu): with 2+ commits in the ◉ set, combine the selected commits into one (messages concatenated; reword afterward). When they aren't adjacent, a prompt offers Reorder & squash — the skipped in-between commits move to just after the squash. Off-branch selections are refused; conflicts pause for `git rebase --continue`" = "Squash N commits (.-メニュー): ◉ セットに 2 つ以上のコミットがあるとき、選択したコミットを 1 つに統合 (メッセージは連結; 後で reword)。隣接していない場合は Reorder & squash を提案 — 間のスキップされたコミットは squash 直後へ移動。ブランチ外の選択は拒否; コンフリクトは `git rebase --continue` のため一時停止"
"Drop N selected commits (.-menu): with 2+ commits in the ◉ set, delete them all in one interactive rebase (no adjacency needed; gaps stay). Off-branch / working-tree-or-staged selections are refused; conflicts pause for `git rebase --continue`. Drop commit (no set) drops just the cursor commit" = "Drop N selected commits (.-メニュー): ◉ セットに 2 つ以上のコミットがあるとき、1 回の対話的リベースで全部削除 (隣接不要; 間は残る)。ブランチ外 / ワーキングツリー・ステージの選択は拒否; コンフリクトは `git rebase --continue` のため一時停止。Drop commit (セットなし) はカーソル位置のコミットだけを削除"
"on a commit that is a branch's tip: Rename branch <name> / Delete branch <name> (.-menu) — one pair per local tip; delete is hidden for a checked-out branch" = "ブランチ先端のコミットで: Rename branch <name> / Delete branch <name> (.-メニュー) — ローカル先端ごとに 1 組; チェックアウト中のブランチでは delete 非表示"
"on a non-merge commit of the current branch: Move commit up (newer) / Move commit down (older) / Drop commit (.-menu) — one-step interactive rebase; conflicts pause for `git rebase --continue`" = "現在ブランチの非マージコミットで: Move commit up (newer) / Move commit down (older) / Drop commit (.-メニュー) — 1 ステップの対話的リベース; コンフリクトは `git rebase --continue` のため一時停止"
"Show as list / Show as graph (.-menu): flat ●-gutter list vs the lane graph; lane color marks each commit's line of development" = "Show as list / Show as graph (.-メニュー): フラットな ● ガター一覧 vs レーングラフ; レーン色は各コミットの系統を示す"
"narrow / widen the commit graph window (in lanes); a ⋯ marks lanes beyond each edge" = "コミットグラフウィンドウを狭める / 広げる (レーン単位); ⋯ は各端の先にあるレーンを示す"
"pan the commit graph window left / right" = "コミットグラフウィンドウを左 / 右にパン"
"snap the commit graph window to the selected commit's node" = "コミットグラフウィンドウを選択中コミットのノードにスナップ"
"more commits load automatically as you near the end" = "末尾に近づくと自動でさらにコミットを読み込みます"
"Filter mode (/)" = "フィルタモード (/)"
"move the selection through the filtered rows" = "フィルタ結果の行の中で選択を移動"
"keep the filter and leave input mode" = "フィルタを保持して入力モードを抜ける"
"cancel the filter" = "フィルタをキャンセル"
"delete; any typed text narrows the list" = "削除; 入力した文字でリストを絞り込み"
"Worktree popup (w/W)" = "ワークツリーポップアップ (w/W)"
"next input field / confirm" = "次の入力フィールド / 確定"
"edit the previewed branch name (new-branch mode)" = "プレビュー中のブランチ名を編集 (新規ブランチモード)"
"create the worktree" = "ワークツリーを作成"
"create the worktree and switch to it" = "ワークツリーを作成して切り替え"
"cancel" = "キャンセル"
"Branch popup (b/B)" = "ブランチポップアップ (b/B)"
"create the branch" = "ブランチを作成"
"Commit popup (c/C)" = "コミットポップアップ (c/C)"
"switch field (title / description)" = "フィールドを切り替え (タイトル / 説明)"
"title: move to the description field; description: insert a newline" = "タイトル: 説明フィールドへ移動; 説明: 改行を挿入"
"generate a commit message from the staged diff with a configured commit_message external agent (Settings → External tools) — fills the title/description fields for you to review; nothing commits until ctrl+s. More than one tool configured shows a numbered chooser; an unapproved command shows a first-run approval (remembered per repo); existing title/description text asks before being replaced; esc cancels an in-flight run" = "設定済みの commit_message 外部エージェント (設定 → 外部ツール) でステージ済み差分からコミットメッセージを生成 — タイトル/説明フィールドを埋めるのでレビューしてください; ctrl+s まで何もコミットされません。複数のツールが設定済みなら番号付きの選択、未承認コマンドは初回承認を表示 (リポジトリごとに記憶)、既存のタイトル/説明があれば置き換え前に確認; esc で実行中の生成をキャンセル"
"toggle a wider / fullscreen commit box (easier to read a long generated message); ctrl+t again restores" = "コミットボックスの拡大 / フルスクリーンを切り替え (長い生成メッセージが読みやすい); もう一度 ctrl+t で復元"
"commit (or amend, when opened with C)" = "コミット (C で開いた場合は修正)"
"Pair-op popup (m on a second row)" = "ペア操作ポップアップ (2 行目で m)"
"choose an operation (Branches: merge, rebase, interactive rebase)" = "操作を選択 (Branches: マージ、リベース、対話的リベース)"
"run the operation (clears the mark)" = "操作を実行 (マークを解除)"
"close, keeping the mark" = "閉じる、マークは保持"
"Interactive rebase editor" = "対話的リベースエディタ"
"set the row action: pick / reword / squash / drop" = "行のアクションを設定: pick / reword / squash / drop"
"move the focused commit up / down" = "フォーカス中のコミットを上 / 下へ移動"
"move the cursor" = "カーソルを移動"
"start the rebase with the current plan" = "現在のプランでリベースを開始"
"reset every row to pick, original order" = "全行を pick・元の順序にリセット"
"cancel (close without rebasing)" = "キャンセル (リベースせずに閉じる)"
"Commit files view (l)" = "コミットファイルビュー (l)"
"switch focus between the file tree and the commit list" = "ファイルツリーとコミットリストの間でフォーカスを切り替え"
"move on the focused side (commits side reloads the tree)" = "フォーカス側で移動 (コミット側はツリーを再読み込み)"
"page the focused side" = "フォーカス側をページ送り"
"scroll the file tree from either side (wheel: 3)" = "どちら側からでもファイルツリーをスクロール (ホイール: 3)"
"search the focused side: file paths (tree) or the commit list (commits side); enter keeps it, esc cancels" = "フォーカス側を検索: ファイルパス (ツリー) またはコミットリスト (コミット側); enter で確定、esc でキャンセル"
"tree side: diff of the selected file (changed-files mode vs parent; all-files mode vs the working tree). Commit-list side: drill in — move focus to the file tree" = "ツリー側: 選択ファイルの差分 (変更ファイルモードは親と、全ファイルモードはワーキングツリーと)。コミットリスト側: ドリルイン — フォーカスをファイルツリーへ移動"
"toggle all files: every file in the commit's tree (as if checked out) vs only the files it changed" = "全ファイル切り替え: コミットのツリー内の全ファイル (チェックアウトしたときの状態) vs 変更したファイルのみ"
"tree side: View file — show the file's content at this commit (no diff) in the right pane ([↑/↓] scroll, [z] view mode, [esc] close, [←] back to the tree); Open in external editor — open that content in $VISUAL/$EDITOR, read-only" = "ツリー側: View file — このコミット時点のファイル内容を右ペインに表示 (差分なし) ([↑/↓] スクロール、[z] 表示モード、[esc] 閉じる、[←] ツリーへ戻る); Open in external editor — その内容を $VISUAL/$EDITOR で開く、読み取り専用"
"view the underlying commit's full message in a popup over the tree (esc returns; commit views only, not stash/compare)" = "元のコミットの全文メッセージをツリー上のポップアップで表示 (esc で戻る; コミットビューのみ、stash/compare は不可)"
"history of the selected file (tree side)" = "選択ファイルの履歴 (ツリー側)"
"blame of the selected file (tree side)" = "選択ファイルの blame (ツリー側)"
"branch-pair compare only: cycle the origin filter — all differences / only files the marked branch changed / only files the selected branch changed (computed from the merge base; the diff shown per file is always the tip-to-tip difference)" = "ブランチペア比較のみ: 起点フィルタを切り替え — 全差分 / マークしたブランチが変更したファイルのみ / 選択したブランチが変更したファイルのみ (マージベースから計算; ファイルごとの差分は常に先端間の差分)"
"commits side: the full Commits-panel menu (cherry-pick / revert / reset / create branch|worktree|tag / compare / …); tree side: copy path/name" = "コミット側: Commits パネルの完全メニュー (cherry-pick / revert / reset / ブランチ|ワークツリー|タグ作成 / 比較 / …); ツリー側: パス/名前をコピー"
"commits side: narrow / widen / snap / pan the commit graph window (same as the Commits panel)" = "コミット側: コミットグラフウィンドウを狭める / 広げる / スナップ / パン (Commits パネルと同じ)"
"clear the search, then close" = "検索を解除し、次に閉じる"
"close" = "閉じる"
"Stash window (S)" = "スタッシュウィンドウ (S)"
"move the stash selection" = "スタッシュ選択を移動"
"page the stash list" = "スタッシュリストをページ送り"
"open the file tree for the stash (then ←/→ focus tree/list, like commit files)" = "スタッシュのファイルツリーを開く (その後 ←/→ でツリー/リストにフォーカス、コミットファイルと同様)"
"stash actions: apply / pop / drop (drop confirms; [z] mode in the menu)" = "スタッシュ操作: apply / pop / drop (drop は確認あり; メニューで [z] モード)"
"close the stash window" = "スタッシュウィンドウを閉じる"
"Diff view (enter)" = "差分ビュー (enter)"
"scroll one line" = "1 行スクロール"
"scroll one screen" = "1 画面スクロール"
"next / previous change (also ctrl+↓/↑; press again at the end/start to wrap around)" = "次 / 前の変更 (ctrl+↓/↑ も可; 端でもう一度押すと折り返し)"
"from the last / first change, press twice to step to the next / previous file in the list (a bottom-left cue advertises it; a notice names the new file)" = "最後 / 最初の変更で 2 回押すとリスト内の次 / 前のファイルへ移動 (左下にキュー表示; 通知が新しいファイル名を表示)"
"jump to top / bottom of the file; at the edge a bottom-left cue appears and pressing it again steps to the previous / next file in the list (a notice names the new file)" = "ファイルの先頭 / 末尾へジャンプ; 端では左下にキューが現れ、もう一度押すとリスト内の前 / 次のファイルへ移動 (通知が新しいファイル名を表示)"
"toggle full file ↔ changed lines only" = "ファイル全体 ↔ 変更行のみを切り替え"
"scroll mode: pan left / right / reset" = "スクロールモード: 左 / 右へパン / リセット"
"history of this file at the shown revision" = "表示中リビジョンでのこのファイルの履歴"
"blame of this file at the shown revision" = "表示中リビジョンでのこのファイルの blame"
"export this file's diff as patch" = "このファイルの差分をパッチとしてエクスポート"
"History view (h)" = "履歴ビュー (h)"
"move between commits (the diff updates on the right)" = "コミット間を移動 (右側の差分が更新)"
"open the selected commit's diff full-screen (esc returns)" = "選択中コミットの差分をフルスクリーンで開く (esc で戻る)"
"blame the file at the selected commit" = "選択中コミット時点のファイルを blame"
"open the selected commit's version of the file in your external editor (read-only)" = "選択中コミット時点のバージョンのファイルを外部エディタで開く (読み取り専用)"
"back" = "戻る"
"Blame view (b)" = "Blame ビュー (b)"
"move the line cursor" = "行カーソルを移動"
"move the cursor one screen" = "カーソルを 1 画面移動"
"file history at the commit under the cursor" = "カーソル下のコミットでのファイル履歴"
"open the blamed file (at this revision) in your external editor (read-only)" = "blame 対象のファイル (このリビジョン) を外部エディタで開く (読み取り専用)"
"Repo switcher (R)" = "リポジトリスイッチャー (R)"
"switch to the selected repository" = "選択中のリポジトリへ切り替え"
"forget the selected repository" = "選択中のリポジトリを忘れる"
"close (type to filter)" = "閉じる (入力でフィルタ)"
"Action menu (.)" = "アクションメニュー (.)"
"run the action with that key; lists context actions only (row + panel)" = "そのキーのアクションを実行; コンテキストアクションのみ表示 (行 + パネル)"
"move; enter runs the highlighted action" = "移動; enter でハイライト中のアクションを実行"
"filter the list by name (enter keeps, esc cancels)" = "名前でリストをフィルタ (enter で確定、esc でキャンセル)"
"Copy commit id / commit title (Commits); Copy file path / absolute file path / file name (Files/Staged) — OSC 52" = "コミット ID / コミットタイトルをコピー (Commits); ファイルパス / 絶対ファイルパス / ファイル名をコピー (Files/Staged) — OSC 52"
"Settings (,)" = "設定 (,)"
"move between entries" = "エントリ間を移動"
"open the selected setting (external tools, identity, branch prefixes, refresh rates, commit sort, …). The agent-skills picker moved to the ctrl+p palette (Set up agent skills). In the add-prefix form, ctrl+d shows a token/date-format cheat sheet" = "選択した設定を開く (外部ツール、ID、ブランチ接頭辞、更新間隔、コミット順、…)。エージェントスキルピッカーは ctrl+p パレット (Set up agent skills) に移動しました。接頭辞追加フォームでは ctrl+d でトークン/日付フォーマットのチートシートを表示"
"back to the menu from a sub-screen, then close" = "サブ画面からメニューへ戻り、次に閉じる"
"Decision modal" = "決定モーダル"
